          <span className={`chip ${invoiceFilter==='yes'?'selected':''}`} onClick={()=>setInvoiceFilter(invoiceFilter==='yes'?'all':'yes')}>Invoiced</span>
        </div>}
      </div>

      {/* ── ITEM 4: BULK ACTION BAR ── */}
      {viewMode==='list'&&selectedIds.length>0&&<div className="card" style={{padding:'10px 16px',display:'flex',gap:10,alignItems:'center',flexWrap:'wrap',background:'var(--primary-bg)',border:'1px solid var(--primary-light)'}}>
        <strong style={{fontSize:13,color:'var(--primary)'}}>{selectedIds.length} selected</strong>
        <button className="btn btn-sm btn-success" onClick={()=>applyBulk({invoiced:true})}><Icon name="check" size={14}/>Mark Invoiced</button>
        <button className="btn btn-sm btn-secondary" onClick={()=>applyBulk({invoiced:false})}>Mark Not Invoiced</button>
        <div style={{display:'flex',alignItems:'center',gap:6,marginLeft:8}}>
          <span style={{fontSize:12,color:'var(--text-secondary)'}}>Set status:</span>
          <select defaultValue="" style={{width:'auto',padding:'5px 8px',fontSize:12}}
            onChange={e=>{if(e.target.value){applyBulk({status:e.target.value});e.target.value='';}}}>
            <option value="">-- choose --</option>
            {STATUS_OPTIONS.map(s=><option key={s.value} value={s.value}>{s.label}</option>)}
          </select>
        </div>
        <button className="btn btn-sm btn-secondary" style={{marginLeft:'auto'}} onClick={clearSelection}>Clear</button>
      </div>}

      {/* List View */}
      {viewMode==='list'&&<div className="card" style={{padding:0}}><div className="inv-table-wrap"><table className="freeze-table">
        <thead><tr>
          <th style={{width:36,textAlign:'center'}}><input type="checkbox" checked={allVisibleSelected} onChange={toggleAllVisible} style={{width:'auto',cursor:'pointer'}} title="Select all visible"/></th>
          <SortTh label="Customer" colKey="customer" sortKey={olSK} sortDir={olSD} onSort={olToggle}/><SortTh label="Order Date" colKey="date" sortKey={olSK} sortDir={olSD} onSort={olToggle}/><SortTh label="Products" colKey="products" sortKey={olSK} sortDir={olSD} onSort={olToggle}/><SortTh label="Status" colKey="status" sortKey={olSK} sortDir={olSD} onSort={olToggle}/><SortTh label="Invoiced" colKey="invoiced" sortKey={olSK} sortDir={olSD} onSort={olToggle}/><th style={{textAlign:'right'}}>Actions</th></tr></thead>
        <tbody>{filtered.length===0?<tr><td colSpan="7" style={{textAlign:'center',padding:40,color:'var(--text-secondary)'}}>No orders found</td></tr>:filtered.map(o=>{
          const st=getStatus(o.status);const pc=Object.keys(o.products||{}).filter(k=>num(o.products[k])>0).length;
          const done=isOrderFullyDelivered(o.id);
          const isSel=!!selected[o.id];
          return <tr key={o.id} className={isSel?'row-sel':''} style={{cursor:'pointer',background:isSel?'var(--primary-bg)':undefined}} onClick={()=>setEditOrder(o)}>
            <td style={{textAlign:'center'}} onClick={e=>e.stopPropagation()}>
              <input type="checkbox" checked={isSel} onChange={()=>toggleOne(o.id)} style={{width:'auto',cursor:'pointer'}}/>
            </td>
            <td style={{fontWeight:500}}>{o.customer}</td><td>{fmtDate(o.date)}</td><td><span className="tag">{pc} product{pc!==1?'s':''}</span></td>
            <td><span className={`status-badge ${st.cls}`}><span className={`status-dot ${st.dot}`}></span>{st.label}</span></td>
            <td>{o.invoiced?<span style={{color:'var(--success)',fontWeight:600}}>Yes</span>:'No'}</td>
            <td style={{textAlign:'right',whiteSpace:'nowrap'}} onClick={e=>e.stopPropagation()}>
              {/* ── ITEM 2: deliver straight from the order row ── */}
              <button className="btn btn-sm btn-success" style={{marginRight:4}} disabled={done}
                title={done?'Fully delivered':'Create a delivery for this order'}
                onClick={()=>setDeliverOrder(o)}><Icon name="truck" size={14}/>{done?'Delivered':'Deliver'}</button>
              <button className="btn-icon" style={{marginRight:4}} onClick={()=>setEditOrder(o)}><Icon name="edit" size={14}/></button>
              <button className="btn-icon" onClick={()=>{if(confirm(`Delete ${o.customer}'s order? This cannot be undone.`))deleteOrder(o.id);}}><Icon name="trash" size={14}/></button>
            </td>
          </tr>;
        })}</tbody>
      </table></div></div>}

      {/* Spreadsheet View (BWF Order Forecast style) */}
      {viewMode==='matrix'&&<div className="card spreadsheet-wrap">
        <div style={{padding:'12px 16px',borderBottom:'1px solid var(--border)',display:'flex',justifyContent:'space-between',alignItems:'center'}}>
          <h3 style={{fontSize:14,fontWeight:600}}>BWF Order Forecast — {activeYear}</h3>
          <span style={{fontSize:12,color:'var(--text-secondary)'}}>{spreadsheetRows.length} customers, {spreadsheetProducts.length} products</span>
        </div>
        <div className="spreadsheet-scroll">
          <table style={{fontSize:11}}>
            <colgroup>
              <col style={{width:180}}/>
              <col style={{width:50}}/>
              {spreadsheetProducts.map(p=><col key={p.id} style={{width:95}}/>)}
            </colgroup>
            <thead>
              <tr style={{position:'sticky',top:0,zIndex:2,background:'#f8fafc'}}>
                <SortTh label="Customer" colKey="customer" sortKey={mSK} sortDir={mSD} onSort={mToggle} style={{position:'sticky',left:0,background:'#f8fafc',zIndex:3,whiteSpace:'nowrap'}}/>
                <SortTh label="Status" colKey="status" sortKey={mSK} sortDir={mSD} onSort={mToggle} style={{textAlign:'center'}}/>
                {spreadsheetProducts.map(p=><SortTh key={p.id} label={productDisplayName(p)} colKey={p.id} sortKey={mSK} sortDir={mSD} onSort={mToggle} style={{textAlign:'right',fontSize:10,padding:'8px 6px',whiteSpace:'nowrap'}}/>)}
              </tr>
            </thead>
            <tbody>
              {spreadsheetRows.length===0?<tr><td colSpan={spreadsheetProducts.length+2} style={{textAlign:'center',padding:40,color:'var(--text-secondary)'}}>No orders found</td></tr>:spreadsheetRows.map((r,ri)=>{
                const st=getStatus(r.status);const bg=ri%2===0?'#fff':'#f8fafc';
                // BUGFIX: was `yearOrders.find(o2=>o2.customer===r.customer)` — a matrix row
                // AGGREGATES every order for that customer, so .find() always opened the first
                // one and edits silently landed on the wrong order. Now: open directly when
                // there's exactly one, otherwise show a picker.
                return <tr key={r.customer} style={{cursor:'pointer',background:bg}} onClick={()=>{
                  const os=yearOrders.filter(o2=>o2.customer===r.customer);
                  if(os.length===1) setEditOrder(os[0]);
                  else if(os.length>1) setPickOrder({customer:r.customer,orders:os});
                }}>
                  <td style={{fontWeight:500,position:'sticky',left:0,background:bg,zIndex:1,borderRight:'2px solid var(--border)',whiteSpace:'nowrap',padding:'6px 10px'}}>{r.customer}{r.orderCount>1&&<span style={{fontSize:9,color:'var(--text-secondary)',marginLeft:4}}>({r.orderCount})</span>}</td>
                  <td style={{textAlign:'center'}}><span className={`status-dot ${st.dot}`} title={st.label} style={{display:'inline-block'}}></span></td>
                  {spreadsheetProducts.map(p=>{const v=r.products[p.id];return <td key={p.id} className="inv-cell" style={{fontSize:11,padding:'6px 8px',color:v?'var(--text)':'#cbd5e1'}}>{v?fmt(v):'—'}</td>;})}
                </tr>;
              })}
              <tr style={{fontWeight:700,background:'#f0f9ff',position:'sticky',bottom:0,zIndex:2}}>
                <td style={{position:'sticky',left:0,background:'#f0f9ff',zIndex:3,borderRight:'2px solid var(--border)',fontWeight:700,borderTop:'2px solid var(--primary)',padding:'6px 10px'}}>TOTALS</td>
                <td style={{background:'#f0f9ff',borderTop:'2px solid var(--primary)'}}></td>
                {spreadsheetProducts.map(p=><td key={p.id} className="inv-cell" style={{fontWeight:700,fontSize:11,padding:'6px 8px',background:'#f0f9ff',borderTop:'2px solid var(--primary)'}}>{colTotals[p.id]?fmt(colTotals[p.id]):'—'}</td>)}
              </tr>
            </tbody>
          </table>
        </div>
      </div>}

      {(showAdd||editOrder)&&<OrderModal order={editOrder} onClose={()=>{setShowAdd(false);setEditOrder(null);}} onDeliver={o=>{setEditOrder(null);setShowAdd(false);setDeliverOrder(o);}}/>}

      {/* Matrix row with multiple orders — pick which one to open (defect 7) */}
      {pickOrder&&<Modal title={`${pickOrder.customer} — ${pickOrder.orders.length} orders`} onClose={()=>setPickOrder(null)}>
        <div className="modal-body">
          <p style={{fontSize:13,color:'var(--text-secondary)',marginBottom:12}}>This customer has more than one order this year. Choose which to open:</p>
          <div style={{border:'1px solid var(--border)',borderRadius:6,overflow:'hidden'}}>
            {pickOrder.orders.map(o=>{const st=getStatus(o.status);const pc=Object.keys(o.products||{}).filter(k=>num(o.products[k])>0).length;
              return <div key={o.id} style={{display:'flex',alignItems:'center',gap:10,padding:'10px 14px',cursor:'pointer',borderBottom:'1px solid #f1f5f9'}}
                onClick={()=>{setEditOrder(o);setPickOrder(null);}}>
                <span style={{flex:1,fontWeight:500}}>{fmtDate(o.date)}</span>
                <span className="tag">{pc} product{pc!==1?'s':''}</span>
                <span className={`status-badge ${st.cls}`}><span className={`status-dot ${st.dot}`}></span>{st.label}</span>
              </div>;})}
          </div>
        </div>
        <div className="modal-footer"><button className="btn btn-secondary" onClick={()=>setPickOrder(null)}>Cancel</button></div>
      </Modal>}

      {/* Item 2: delivery launched from an order row, pre-scoped to that order */}
      {deliverOrder&&<NewDeliveryModal presetOrderId={deliverOrder.id} onClose={()=>setDeliverOrder(null)}/>}
    </div>
  );
}

function OrderModal({order,onClose,onDeliver}) {
  const {allProducts,productsAZ,allCustomers,addOrder,updateOrder,addCustomer,showToast,isOrderFullyDelivered} = useApp();
  const [prodSearch,setProdSearch] = useState('');   // item 6: product search
  const [customer,setCustomer] = useState(order?.customer||'');
  const [date,setDate] = useState(order?.date||today());
  const [status,setStatus] = useState(order?.status||'pending');
  const [invoiced,setInvoiced] = useState(order?.invoiced||false);
  const [products,setProducts] = useState(order?.products||{});
  const [custSearch,setCustSearch] = useState('');
  const [showAllProducts,setShowAllProducts] = useState(false);
  const [showAddCust,setShowAddCust] = useState(false);
  const [newCustName,setNewCustName] = useState('');
  const filteredCust=allCustomers.filter(c=>c.toLowerCase().includes(custSearch.toLowerCase()));
  const setProduct=(pid,val)=>{const v=num(val);setProducts(p=>v>0?{...p,[pid]:v}:Object.fromEntries(Object.entries(p).filter(([k])=>k!==pid)));};

  // Item 6: products split into "already on the order" (always visible) and
  // "available to add" (searchable), both sorted A-Z via productsAZ.
  const selectedProducts = useMemo(()=>productsAZ.filter(p=>num(products[p.id])>0),[productsAZ,products]);
  const availableProducts = useMemo(()=>{
    const q=prodSearch.trim().toLowerCase();
    const pool=productsAZ.filter(p=>!(num(products[p.id])>0));
    return q?pool.filter(p=>productDisplayName(p).toLowerCase().includes(q)):pool;
  },[productsAZ,products,prodSearch]);
  const save=()=>{if(!customer){alert('Select a customer');return;}if(Object.keys(products).length===0){alert('Add at least one product');return;}if(order){updateOrder(order.id,{customer,date,status,invoiced,products});showToast('Order updated');}else addOrder({customer,date,status,invoiced,products});onClose();};
  return <Modal title={order?'Edit Order':'New Order'} onClose={onClose} wide>
    <div className="modal-body">
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12}}>
        <div className="form-group"><label>Customer</label>{order?<input value={customer} readOnly style={{background:'#f8fafc'}}/>:<div><input placeholder="Search customer..." value={custSearch} onChange={e=>{setCustSearch(e.target.value);if(!customer)setCustomer('');}}/>
          {custSearch&&!customer&&<div style={{border:'1px solid var(--border)',borderRadius:6,maxHeight:150,overflowY:'auto',marginTop:4}}>{filteredCust.slice(0,10).map(c=><div key={c} style={{padding:'6px 12px',cursor:'pointer',fontSize:13}} onClick={()=>{setCustomer(c);setCustSearch(c);}} onMouseEnter={e=>e.target.style.background='#f1f5f9'} onMouseLeave={e=>e.target.style.background=''}>{c}</div>)}
            {filteredCust.length===0&&custSearch.length>1&&<div style={{padding:'6px 12px',cursor:'pointer',fontSize:13,color:'var(--primary)',fontWeight:500}} onClick={()=>{addCustomer(custSearch);setCustomer(custSearch);setCustSearch(custSearch);}} onMouseEnter={e=>e.target.style.background='var(--primary-bg)'} onMouseLeave={e=>e.target.style.background=''}>+ Add "{custSearch}" as new customer</div>}
          </div>}
        </div>}</div>
        <div className="form-group"><label>Order Date</label><input type="date" value={date} onChange={e=>setDate(e.target.value)}/></div>
        <div className="form-group"><label>Status</label><select value={status} onChange={e=>setStatus(e.target.value)}>{STATUS_OPTIONS.map(s=><option key={s.value} value={s.value}>{s.label}</option>)}</select></div>
        <div className="form-group" style={{display:'flex',alignItems:'flex-end',paddingBottom:8}}><label style={{display:'flex',alignItems:'center',gap:8,cursor:'pointer'}}><input type="checkbox" checked={invoiced} onChange={e=>setInvoiced(e.target.checked)} style={{width:'auto'}}/>Invoiced</label></div>
      </div>
      {/* ── ITEM 6: SEARCHABLE, ALPHABETICALLY SORTED PRODUCT PICKER ──
          Previously rendered all ~45 products in DEFAULT_PRODUCTS (spreadsheet) order
          with no filter, so finding one meant scanning the whole grid by eye. */}
      <h4 style={{fontSize:14,fontWeight:600,margin:'16px 0 8px'}}>Products & Quantities</h4>

      {/* Selected products always render first, so an active search never hides
          quantities the user has already entered. */}
      {selectedProducts.length>0&&<div style={{marginBottom:12}}>
        <p style={{fontSize:11,fontWeight:600,color:'var(--text-secondary)',marginBottom:6,textTransform:'uppercase',letterSpacing:.5}}>On this order ({selectedProducts.length})</p>
        <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(240px,1fr))',gap:8}}>
          {selectedProducts.map(p=><div key={p.id} style={{display:'flex',alignItems:'center',gap:8}}>
            <span style={{fontSize:12,flex:1,minWidth:0,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',fontWeight:500}}>{productDisplayName(p)}</span>
            <input type="number" step="0.1" min="0" style={{width:80}} placeholder="0" value={products[p.id]||''} onChange={e=>setProduct(p.id,e.target.value)}/>
            <button className="btn-icon" title="Remove" onClick={()=>setProduct(p.id,0)} style={{padding:4}}><Icon name="x" size={12}/></button>
          </div>)}
        </div>
      </div>}

      <div className="search-box" style={{marginBottom:8}}>
        <Icon name="search"/>
        <input placeholder="Type a product name to find it..." value={prodSearch} onChange={e=>setProdSearch(e.target.value)}/>
      </div>
      <div style={{maxHeight:260,overflowY:'auto',border:'1px solid var(--border)',borderRadius:6,padding:8}}>
        {availableProducts.length===0
          ? <p style={{fontSize:12,color:'var(--text-secondary)',textAlign:'center',padding:16}}>
              {prodSearch?`No products match "${prodSearch}"`:'All products are already on this order.'}</p>
          : <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(240px,1fr))',gap:8}}>
              {availableProducts.map(p=><div key={p.id} style={{display:'flex',alignItems:'center',gap:8}}>
                <span style={{fontSize:12,flex:1,minWidth:0,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',color:'var(--text-secondary)'}}>{productDisplayName(p)}</span>
                <input type="number" step="0.1" min="0" style={{width:80}} placeholder="0" value={products[p.id]||''} onChange={e=>setProduct(p.id,e.target.value)}/>
              </div>)}
            </div>}
      </div>
    </div>
    <div className="modal-footer">
      <button className="btn btn-secondary" onClick={onClose}>Cancel</button>
      {/* Item 2: deliver directly from inside an order */}
      {order&&onDeliver&&<button className="btn btn-success" disabled={isOrderFullyDelivered(order.id)}
        title={isOrderFullyDelivered(order.id)?'This order is fully delivered':'Create a delivery for this order'}
        onClick={()=>onDeliver(order)}><Icon name="truck" size={14}/>Deliver</button>}
      <button className="btn btn-primary" onClick={save}>{order?'Save Changes':'Create Order'}</button>
    </div>
  </Modal>;
}

// ══════════════════════════
// ── CUSTOMERS SCREEN ──
// ══════════════════════════
function CustomersScreen({onNavigate}) {
  const {data,allProducts,allCustomers,activeCustomers,addCustomer,setCustomerMeta,equipmentByCustomer,showToast} = useApp();
  const [showAddCustomer,setShowAddCustomer] = useState(false);
  const [newCustName,setNewCustName] = useState('');
  const [newCustPhone,setNewCustPhone] = useState('');
  const [search,setSearch] = useState('');
  const [editPhone,setEditPhone] = useState(null);   // item 5.1
  const {sortKey:cSK,sortDir:cSD,toggleSort:cToggle,sortFn:cSort} = useSort('name');

  const pumpsByCustomer=useMemo(()=>{const m={};equipmentByCustomer.forEach(r=>{m[r.customer]=r;});return m;},[equipmentByCustomer]);

  const customerData=useMemo(()=>activeCustomers.map(name=>{
    const orders=data.orders.filter(o=>o.customer===name);const tp={};
    orders.forEach(o=>{Object.entries(o.products||{}).forEach(([pid,qty])=>{tp[pid]=(tp[pid]||0)+num(qty);});});
    const group=data.customerGroups.find(g=>g.members.includes(name));
    // Copy before sorting — .sort() mutates in place, and mutating a memo input
    // makes the render order depend on how many times the memo happened to run.
    const latest=[...orders].sort((a,b)=>new Date(b.date||0)-new Date(a.date||0))[0];
    const eq=pumpsByCustomer[name];
    return{name,orders,totalProducts:tp,group:group?.name||null,latest,latestDate:latest?.date||'',latestStatus:latest?latest.status:'pending',
           phone:(data.customerMeta||{})[name]?.phone||'',pumpsHeld:eq?eq.pumpsHeld:0,pumpsOut:eq?eq.pumpsOut:0};
  }).filter(c=>c.name.toLowerCase().includes(search.toLowerCase())),[activeCustomers,data,search,pumpsByCustomer]);

  const sortedCustomers=useMemo(()=>cSort(customerData,(c,k)=>{switch(k){case'name':return c.name;case'group':return c.group||'';case'phone':return c.phone||'';case'orders':return c.orders.length;case'latest':return c.latestDate;case'status':return c.latestStatus;case'pumps':return c.pumpsHeld;default:return c.name;}}),[customerData,cSK,cSD]);

  const groupData=useMemo(()=>data.customerGroups.map(g=>{
    const members=sortedCustomers.filter(c=>g.members.includes(c.name));const tp={};members.forEach(m=>{Object.entries(m.totalProducts).forEach(([pid,qty])=>{tp[pid]=(tp[pid]||0)+qty;});});
    return{...g,members,totalProducts:tp};
  }),[data.customerGroups,sortedCustomers]);

  return <div className="fade-in">
    <div className="page-header" style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start'}}>
      <div><h2>Customers</h2><p>View customer orders and group totals</p></div>
      <button className="btn btn-primary" onClick={()=>{setShowAddCustomer(true);setNewCustName('');setNewCustPhone('');}}><Icon name="plus" size={16}/>Add Customer</button>
    </div>
    {showAddCustomer&&<Modal title="Add New Customer" onClose={()=>setShowAddCustomer(false)}>
      <div className="modal-body">
        <div className="form-group"><label>Customer Name</label><input value={newCustName} onChange={e=>setNewCustName(e.target.value)} placeholder="Enter customer name" autoFocus/></div>
        <div className="form-group"><label>Phone Number (optional)</label><input type="tel" value={newCustPhone} onChange={e=>setNewCustPhone(e.target.value)} placeholder="(402) 555-0123"/></div>
        {newCustName&&allCustomers.includes(newCustName.trim())&&<p style={{fontSize:12,color:'var(--danger)'}}>Customer already exists</p>}
      </div>
      <div className="modal-footer"><button className="btn btn-secondary" onClick={()=>setShowAddCustomer(false)}>Cancel</button>
        <button className="btn btn-primary" disabled={!newCustName.trim()||allCustomers.includes(newCustName.trim())}
          onClick={()=>{const n=newCustName.trim();addCustomer(n);if(newCustPhone.trim())setCustomerMeta(n,{phone:newCustPhone.trim()});setShowAddCustomer(false);setNewCustPhone('');}}>Add Customer</button></div>
    </Modal>}
    <div className="card" style={{padding:'12px 16px'}}><div className="search-box"><Icon name="search"/><input placeholder="Search customers..." value={search} onChange={e=>setSearch(e.target.value)}/></div></div>

    {/* ── ITEM 5: All Customers first; groups moved BELOW ── */}
    <div className="card" style={{padding:0}}><div className="card-header" style={{padding:'14px 16px'}}><h3>All Customers</h3><span className="tag">{sortedCustomers.length}</span></div>
      <div className="inv-table-wrap"><table className="freeze-table"><thead><tr>
        <SortTh label="Customer" colKey="name" sortKey={cSK} sortDir={cSD} onSort={cToggle}/>
        <SortTh label="Phone" colKey="phone" sortKey={cSK} sortDir={cSD} onSort={cToggle}/>
        <SortTh label="Group" colKey="group" sortKey={cSK} sortDir={cSD} onSort={cToggle}/>
        <SortTh label="Orders" colKey="orders" sortKey={cSK} sortDir={cSD} onSort={cToggle}/>
        <SortTh label="Pumps Out" colKey="pumps" sortKey={cSK} sortDir={cSD} onSort={cToggle} style={{textAlign:'right'}}/>
        <SortTh label="Latest" colKey="latest" sortKey={cSK} sortDir={cSD} onSort={cToggle}/>
        <SortTh label="Status" colKey="status" sortKey={cSK} sortDir={cSD} onSort={cToggle}/><th></th></tr></thead><tbody>
      {sortedCustomers.map(c=>{const st=c.latest?getStatus(c.latest.status):getStatus('pending');
        return <tr key={c.name} style={{cursor:'pointer'}} onClick={()=>onNavigate('customer-detail',c.name)}>
          <td style={{fontWeight:500}}>{c.name}</td>
          {/* Item 5.1: phone, inline-editable without leaving the list */}
          <td onClick={e=>e.stopPropagation()}>
            {c.phone
              ? <a href={`tel:${c.phone.replace(/[^0-9+]/g,'')}`} style={{color:'var(--primary)',textDecoration:'none'}} title="Call">{c.phone}</a>
              : <span style={{color:'#cbd5e1',fontSize:12}}>—</span>}
            <button className="btn-icon" style={{marginLeft:6,padding:3}} title="Edit phone" onClick={()=>setEditPhone(c.name)}><Icon name="edit" size={11}/></button>
          </td>
          <td>{c.group?<span className="tag" style={{background:'var(--primary-bg)',color:'var(--primary)'}}>{c.group}</span>:'—'}</td>
          <td>{c.orders.length}</td>
          <td className="inv-cell" style={{color:c.pumpsHeld>0?'var(--orange)':'inherit',fontWeight:c.pumpsHeld>0?600:400}}>{c.pumpsHeld>0?fmt(c.pumpsHeld):'—'}</td>
          <td>{c.latest?fmtDate(c.latest.date):'—'}</td>
          <td><span className={`status-badge ${st.cls}`}><span className={`status-dot ${st.dot}`}></span>{st.label}</span></td>
          <td style={{textAlign:'right'}}><Icon name="chevron" size={16}/></td>
        </tr>;})}
    </tbody></table></div></div>

    {/* Groups now render at the BOTTOM of the page (item 5) */}
    {groupData.length>0&&<div style={{marginTop:24,paddingTop:8,borderTop:'2px solid var(--border)'}}>
      <h3 style={{fontSize:15,fontWeight:600,color:'var(--text-secondary)',margin:'12px 0',textTransform:'uppercase',letterSpacing:.5}}>Customer Groups</h3>
      {groupData.map(g=><div key={g.name} className="card" style={{padding:0}}>
        <div className="card-header" style={{padding:'14px 16px'}}><h3 style={{color:'var(--primary)'}}>{g.name} Group</h3><span className="tag">{g.members.length} members</span></div>
        <div className="inv-table-wrap"><table className="freeze-table"><thead><tr><th>Customer</th><th>Phone</th><th>Orders</th><th style={{textAlign:'right'}}>Pumps Out</th><th>Latest Date</th><th>Status</th><th></th></tr></thead><tbody>
          {g.members.map(m=>{const st=m.latest?getStatus(m.latest.status):getStatus('pending');
            return <tr key={m.name} style={{cursor:'pointer'}} onClick={()=>onNavigate('customer-detail',m.name)}>
              <td style={{fontWeight:500}}>{m.name}</td>
              <td>{m.phone||<span style={{color:'#cbd5e1',fontSize:12}}>—</span>}</td>
              <td>{m.orders.length}</td>
              <td className="inv-cell">{m.pumpsHeld>0?fmt(m.pumpsHeld):'—'}</td>
              <td>{m.latest?fmtDate(m.latest.date):'—'}</td>
              <td><span className={`status-badge ${st.cls}`}><span className={`status-dot ${st.dot}`}></span>{st.label}</span></td>
              <td style={{textAlign:'right'}}><Icon name="chevron" size={16}/></td></tr>;})}
          <tr className="group-row"><td>{g.name} Total</td><td></td><td>{g.members.reduce((s,m)=>s+m.orders.length,0)}</td>
            <td className="inv-cell">{fmt(g.members.reduce((s,m)=>s+m.pumpsHeld,0))}</td>
            <td colSpan="3">{Object.entries(g.totalProducts).filter(([,v])=>v>0).slice(0,5).map(([pid,qty])=>{const p=allProducts.find(x=>x.id===pid);return <span key={pid} className="tag" style={{marginRight:4}}>{productDisplayName(p||{name:pid})}: {fmt(qty)}</span>;})}</td></tr>
        </tbody></table></div>
      </div>)}
    </div>}

    {/* Item 5.1: phone editor */}
    {editPhone&&<PhoneModal customerName={editPhone} onClose={()=>setEditPhone(null)}/>}
  </div>;
}

// ── ITEM 5.1: CUSTOMER PHONE ──
function PhoneModal({customerName,onClose}) {
  const {data,setCustomerMeta,showToast} = useApp();
  const meta=(data.customerMeta||{})[customerName]||{};
  const [phone,setPhone] = useState(meta.phone||'');
  const [email,setEmail] = useState(meta.email||'');
  const [notes,setNotes] = useState(meta.notes||'');
  const save=()=>{setCustomerMeta(customerName,{phone:phone.trim(),email:email.trim(),notes:notes.trim()});showToast('Contact saved');onClose();};
  return <Modal title={`Contact — ${customerName}`} onClose={onClose}>
    <div className="modal-body">
      <div className="form-group"><label>Phone Number</label>
        <input type="tel" value={phone} onChange={e=>setPhone(e.target.value)} placeholder="(402) 555-0123" autoFocus/></div>
      <div className="form-group"><label>Email (optional)</label>
        <input type="email" value={email} onChange={e=>setEmail(e.target.value)} placeholder="name@farm.com"/></div>
      <div className="form-group"><label>Notes (optional)</label>
        <textarea rows="3" value={notes} onChange={e=>setNotes(e.target.value)} placeholder="Gate code, delivery instructions, best time to call..."/></div>
    </div>
    <div className="modal-footer"><button className="btn btn-secondary" onClick={onClose}>Cancel</button><button className="btn btn-primary" onClick={save}>Save Contact</button></div>
  </Modal>;
}

function CustomerDetail({customerName,onBack,onNavigate}) {
  const {data,allProducts,updateOrder,equipmentByCustomer} = useApp();
  const [editPhone,setEditPhone] = useState(false);
  const orders=data.orders.filter(o=>o.customer===customerName);
  const group=data.customerGroups.find(g=>g.members.includes(customerName));
  const deliveries=data.deliveries.filter(d=>d.customer===customerName);
  const returns=(data.returns||[]).filter(r=>r.customer===customerName);
  const meta=(data.customerMeta||{})[customerName]||{};
  const eq=equipmentByCustomer.find(r=>r.customer===customerName);
  const tp={};orders.forEach(o=>{Object.entries(o.products||{}).forEach(([pid,qty])=>{tp[pid]=(tp[pid]||0)+num(qty);});});
  const usedProducts=allProducts.filter(p=>tp[p.id]>0);
  return <div className="fade-in">
    <div className="page-header" style={{display:'flex',alignItems:'center',gap:12}}><button className="btn-icon" onClick={onBack}><Icon name="back"/></button>
      <div style={{flex:1}}><h2>{customerName}</h2>
        <p style={{display:'flex',alignItems:'center',gap:8,flexWrap:'wrap'}}>
          {group?<span className="tag" style={{background:'var(--primary-bg)',color:'var(--primary)'}}>{group.name} Group</span>:null}
          <span>{orders.length} order{orders.length!==1?'s':''}</span>
          {/* Item 5.1 */}
          {meta.phone
            ? <a href={`tel:${meta.phone.replace(/[^0-9+]/g,'')}`} className="tag" style={{background:'var(--success-bg)',color:'var(--success)',textDecoration:'none'}}>{meta.phone}</a>
            : <span className="tag" style={{cursor:'pointer'}} onClick={()=>setEditPhone(true)}>+ Add phone</span>}
          <button className="btn-icon" style={{padding:3}} title="Edit contact" onClick={()=>setEditPhone(true)}><Icon name="edit" size={11}/></button>
        </p>
      </div>
    </div>

    {/* Item 13: per-customer pump total */}
    {eq&&(eq.pumpsOut>0||eq.totesOut>0)&&<div className="card" style={{padding:'12px 16px',display:'flex',gap:20,flexWrap:'wrap'}}>
      <div><div style={{fontSize:11,color:'var(--text-secondary)',textTransform:'uppercase',letterSpacing:.5}}>Pumps Out</div><div style={{fontSize:20,fontWeight:700,color:eq.pumpsHeld>0?'var(--orange)':'var(--success)'}}>{fmt(eq.pumpsHeld)}</div></div>
      <div><div style={{fontSize:11,color:'var(--text-secondary)',textTransform:'uppercase',letterSpacing:.5}}>Pumps Returned</div><div style={{fontSize:20,fontWeight:700}}>{fmt(eq.pumpsReturned)} <span style={{fontSize:12,fontWeight:400,color:'var(--text-secondary)'}}>of {fmt(eq.pumpsOut)}</span></div></div>
      <div><div style={{fontSize:11,color:'var(--text-secondary)',textTransform:'uppercase',letterSpacing:.5}}>Totes Out</div><div style={{fontSize:20,fontWeight:700,color:eq.totesHeld>0?'var(--purple)':'var(--success)'}}>{fmt(eq.totesHeld)}</div></div>
    </div>}

    <div className="card" style={{padding:0}}><div className="card-header" style={{padding:'14px 16px'}}><h3>Orders</h3></div><div className="inv-table-wrap"><table className="freeze-table">
      <thead><tr><th>Date</th><th>Status</th>{usedProducts.map(p=><th key={p.id} className="product-col" style={{textAlign:'right',fontSize:10}}>{productDisplayName(p)}</th>)}</tr></thead>
      <tbody>{orders.map(o=><tr key={o.id}><td>{fmtDate(o.date)}</td><td><select value={o.status} onChange={e=>updateOrder(o.id,{status:e.target.value})} style={{width:'auto',padding:'3px 6px',fontSize:11}}>{STATUS_OPTIONS.map(s=><option key={s.value} value={s.value}>{s.label}</option>)}</select></td>{usedProducts.map(p=><td key={p.id} className="inv-cell">{num(o.products?.[p.id])?fmt(num(o.products[p.id])):'—'}</td>)}</tr>)}</tbody>
      <tfoot><tr><td>Customer Total</td><td></td>{usedProducts.map(p=><td key={p.id} className="inv-cell">{tp[p.id]?fmt(tp[p.id]):'—'}</td>)}</tr></tfoot>
    </table></div></div>

    {deliveries.length>0&&<div className="card" style={{padding:0}}><div className="card-header" style={{padding:'14px 16px'}}><h3>Delivery History</h3></div><div className="inv-table-wrap"><table className="freeze-table"><thead><tr><th>Date</th><th>Products</th><th>Pumps</th><th>Totes</th><th>Notes</th><th>Files</th></tr></thead><tbody>
      {deliveries.map(d=><tr key={d.id}><td>{fmtDate(d.date)}</td>
        <td>{Object.entries(d.products||{}).filter(([,v])=>num(v)>0).map(([pid,qty])=>{const p=allProducts.find(x=>x.id===pid);return <span key={pid} className="tag" style={{marginRight:4}}>{productDisplayName(p||{name:pid})}: {fmt(num(qty))}</span>;})}</td>
        <td>{num(d.pumpsOut)?`${fmt(num(d.pumpsReturnedQty))}/${fmt(num(d.pumpsOut))} back`:'—'}{d.pumpsReturnDate?` (due ${fmtDate(d.pumpsReturnDate)})`:''}</td>
        <td>{num(d.totes)?`${fmt(num(d.totesReturnedQty))}/${fmt(num(d.totes))} back`:'—'}</td>
        <td style={{fontSize:12,maxWidth:200,whiteSpace:'normal'}}>{d.notes||'—'}</td>
        <td>{(d.attachments||[]).length>0?<span className="tag">{d.attachments.length}</span>:'—'}</td></tr>)}
    </tbody></table></div></div>}

    {returns.length>0&&<div className="card" style={{padding:0}}><div className="card-header" style={{padding:'14px 16px'}}><h3>Returns</h3></div><div className="inv-table-wrap"><table className="freeze-table"><thead><tr><th>Date</th><th>Products</th><th>Reason</th><th>Notes</th></tr></thead><tbody>
      {returns.map(r=><tr key={r.id}><td>{fmtDate(r.date)}</td>
        <td>{Object.entries(r.products||{}).filter(([,v])=>num(v)>0).map(([pid,qty])=>{const p=allProducts.find(x=>x.id===pid);return <span key={pid} className="tag" style={{marginRight:4}}>{productDisplayName(p||{name:pid})}: {fmt(num(qty))}</span>;})}</td>
        <td><span className="tag">{RETURN_REASONS.find(x=>x.value===r.reason)?.label||r.reason}</span></td>
        <td style={{fontSize:12}}>{r.notes||'—'}</td></tr>)}
    </tbody></table></div></div>}

    {editPhone&&<PhoneModal customerName={customerName} onClose={()=>setEditPhone(false)}/>}
  </div>;
}

// ══════════════════════════
// ── DELIVERIES SCREEN ──
// ══════════════════════════
function DeliveriesScreen({onNavigate,navArg}) {
  const {data,allProducts,updateDelivery,returnEquipment,deleteDelivery,deleteReturn,pumpSummary,equipmentByCustomer,showToast} = useApp();
  const [showNew,setShowNew] = useState(false);
  const [showTicket,setShowTicket] = useState(null);
  const [showReturn,setShowReturn] = useState(false);   // item 14
  const [returnQty,setReturnQty] = useState(null);      // partial equipment return
  const [tab,setTab] = useState('deliveries');
  const {sortKey:dSK,sortDir:dSD,toggleSort:dToggle,sortFn:dSort} = useSort(null);
  // Outstanding is now quantity-based, not a boolean flag: a delivery with 5 pumps
  // out and 3 returned stays in this list showing 2 still held.
  const activePumps=data.deliveries.filter(d=>num(d.pumpsOut)>num(d.pumpsReturnedQty));
  const activeTotes=data.deliveries.filter(d=>num(d.totes)>num(d.totesReturnedQty));
  const returns=data.returns||[];

  const sortedDeliveries=useMemo(()=>{
    if(!dSK) return [...data.deliveries].sort((a,b)=>new Date(b.date)-new Date(a.date));
    return dSort(data.deliveries,(d,k)=>{switch(k){case'customer':return d.customer;case'date':return d.date||'';case'products':return Object.keys(d.products||{}).filter(x=>(d.products||{})[x]>0).length;case'pumps':return d.pumpsOut||0;case'totes':return d.totes||0;case'photos':return (d.attachments||[]).length;default:return d.customer;}});
  },[data.deliveries,dSK,dSD]);
  const sortedPumps=useMemo(()=>dSort(activePumps,(d,k)=>{switch(k){case'customer':return d.customer;case'date':return d.date||'';case'pumps':return d.pumpsOut||0;case'returnDate':return d.pumpsReturnDate||'';default:return d.customer;}}),[activePumps,dSK,dSD]);
  const sortedTotes=useMemo(()=>dSort(activeTotes,(d,k)=>{switch(k){case'customer':return d.customer;case'date':return d.date||'';case'totes':return d.totes||0;default:return d.customer;}}),[activeTotes,dSK,dSD]);
  const sortedTickets=useMemo(()=>dSort(data.deliveryTickets||[],(t,k)=>{switch(k){case'customer':return t.customer;case'date':return t.date||'';case'savedAt':return t.savedAt||'';case'products':return t.productCount||0;default:return t.customer;}}),[data.deliveryTickets,dSK,dSD]);

  return <div className="fade-in">
    <div className="page-header" style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start'}}>
      <div><h2>Deliveries</h2><p>Manage deliveries, returns, pumps, and totes</p></div>
      <div style={{display:'flex',gap:8}}>
        {/* Item 14 */}
        <button className="btn btn-secondary" onClick={()=>setShowReturn(true)}><Icon name="undo" size={16}/>New Return</button>
        <button className="btn btn-primary" onClick={()=>setShowNew(true)}><Icon name="truck" size={16}/>New Delivery</button>
      </div>
    </div>
    <div className="tabs">
      <div className={`tab ${tab==='deliveries'?'active':''}`} onClick={()=>setTab('deliveries')}>Deliveries ({data.deliveries.length})</div>
      <div className={`tab ${tab==='returns'?'active':''}`} onClick={()=>setTab('returns')}>Returns ({returns.length})</div>
      <div className={`tab ${tab==='pumps'?'active':''}`} onClick={()=>setTab('pumps')}>Pumps Out ({fmt(pumpSummary.held)})</div>
      <div className={`tab ${tab==='totes'?'active':''}`} onClick={()=>setTab('totes')}>Totes Out ({fmt(pumpSummary.totesHeld)})</div>
      <div className={`tab ${tab==='equipment'?'active':''}`} onClick={()=>setTab('equipment')}>By Customer ({equipmentByCustomer.length})</div>
      <div className={`tab ${tab==='tickets'?'active':''}`} onClick={()=>setTab('tickets')}>Saved Tickets ({data.deliveryTickets?.length||0})</div>
    </div>
    {tab==='deliveries'&&<div className="card" style={{padding:0}}><div className="inv-table-wrap"><table className="freeze-table"><thead><tr><SortTh label="Customer" colKey="customer" sortKey={dSK} sortDir={dSD} onSort={dToggle}/><SortTh label="Date" colKey="date" sortKey={dSK} sortDir={dSD} onSort={dToggle}/><SortTh label="Products" colKey="products" sortKey={dSK} sortDir={dSD} onSort={dToggle}/><SortTh label="Pumps" colKey="pumps" sortKey={dSK} sortDir={dSD} onSort={dToggle}/><SortTh label="Totes" colKey="totes" sortKey={dSK} sortDir={dSD} onSort={dToggle}/><SortTh label="Photos" colKey="photos" sortKey={dSK} sortDir={dSD} onSort={dToggle}/><th></th></tr></thead><tbody>
      {sortedDeliveries.length===0?<tr><td colSpan="7" style={{textAlign:'center',padding:40,color:'var(--text-secondary)'}}>No deliveries recorded yet</td></tr>:sortedDeliveries.map(d=>{
        const delCount=data.deliveries.filter(x=>x.orderId===d.orderId).length;
        const delIdx=data.deliveries.filter(x=>x.orderId===d.orderId).findIndex(x=>x.id===d.id)+1;
        return <tr key={d.id}>
        <td style={{fontWeight:500}}>{d.customer}{delCount>1&&<span className="tag" style={{marginLeft:6,fontSize:10}}>#{delIdx} of {delCount}</span>}</td><td>{fmtDate(d.date)}</td>
        <td>{Object.entries(d.products||{}).filter(([,v])=>v>0).slice(0,3).map(([pid,qty])=>{const p=allProducts.find(x=>x.id===pid);return <span key={pid} className="tag" style={{marginRight:4}}>{p?productDisplayName(p):pid}: {fmt(qty)}</span>;})}</td>
        <td>{d.pumpsOut||'—'}</td><td>{d.totes||'—'}{d.totesReturned?' (in)':''}</td>
        <td>{(d.attachments||[]).length>0?<span className="tag">{d.attachments.length}</span>:'—'}</td>
        <td><button className="btn btn-sm btn-secondary" onClick={()=>setShowTicket(d)}><Icon name="printer" size={14}/>Ticket</button></td>
      </tr>;})}
    </tbody></table></div></div>}
    {/* ── ITEM 14: RETURNS ── */}
    {tab==='returns'&&<div className="card" style={{padding:0}}><div className="inv-table-wrap"><table className="freeze-table"><thead><tr>
      <th>Customer</th><th>Date</th><th>Products</th><th>Reason</th><th>Notes</th><th>Received By</th><th></th></tr></thead><tbody>
      {returns.length===0?<tr><td colSpan="7" style={{textAlign:'center',padding:40,color:'var(--text-secondary)'}}>No returns recorded. Use <strong>New Return</strong> when product comes back — it credits available inventory.</td></tr>
      :[...returns].sort((a,b)=>(b.date||'').localeCompare(a.date||'')).map(r=><tr key={r.id}>
        <td style={{fontWeight:500}}>{r.customer}</td><td>{fmtDate(r.date)}</td>
        <td>{Object.entries(r.products||{}).filter(([,v])=>num(v)>0).map(([pid,qty])=>{const p=allProducts.find(x=>x.id===pid);
          return <span key={pid} className="tag" style={{marginRight:4}}>{productDisplayName(p||{name:pid})}: {fmt(num(qty))}</span>;})}</td>
        <td><span className="tag" style={{background:r.reason==='weigh-back'?'var(--orange-bg)':'#f1f5f9',color:r.reason==='weigh-back'?'var(--orange)':'var(--text-secondary)'}}>
          {RETURN_REASONS.find(x=>x.value===r.reason)?.label||r.reason}</span></td>
        <td style={{fontSize:12,maxWidth:220,whiteSpace:'normal'}}>{r.notes||'—'}</td>
        <td>{r.receivedBy||'—'}</td>
        <td style={{textAlign:'right'}}><button className="btn-icon" onClick={()=>{if(confirm('Delete this return? Inventory will be adjusted back.'))deleteReturn(r.id);}}><Icon name="trash" size={14}/></button></td>
      </tr>)}
    </tbody></table></div></div>}

    {tab==='pumps'&&<div className="card" style={{padding:0}}>
      <div style={{padding:'12px 16px',borderBottom:'1px solid var(--border)',display:'flex',gap:20,flexWrap:'wrap',fontSize:13}}>
        <span>Total out: <strong>{fmt(pumpSummary.out)}</strong></span>
        <span style={{color:'var(--success)'}}>Returned: <strong>{fmt(pumpSummary.back)}</strong></span>
        <span style={{color:'var(--orange)'}}>Still held: <strong>{fmt(pumpSummary.held)}</strong></span>
        {pumpSummary.overdue>0&&<span style={{color:'var(--danger)'}}>Overdue: <strong>{pumpSummary.overdue}</strong></span>}
      </div>
      <div className="inv-table-wrap"><table className="freeze-table"><thead><tr>
        <SortTh label="Customer" colKey="customer" sortKey={dSK} sortDir={dSD} onSort={dToggle}/><SortTh label="Delivery Date" colKey="date" sortKey={dSK} sortDir={dSD} onSort={dToggle}/>
        <SortTh label="Out" colKey="pumps" sortKey={dSK} sortDir={dSD} onSort={dToggle} style={{textAlign:'right'}}/>
        <th style={{textAlign:'right'}}>Returned</th><th style={{textAlign:'right'}}>Still Out</th>
        <SortTh label="Due Back" colKey="returnDate" sortKey={dSK} sortDir={dSD} onSort={dToggle}/><th></th></tr></thead><tbody>
      {sortedPumps.length===0?<tr><td colSpan="7" style={{textAlign:'center',padding:40,color:'var(--text-secondary)'}}>No pumps currently out</td></tr>
      :sortedPumps.map(d=>{const out=num(d.pumpsOut),back=num(d.pumpsReturnedQty),held=out-back;
        const overdue=d.pumpsReturnDate&&d.pumpsReturnDate<today();
        return <tr key={d.id}>
        <td style={{fontWeight:500}}>{d.customer}</td><td>{fmtDate(d.date)}</td>
        <td className="inv-cell" style={{fontWeight:600}}>{fmt(out)}</td>
        <td className="inv-cell" style={{color:'var(--success)'}}>{fmt(back)}</td>
        <td className="inv-cell" style={{fontWeight:700,color:'var(--orange)'}}>{fmt(held)}</td>
        <td style={{color:overdue?'var(--danger)':undefined,fontWeight:overdue?600:400}}>{d.pumpsReturnDate?fmtDate(d.pumpsReturnDate):'Not set'}{overdue?' (overdue)':''}</td>
        <td style={{textAlign:'right',whiteSpace:'nowrap'}}>
          {/* Partial returns: the old boolean flag could not express 5 out / 3 back */}
          <button className="btn btn-sm btn-secondary" style={{marginRight:4}} onClick={()=>setReturnQty({id:d.id,kind:'pumps',max:held,customer:d.customer})}>Partial</button>
          <button className="btn btn-sm btn-success" onClick={()=>{returnEquipment(d.id,'pumps',held);showToast(`${fmt(held)} pump${held!==1?'s':''} returned`);}}><Icon name="check" size={14}/>All Back</button>
        </td></tr>;})}
    </tbody></table></div></div>}

    {tab==='totes'&&<div className="card" style={{padding:0}}>
      <div style={{padding:'12px 16px',borderBottom:'1px solid var(--border)',display:'flex',gap:20,flexWrap:'wrap',fontSize:13}}>
        <span>Total out: <strong>{fmt(pumpSummary.totesOut)}</strong></span>
        <span style={{color:'var(--success)'}}>Returned: <strong>{fmt(pumpSummary.totesBack)}</strong></span>
        <span style={{color:'var(--purple)'}}>Still held: <strong>{fmt(pumpSummary.totesHeld)}</strong></span>
      </div>
      <div className="inv-table-wrap"><table className="freeze-table"><thead><tr>
        <SortTh label="Customer" colKey="customer" sortKey={dSK} sortDir={dSD} onSort={dToggle}/><SortTh label="Delivery Date" colKey="date" sortKey={dSK} sortDir={dSD} onSort={dToggle}/>
        <SortTh label="Out" colKey="totes" sortKey={dSK} sortDir={dSD} onSort={dToggle} style={{textAlign:'right'}}/>
        <th style={{textAlign:'right'}}>Returned</th><th style={{textAlign:'right'}}>Still Out</th><th></th></tr></thead><tbody>
      {sortedTotes.length===0?<tr><td colSpan="6" style={{textAlign:'center',padding:40,color:'var(--text-secondary)'}}>No totes currently out</td></tr>
      :sortedTotes.map(d=>{const out=num(d.totes),back=num(d.totesReturnedQty),held=out-back;
        return <tr key={d.id}>
        <td style={{fontWeight:500}}>{d.customer}</td><td>{fmtDate(d.date)}</td>
        <td className="inv-cell" style={{fontWeight:600}}>{fmt(out)}</td>
        <td className="inv-cell" style={{color:'var(--success)'}}>{fmt(back)}</td>
        <td className="inv-cell" style={{fontWeight:700,color:'var(--purple)'}}>{fmt(held)}</td>
        <td style={{textAlign:'right',whiteSpace:'nowrap'}}>
          <button className="btn btn-sm btn-secondary" style={{marginRight:4}} onClick={()=>setReturnQty({id:d.id,kind:'totes',max:held,customer:d.customer})}>Partial</button>
          <button className="btn btn-sm btn-success" onClick={()=>{returnEquipment(d.id,'totes',held);showToast(`${fmt(held)} tote${held!==1?'s':''} checked in`);}}><Icon name="check" size={14}/>All Back</button>
        </td></tr>;})}
    </tbody></table></div></div>}

    {/* ── ITEM 13: equipment rolled up per customer ── */}
    {tab==='equipment'&&<div className="card" style={{padding:0}}><div className="inv-table-wrap"><table className="freeze-table"><thead><tr>
      <th>Customer</th><th style={{textAlign:'right'}}>Pumps Out</th><th style={{textAlign:'right'}}>Pumps Returned</th><th style={{textAlign:'right'}}>Pumps Held</th>
      <th style={{textAlign:'right'}}>Totes Out</th><th style={{textAlign:'right'}}>Totes Held</th><th>Last Out</th></tr></thead><tbody>
      {equipmentByCustomer.length===0?<tr><td colSpan="7" style={{textAlign:'center',padding:40,color:'var(--text-secondary)'}}>No equipment has gone out yet</td></tr>
      :[...equipmentByCustomer].sort((a,b)=>b.pumpsHeld-a.pumpsHeld||a.customer.localeCompare(b.customer)).map(r=><tr key={r.customer}>
        <td style={{fontWeight:500,cursor:'pointer'}} onClick={()=>onNavigate&&onNavigate('customer-detail',r.customer)}>{r.customer}</td>
        <td className="inv-cell">{fmt(r.pumpsOut)}</td>
        <td className="inv-cell" style={{color:'var(--success)'}}>{fmt(r.pumpsReturned)}</td>
        <td className="inv-cell" style={{fontWeight:700,color:r.pumpsHeld>0?'var(--orange)':'var(--success)'}}>{fmt(r.pumpsHeld)}</td>
        <td className="inv-cell">{fmt(r.totesOut)}</td>
        <td className="inv-cell" style={{fontWeight:600,color:r.totesHeld>0?'var(--purple)':'inherit'}}>{fmt(r.totesHeld)}</td>
        <td>{r.lastOut?fmtDate(r.lastOut):'—'}</td>
      </tr>)}
    </tbody>
    <tfoot><tr>
      <td>TOTALS</td>
      <td className="inv-cell">{fmt(pumpSummary.out)}</td>
      <td className="inv-cell">{fmt(pumpSummary.back)}</td>
      <td className="inv-cell">{fmt(pumpSummary.held)}</td>
      <td className="inv-cell">{fmt(pumpSummary.totesOut)}</td>
      <td className="inv-cell">{fmt(pumpSummary.totesHeld)}</td>
      <td></td>
    </tr></tfoot></table></div></div>}
    {tab==='tickets'&&<div className="card" style={{padding:0}}><div className="inv-table-wrap"><table className="freeze-table"><thead><tr><SortTh label="Customer" colKey="customer" sortKey={dSK} sortDir={dSD} onSort={dToggle}/><SortTh label="Delivery Date" colKey="date" sortKey={dSK} sortDir={dSD} onSort={dToggle}/><SortTh label="Saved On" colKey="savedAt" sortKey={dSK} sortDir={dSD} onSort={dToggle}/><SortTh label="Products" colKey="products" sortKey={dSK} sortDir={dSD} onSort={dToggle}/><th></th></tr></thead><tbody>
      {sortedTickets.length===0?<tr><td colSpan="5" style={{textAlign:'center',padding:40,color:'var(--text-secondary)'}}>No saved tickets yet. Tickets are saved when you generate a delivery.</td></tr>:sortedTickets.map(t=><tr key={t.id}><td style={{fontWeight:500}}>{t.customer}</td><td>{fmtDate(t.date)}</td><td>{fmtDate(t.savedAt)}</td><td>{t.productCount} products</td>
        <td><button className="btn btn-sm btn-secondary" onClick={()=>setShowTicket(t)}><Icon name="printer" size={14}/>View</button></td></tr>)}
    </tbody></table></div></div>}
    {showNew&&<NewDeliveryModal onClose={()=>setShowNew(false)}/>}
    {showTicket&&<DeliveryTicketModal delivery={showTicket} onClose={()=>setShowTicket(null)}/>}
    {showReturn&&<ReturnModal onClose={()=>setShowReturn(false)}/>}
    {returnQty&&<PartialReturnModal info={returnQty} onClose={()=>setReturnQty(null)}/>}
  </div>;
}

// ── PARTIAL EQUIPMENT RETURN ──
// The old model stored pumpsReturned as a boolean, so "5 went out, 3 came back"
// was unrepresentable and the operator had to either lie (mark all returned) or
// leave the row open indefinitely. Quantities fix that.
function PartialReturnModal({info,onClose}) {
  const {returnEquipment,showToast} = useApp();
  const [qty,setQty] = useState('');
  const n=num(qty);
  const valid=n>0&&n<=info.max;
  const save=()=>{
    if(!valid) return;
    returnEquipment(info.id,info.kind,n);
    showToast(`${fmt(n)} ${info.kind==='pumps'?'pump':'tote'}${n!==1?'s':''} returned`);
    onClose();
  };
  return <Modal title={`Return ${info.kind==='pumps'?'Pumps':'Totes'} — ${info.customer}`} onClose={onClose}>
    <div className="modal-body">
      <p style={{fontSize:13,color:'var(--text-secondary)',marginBottom:12}}>
        <strong>{fmt(info.max)}</strong> currently out. Enter how many are coming back now.</p>
      <div className="form-group"><label>Quantity Returned</label>
        <input type="number" step="1" min="0" max={info.max} value={qty} autoFocus
          onChange={e=>setQty(e.target.value)} placeholder={`0 – ${fmt(info.max)}`}
          onKeyDown={e=>{if(e.key==='Enter'&&valid)save();}}/>
        {n>info.max&&<p style={{fontSize:12,color:'var(--danger)',marginTop:4}}>Cannot return more than the {fmt(info.max)} still out.</p>}
      </div>
    </div>
    <div className="modal-footer"><button className="btn btn-secondary" onClick={onClose}>Cancel</button>
      <button className="btn btn-success" disabled={!valid} onClick={save}><Icon name="check" size={14}/>Record Return</button></div>
  </Modal>;
}

// ══════════════════════════
// ── ITEM 14: RETURN TICKET ──
// Product physically coming back. Credits available inventory via getProductReturned,
// and prints as a ticket for the customer's records.
// ══════════════════════════
function ReturnModal({onClose,presetCustomer}) {
  const {data,allProducts,productsAZ,allCustomers,addReturn,showToast} = useApp();
  const [customer,setCustomer] = useState(presetCustomer||'');
  const [date,setDate] = useState(today());
  const [reason,setReason] = useState('weigh-back');
  const [notes,setNotes] = useState('');
  const [receivedBy,setReceivedBy] = useState((data.settings?.users||[])[0]||'');
  const [products,setProducts] = useState({});
  const [search,setSearch] = useState('');

  const custOrders = useMemo(()=>customer?data.orders.filter(o=>o.customer===customer):[],[customer,data.orders]);
  // Products this customer actually received are the likely returns — surface them first.
  const delivered = useMemo(()=>{
    const acc={};
    data.deliveries.filter(d=>d.customer===customer).forEach(d=>{
      Object.entries(d.products||{}).forEach(([pid,q])=>{acc[pid]=(acc[pid]||0)+num(q);});
    });
    return acc;
  },[data.deliveries,customer]);
  const suggested = useMemo(()=>productsAZ.filter(p=>num(delivered[p.id])>0),[productsAZ,delivered]);
  const others = useMemo(()=>{
    const q=search.trim().toLowerCase();
    const pool=productsAZ.filter(p=>!(num(delivered[p.id])>0));
    return q?pool.filter(p=>productDisplayName(p).toLowerCase().includes(q)):pool.slice(0,40);
  },[productsAZ,delivered,search]);

  const setQty=(pid,val)=>{const v=num(val);setProducts(p=>v>0?{...p,[pid]:v}:Object.fromEntries(Object.entries(p).filter(([k])=>k!==pid)));};
  const total=Object.values(products).reduce((s,v)=>s+num(v),0);

  const save=()=>{
    if(!customer){alert('Select a customer');return;}
    const clean={};Object.entries(products).forEach(([pid,q])=>{if(num(q)>0)clean[pid]=num(q);});
    if(Object.keys(clean).length===0){alert('Enter at least one product quantity');return;}
    addReturn({customer,date,reason,notes,receivedBy,products:clean});
    onClose();
  };

  return <Modal title="New Return Ticket" onClose={onClose} wide>
    <div className="modal-body">
      <div style={{padding:'10px 14px',background:'var(--primary-bg)',borderRadius:6,fontSize:12,color:'var(--primary)',marginBottom:14}}>
        Returned product is credited back to <strong>available inventory</strong> for the return date's fiscal year.
      </div>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12}}>
        <div className="form-group"><label>Customer</label>
          <select value={customer} onChange={e=>{setCustomer(e.target.value);setProducts({});}}>
            <option value="">-- Select customer --</option>
            {[...allCustomers].sort().map(c=><option key={c} value={c}>{c}</option>)}
          </select></div>
        <div className="form-group"><label>Return Date</label><input type="date" value={date} onChange={e=>setDate(e.target.value)}/></div>
        <div className="form-group"><label>Reason</label>
          <select value={reason} onChange={e=>setReason(e.target.value)}>
            {RETURN_REASONS.map(r=><option key={r.value} value={r.value}>{r.label}</option>)}
          </select></div>
        <div className="form-group"><label>Received By</label>
          <select value={receivedBy} onChange={e=>setReceivedBy(e.target.value)}>
            <option value="">-- Select user --</option>
            {(data.settings?.users||[]).map(u=><option key={u} value={u}>{u}</option>)}
          </select></div>
      </div>

      {customer&&<>
        {suggested.length>0&&<div style={{marginTop:8}}>
          <h4 style={{fontSize:13,fontWeight:600,marginBottom:8}}>Previously delivered to {customer}</h4>
          <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(250px,1fr))',gap:8}}>
            {suggested.map(p=><div key={p.id} style={{display:'flex',alignItems:'center',gap:8}}>
              <span style={{fontSize:12,flex:1,minWidth:0,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>
                {productDisplayName(p)}
                <span style={{color:'var(--text-secondary)',marginLeft:4}}>({fmt(num(delivered[p.id]))} out)</span>
              </span>
              <input type="number" step="0.1" min="0" max={num(delivered[p.id])} style={{width:80}} placeholder="0"
                value={products[p.id]||''} onChange={e=>setQty(p.id,e.target.value)}/>
            </div>)}
          </div>
        </div>}

        <div style={{marginTop:14}}>
          <h4 style={{fontSize:13,fontWeight:600,marginBottom:8}}>Other products</h4>
          <div className="search-box" style={{marginBottom:8}}><Icon name="search"/>
            <input placeholder="Search all products..." value={search} onChange={e=>setSearch(e.target.value)}/></div>
          <div style={{maxHeight:200,overflowY:'auto',border:'1px solid var(--border)',borderRadius:6,padding:8}}>
            <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(250px,1fr))',gap:8}}>
              {others.map(p=><div key={p.id} style={{display:'flex',alignItems:'center',gap:8}}>
                <span style={{fontSize:12,flex:1,minWidth:0,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',color:'var(--text-secondary)'}}>{productDisplayName(p)}</span>
                <input type="number" step="0.1" min="0" style={{width:80}} placeholder="0" value={products[p.id]||''} onChange={e=>setQty(p.id,e.target.value)}/>
              </div>)}
            </div>
          </div>
        </div>

        <div className="form-group" style={{marginTop:14}}><label>Notes</label>
          <textarea rows="2" value={notes} onChange={e=>setNotes(e.target.value)} placeholder="Condition, who picked it up, weigh ticket number..."/></div>

        {total>0&&<div style={{padding:'10px 14px',background:'var(--success-bg)',borderRadius:6,fontSize:13,color:'var(--success)',fontWeight:600}}>
          Returning {Object.keys(products).length} product{Object.keys(products).length!==1?'s':''} — {fmt(total)} total units back to inventory
        </div>}
      </>}
    </div>
    <div className="modal-footer"><button className="btn btn-secondary" onClick={onClose}>Cancel</button>
      <button className="btn btn-primary" disabled={!customer||total<=0} onClick={save}><Icon name="undo" size={14}/>Create Return Ticket</button></div>
  </Modal>;
}

// ══════════════════════════════════════
// ── NEW DELIVERY WITH PHOTO CAPTURE ──
// ══════════════════════════════════════
// ══════════════════════════════════════════════════════════
// ── NEW DELIVERY ──
// Rewritten to fix two data-integrity defects and add items 2,3,3.1,7,8,9.
//
// DEFECT (silent data corruption): the old group branch of save() recomputed each
// order's remaining quantity and wrote THAT, completely ignoring the `products`
// state the user had just typed into the "Deliver Now" inputs. Every group delivery
// was recorded as a full delivery regardless of what was entered, and the order was
// then flipped to 'paid'. Partial group deliveries were impossible and the operator
// had no indication their input was discarded. Individual and group now share ONE
// allocation path that always honours entered quantities.
//
// DEFECT (inverted filter): deliverableOrders was
//   o.status!=='paid' || !isOrderFullyDelivered(o.id)
// Because || short-circuits, ANY order not manually marked 'paid' appeared in the
// picker even when fully delivered. Now keyed purely on actual delivered quantities.
// ══════════════════════════════════════════════════════════
function NewDeliveryModal({onClose,presetOrderId,presetCustomer}) {
  const {data,allProducts,productsAZ,addDelivery,updateOrder,showToast,saveDeliveryTicket,getOrderDelivered,getOrderDeliveryCount,isOrderFullyDelivered} = useApp();
  // mode: 'individual' | 'customer' (item 3) | 'group'
  const [mode,setMode] = useState(presetOrderId?'individual':'individual');
  const [selectedOrder,setSelectedOrder] = useState(presetOrderId||'');
  const [selectedCustomer,setSelectedCustomer] = useState(presetCustomer||'');
  const [selectedCustomerOrders,setSelectedCustomerOrders] = useState([]);
  const [selectedGroup,setSelectedGroup] = useState('');
  const [selectedGroupOrders,setSelectedGroupOrders] = useState([]);
  const [date,setDate] = useState(today());
  const [products,setProducts] = useState({});
  const [includedProducts,setIncludedProducts] = useState({});
  const [extraProducts,setExtraProducts] = useState({});   // item 8: added after the order
  const [showAddProduct,setShowAddProduct] = useState(false);
  const [extraSearch,setExtraSearch] = useState('');
  const [notes,setNotes] = useState('');                    // item 7
  const [deliveredBy,setDeliveredBy] = useState((data.settings?.users||[])[0]||'');  // item 9
  const [driverSig,setDriverSig] = useState('');
  const [customerSig,setCustomerSig] = useState('');
  const [pumpsOut,setPumpsOut] = useState('');
  const [pumpsReturnDate,setPumpsReturnDate] = useState('');
  const [totes,setTotes] = useState('');
  const [attachments,setAttachments] = useState([]);
  const [showCamera,setShowCamera] = useState(false);
  const videoRef = useRef(null);
  const streamRef = useRef(null);
  const mediaRecorderRef = useRef(null);
  const [recording,setRecording] = useState(false);
  const [cameraMode,setCameraMode] = useState('photo');
  const fileInputRef = useRef(null);

  // BUGFIX: purely quantity-driven. Status is a display concern and must not gate this.
  const deliverableOrders = useMemo(()=>data.orders.filter(o=>!isOrderFullyDelivered(o.id)),[data.orders,isOrderFullyDelivered]);
  const selectedOrderObj = data.orders.find(o=>o.id===selectedOrder);

  // ── ITEM 3: multiple orders from the SAME CUSTOMER (no group required) ──
  const customersWithOrders = useMemo(()=>{
    const counts={};
    deliverableOrders.forEach(o=>{counts[o.customer]=(counts[o.customer]||0)+1;});
    return Object.keys(counts).sort((a,b)=>a.localeCompare(b)).map(c=>({name:c,count:counts[c]}));
  },[deliverableOrders]);
  const customerPendingOrders = useMemo(()=>selectedCustomer?deliverableOrders.filter(o=>o.customer===selectedCustomer):[],[selectedCustomer,deliverableOrders]);

  const groupsWithPendingOrders = useMemo(()=>data.customerGroups.filter(g=>deliverableOrders.some(o=>g.members.includes(o.customer))),[data.customerGroups,deliverableOrders]);
  const selectedGroupObj = data.customerGroups.find(g=>g.name===selectedGroup);
  const groupPendingOrders = useMemo(()=>selectedGroupObj?deliverableOrders.filter(o=>selectedGroupObj.members.includes(o.customer)):[],[selectedGroupObj,deliverableOrders]);

  // The set of orders this delivery covers, in every mode. Single source of truth.
  const activeOrders = useMemo(()=>{
    if(mode==='individual') return selectedOrderObj?[selectedOrderObj]:[];
    if(mode==='customer')  return customerPendingOrders.filter(o=>selectedCustomerOrders.includes(o.id));
    return groupPendingOrders.filter(o=>selectedGroupOrders.includes(o.id));
  },[mode,selectedOrderObj,customerPendingOrders,selectedCustomerOrders,groupPendingOrders,selectedGroupOrders]);

  // Combined ordered / already-delivered / remaining across activeOrders.
  const lines = useMemo(()=>{
    const acc={};
    activeOrders.forEach(o=>{
      const del=getOrderDelivered(o.id);
      Object.entries(o.products||{}).forEach(([pid,qty])=>{
        const q=num(qty); if(q<=0) return;
        if(!acc[pid]) acc[pid]={pid,ordered:0,delivered:0};
        acc[pid].ordered+=q;
        acc[pid].delivered+=num(del[pid]);
      });
    });
    return Object.values(acc).map(l=>({...l,remaining:l.ordered-l.delivered}))
      .sort((a,b)=>{
        const pa=allProducts.find(x=>x.id===a.pid),pb=allProducts.find(x=>x.id===b.pid);
        return productDisplayName(pa||{name:a.pid}).localeCompare(productDisplayName(pb||{name:b.pid}));
      });
  },[activeOrders,getOrderDelivered,allProducts]);

  // Seed the Deliver Now inputs whenever the order selection changes.
  // Deps now include the derived objects — the old effects listed only
  // [selectedOrder,mode] while reading getOrderDelivered/groupPendingOrders through
  // a stale closure, which intermittently rendered an empty product list.
  const seedKey = activeOrders.map(o=>o.id).sort().join('|');
  useEffect(()=>{
    const seeded={},inc={};
    lines.forEach(l=>{seeded[l.pid]=Math.max(0,l.remaining);inc[l.pid]=l.remaining>0;});
    setProducts(seeded);setIncludedProducts(inc);
  },[seedKey]);

  const toggleCustomerOrder=id=>setSelectedCustomerOrders(prev=>prev.includes(id)?prev.filter(x=>x!==id):[...prev,id]);
  const toggleGroupOrder=id=>setSelectedGroupOrders(prev=>prev.includes(id)?prev.filter(x=>x!==id):[...prev,id]);
  const toggleProduct=pid=>setIncludedProducts(prev=>({...prev,[pid]:!prev[pid]}));

  // Auto-select all of a customer's / group's orders when one is picked.
  useEffect(()=>{ if(mode==='customer') setSelectedCustomerOrders(customerPendingOrders.map(o=>o.id)); },[selectedCustomer,mode]);
  useEffect(()=>{ if(mode==='group')    setSelectedGroupOrders(groupPendingOrders.map(o=>o.id));    },[selectedGroup,mode]);

  // ── ITEM 8: products added AFTER the order was written ──
  const extraCandidates = useMemo(()=>{
    const onOrder=new Set(lines.map(l=>l.pid));
    const q=extraSearch.trim().toLowerCase();
    const pool=productsAZ.filter(p=>!onOrder.has(p.id));
    return q?pool.filter(p=>productDisplayName(p).toLowerCase().includes(q)):pool;
  },[productsAZ,lines,extraSearch]);
  const setExtra=(pid,val)=>{const v=num(val);setExtraProducts(e=>v>0?{...e,[pid]:v}:Object.fromEntries(Object.entries(e).filter(([k])=>k!==pid)));};

  // ── ITEM 3.1: over-delivery detection ──
  const overLines = useMemo(()=>lines
    .filter(l=>includedProducts[l.pid]&&num(products[l.pid])>l.remaining)
    .map(l=>({...l,entered:num(products[l.pid]),over:num(products[l.pid])-l.remaining})),[lines,products,includedProducts]);
  const hasOverage = overLines.length>0;
  const extraCount = Object.keys(extraProducts).filter(k=>num(extraProducts[k])>0).length;

  const hasSelection = activeOrders.length>0;

  // ── UNIFIED ALLOCATION ──
  // Distributes each entered quantity across the covered orders, oldest first, capped
  // at each order's remaining. Any surplus beyond total remaining (over-delivery) is
  // attached to the LAST order and flagged, rather than being silently dropped.
  // This single path serves individual, customer and group modes, so the three can
  // no longer drift apart the way the old duplicated logic did.
  const allocate=()=>{
    const perOrder={};activeOrders.forEach(o=>{perOrder[o.id]={};});
    const overage={};
    lines.forEach(l=>{
      if(!includedProducts[l.pid]) return;
      let toGive=num(products[l.pid]);
      if(toGive<=0) return;
      const ordered=[...activeOrders].sort((a,b)=>(a.date||'').localeCompare(b.date||''));
      ordered.forEach(o=>{
        if(toGive<=0) return;
        const already=num(getOrderDelivered(o.id)[l.pid]);
        const rem=Math.max(0,num(o.products?.[l.pid])-already);
        if(rem<=0) return;
        const give=Math.min(rem,toGive);
        perOrder[o.id][l.pid]=(perOrder[o.id][l.pid]||0)+give;
        toGive-=give;
      });
      if(toGive>0){ // over-delivered
        const last=ordered[ordered.length-1]||activeOrders[0];
        if(last){perOrder[last.id][l.pid]=(perOrder[last.id][l.pid]||0)+toGive;overage[l.pid]=(overage[l.pid]||0)+toGive;}
      }
    });
    // Item 8: extras go on the earliest covered order and are ALSO written back onto
    // that order's product list, so ordered-vs-delivered stays reconcilable instead of
    // showing a phantom over-delivery for something that was never ordered.
    const extras={};
    Object.entries(extraProducts).forEach(([pid,q])=>{const v=num(q);if(v>0)extras[pid]=v;});
    return {perOrder,overage,extras};
  };

  const save=()=>{
    if(activeOrders.length===0){alert('Select at least one order');return;}
    const {perOrder,overage,extras}=allocate();
    const anyProducts=Object.values(perOrder).some(m=>Object.keys(m).length>0)||Object.keys(extras).length>0;
    if(!anyProducts&&!(num(pumpsOut)>0)&&!(num(totes)>0)){alert('No products or equipment selected for delivery');return;}

    // Confirm over-delivery explicitly — it has invoicing consequences.
    if(hasOverage){
      const detail=overLines.map(l=>{const p=allProducts.find(x=>x.id===l.pid);return `  • ${productDisplayName(p||{name:l.pid})}: ${fmt(l.over)} over`;}).join('\n');
      if(!confirm(`You are delivering MORE than was ordered:\n\n${detail}\n\nThis will be flagged as "Needs Invoice / Weigh-Back" on the Dashboard.\n\nContinue?`)) return;
    }

    const target=[...activeOrders].sort((a,b)=>(a.date||'').localeCompare(b.date||''))[0];
    const sig={deliveredBy,driverSig:driverSig.trim(),customerSig:customerSig.trim(),signedAt:new Date().toISOString()};
    const ticketProducts={};

    activeOrders.forEach((o,idx)=>{
      const prods={...perOrder[o.id]};
      // extras ride along on the earliest order only, so they aren't multiplied
      if(o.id===target.id) Object.entries(extras).forEach(([pid,q])=>{prods[pid]=(prods[pid]||0)+q;});
      const isFirst=o.id===target.id;
      if(Object.keys(prods).length===0&&!isFirst) return;  // nothing to record for this order
      Object.entries(prods).forEach(([pid,q])=>{ticketProducts[pid]=(ticketProducts[pid]||0)+q;});

      addDelivery({
        customer:o.customer,orderId:o.id,
        groupName:mode==='group'?selectedGroup:(mode==='customer'?null:null),
        date,products:prods,
        deliveryNum:getOrderDeliveryCount(o.id)+1,
        notes,                                   // item 7
        ...sig,                                  // item 9
        overage:Object.keys(overage).length&&isFirst?overage:undefined,
        // equipment is recorded once, on the earliest order, so pump totals aren't
        // multiplied across every order in a multi-order delivery
        pumpsOut:isFirst?num(pumpsOut):0,pumpsReturnDate:isFirst?pumpsReturnDate:'',pumpsReturnedQty:0,pumpsReturned:false,
        totes:isFirst?num(totes):0,totesReturnedQty:0,totesReturned:false,
        attachments:isFirst?attachments:[]
      });

      // Item 8: write added products back onto the order so it reconciles.
      const patch={};
      if(isFirst&&Object.keys(extras).length>0){
        const merged={...(o.products||{})};
        Object.entries(extras).forEach(([pid,q])=>{merged[pid]=num(merged[pid])+q;});
        patch.products=merged;
      }
      // Recompute status from ACTUAL delivered totals including this delivery.
      const prevDel=getOrderDelivered(o.id);
      const finalProducts=patch.products||o.products||{};
      const allDone=Object.entries(finalProducts).filter(([,q])=>num(q)>0)
        .every(([pid,q])=>(num(prevDel[pid])+num(prods[pid]))>=num(q));
      patch.status=allDone?'paid':'partial-deliver';
      if(Object.keys(overage).length&&isFirst) patch.hasOverage=true;
      updateOrder(o.id,patch);
    });

    saveDeliveryTicket({
      customer:mode==='group'?`${selectedGroup} (Group)`:(mode==='customer'&&activeOrders.length>1?`${selectedCustomer} (${activeOrders.length} orders)`:target.customer),
      date,products:ticketProducts,productCount:Object.keys(ticketProducts).length,
      pumpsOut:num(pumpsOut),totes:num(totes),notes,...sig,
      orderIds:activeOrders.map(o=>o.id),attachments
    });

    showToast(hasOverage?'Delivery recorded — overage flagged for invoicing'
      :`Delivery recorded${activeOrders.length>1?` for ${activeOrders.length} orders`:''}`);
    onClose();
  };

  // Camera functions
  const startCamera=async()=>{
    try{
      const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'},audio:cameraMode==='video'});
      streamRef.current=stream;if(videoRef.current)videoRef.current.srcObject=stream;setShowCamera(true);
    }catch(e){showToast('Camera access denied');setShowCamera(false);}
  };
  const stopCamera=()=>{if(streamRef.current){streamRef.current.getTracks().forEach(t=>t.stop());streamRef.current=null;}setShowCamera(false);setRecording(false);};
  const capturePhoto=()=>{
    const video=videoRef.current;if(!video)return;
    const canvas=document.createElement('canvas');
    const scale=Math.min(1,1200/video.videoWidth);
    canvas.width=video.videoWidth*scale;canvas.height=video.videoHeight*scale;
    canvas.getContext('2d').drawImage(video,0,0,canvas.width,canvas.height);
    const dataUrl=canvas.toDataURL('image/jpeg',0.8);
    setAttachments(prev=>[...prev,{type:'photo',data:dataUrl,timestamp:new Date().toISOString()}]);
    showToast('Photo captured');
  };
  const startRecording=()=>{
    const stream=streamRef.current;if(!stream)return;
    const chunks=[];const mr=new MediaRecorder(stream,{mimeType:'video/webm'});
    mr.ondataavailable=e=>{if(e.data.size>0)chunks.push(e.data);};
    mr.onstop=()=>{const blob=new Blob(chunks,{type:'video/webm'});const reader=new FileReader();reader.onload=()=>{setAttachments(prev=>[...prev,{type:'video',data:reader.result,timestamp:new Date().toISOString()}]);showToast('Video saved');};reader.readAsDataURL(blob);};
    mr.start();mediaRecorderRef.current=mr;setRecording(true);
    setTimeout(()=>{if(mediaRecorderRef.current?.state==='recording'){mediaRecorderRef.current.stop();setRecording(false);}},30000);
  };
  const stopRecording=()=>{if(mediaRecorderRef.current?.state==='recording'){mediaRecorderRef.current.stop();setRecording(false);}};
  const handleFileUpload=e=>{
    Array.from(e.target.files).forEach(file=>{const reader=new FileReader();reader.onload=ev=>{
      const type=file.type.startsWith('video')?'video':'photo';
      if(type==='photo'){const img=new Image();img.onload=()=>{const canvas=document.createElement('canvas');const scale=Math.min(1,1200/img.width);canvas.width=img.width*scale;canvas.height=img.height*scale;canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);setAttachments(prev=>[...prev,{type:'photo',data:canvas.toDataURL('image/jpeg',0.8),timestamp:new Date().toISOString()}]);};img.src=ev.target.result;}
      else setAttachments(prev=>[...prev,{type:'video',data:ev.target.result,timestamp:new Date().toISOString()}]);
    };reader.readAsDataURL(file);});
  };
  const removeAttachment=i=>setAttachments(prev=>prev.filter((_,j)=>j!==i));

  useEffect(()=>()=>stopCamera(),[]);

  const users = data.settings?.users||[];
  const modeBtn=(m,label)=>(
    <button onClick={()=>{setMode(m);setSelectedOrder('');setSelectedCustomer('');setSelectedGroup('');setSelectedCustomerOrders([]);setSelectedGroupOrders([]);setProducts({});setExtraProducts({});}}
      style={{padding:'8px 18px',fontSize:13,fontWeight:500,cursor:'pointer',border:'none',borderLeft:m!=='individual'?'1px solid var(--border)':'none',
              background:mode===m?'var(--primary)':'#fff',color:mode===m?'#fff':'var(--text)'}}>{label}</button>
  );

  return <Modal title="New Delivery" onClose={()=>{stopCamera();onClose();}} wide>
    <div className="modal-body">
      <div style={{display:'flex',gap:0,marginBottom:16,border:'1px solid var(--border)',borderRadius:6,overflow:'hidden',width:'fit-content'}}>
        {modeBtn('individual','Individual Order')}
        {modeBtn('customer','Multiple Orders')}
        {modeBtn('group','Group Delivery')}
      </div>

      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12}}>
        {mode==='individual'&&<div className="form-group"><label>Select Order</label>
          <select value={selectedOrder} onChange={e=>setSelectedOrder(e.target.value)}>
            <option value="">-- Select an order --</option>
            {deliverableOrders.map(o=><option key={o.id} value={o.id}>{o.customer} — {fmtDate(o.date)}</option>)}
          </select></div>}
        {mode==='customer'&&<div className="form-group"><label>Select Customer</label>
          <select value={selectedCustomer} onChange={e=>setSelectedCustomer(e.target.value)}>
            <option value="">-- Select a customer --</option>
            {customersWithOrders.map(c=><option key={c.name} value={c.name}>{c.name} ({c.count} open order{c.count!==1?'s':''})</option>)}
          </select></div>}
        {mode==='group'&&<div className="form-group"><label>Select Group</label>
          <select value={selectedGroup} onChange={e=>setSelectedGroup(e.target.value)}>
            <option value="">-- Select a group --</option>
            {groupsWithPendingOrders.map(g=><option key={g.name} value={g.name}>{g.name} ({g.members.length} members)</option>)}
          </select></div>}
        <div className="form-group"><label>Delivery Date</label><input type="date" value={date} onChange={e=>setDate(e.target.value)}/></div>
      </div>

      {/* ── ITEM 3: pick which of this customer's orders to deliver ── */}
      {mode==='customer'&&selectedCustomer&&<div style={{marginTop:4}}>
        <h4 style={{fontSize:14,fontWeight:600,marginBottom:8}}>Orders for {selectedCustomer}</h4>
        <div style={{border:'1px solid var(--border)',borderRadius:6,overflow:'hidden'}}>
          {customerPendingOrders.length===0
            ? <div style={{padding:16,textAlign:'center',color:'var(--text-secondary)',fontSize:13}}>No open orders for this customer</div>
            : customerPendingOrders.map(o=>{const st=getStatus(o.status);const pc=Object.keys(o.products||{}).filter(k=>num(o.products[k])>0).length;
              return <label key={o.id} style={{display:'flex',alignItems:'center',gap:10,padding:'10px 14px',cursor:'pointer',borderBottom:'1px solid #f1f5f9',background:selectedCustomerOrders.includes(o.id)?'var(--primary-bg)':''}}>
                <input type="checkbox" checked={selectedCustomerOrders.includes(o.id)} onChange={()=>toggleCustomerOrder(o.id)} style={{width:'auto'}}/>
                <span style={{fontWeight:500,flex:1}}>{fmtDate(o.date)}</span>
                <span className="tag">{pc} product{pc!==1?'s':''}</span>
                <span className={`status-badge ${st.cls}`}><span className={`status-dot ${st.dot}`}></span>{st.label}</span>
              </label>;})}
        </div>
      </div>}

      {mode==='group'&&selectedGroupObj&&<div style={{marginTop:4}}>
        <h4 style={{fontSize:14,fontWeight:600,marginBottom:8}}>Select Orders to Deliver</h4>
        <div style={{border:'1px solid var(--border)',borderRadius:6,overflow:'hidden'}}>
          {groupPendingOrders.length===0
            ? <div style={{padding:16,textAlign:'center',color:'var(--text-secondary)',fontSize:13}}>No pending orders for this group</div>
            : groupPendingOrders.map(o=>{const st=getStatus(o.status);const pc=Object.keys(o.products||{}).filter(k=>num(o.products[k])>0).length;
              return <label key={o.id} style={{display:'flex',alignItems:'center',gap:10,padding:'10px 14px',cursor:'pointer',borderBottom:'1px solid #f1f5f9',background:selectedGroupOrders.includes(o.id)?'var(--primary-bg)':''}}>
                <input type="checkbox" checked={selectedGroupOrders.includes(o.id)} onChange={()=>toggleGroupOrder(o.id)} style={{width:'auto'}}/>
                <span style={{fontWeight:500,flex:1}}>{o.customer}</span>
                <span style={{fontSize:12,color:'var(--text-secondary)'}}>{fmtDate(o.date)}</span>
                <span className="tag">{pc} product{pc!==1?'s':''}</span>
              </label>;})}
        </div>
      </div>}

      {hasSelection&&<>
        {mode==='individual'&&selectedOrderObj&&getOrderDeliveryCount(selectedOrderObj.id)>0&&
          <div style={{background:'var(--primary-bg)',border:'1px solid var(--primary-light)',borderRadius:6,padding:'10px 14px',margin:'12px 0',fontSize:13}}>
            <strong>Delivery #{getOrderDeliveryCount(selectedOrderObj.id)+1}</strong> for this order. Quantities below show what remains.
          </div>}
        {activeOrders.length>1&&
          <div style={{background:'var(--primary-bg)',border:'1px solid var(--primary-light)',borderRadius:6,padding:'10px 14px',margin:'12px 0',fontSize:13}}>
            Delivering <strong>{activeOrders.length} orders</strong> together. Quantities are combined below and allocated across orders oldest-first.
          </div>}

        <h4 style={{fontSize:14,fontWeight:600,margin:'16px 0 8px'}}>Products to Deliver</h4>
        <table style={{fontSize:13}}>
          <thead><tr>
            <th style={{width:30,padding:'6px 8px'}}></th><th style={{textAlign:'left'}}>Product</th>
            <th style={{textAlign:'right',width:70}}>Ordered</th>
            <th style={{textAlign:'right',width:90}}>Prev. Delivered</th>
            <th style={{textAlign:'right',width:90}}>Remaining</th>
            <th style={{textAlign:'right',width:110}}>Deliver Now</th>
          </tr></thead>
          <tbody>{lines.map(l=>{
            const p=allProducts.find(x=>x.id===l.pid);
            const included=!!includedProducts[l.pid];
            const entered=num(products[l.pid]);
            const over=entered-l.remaining;
            return <tr key={l.pid} style={{opacity:included?1:0.4}}>
