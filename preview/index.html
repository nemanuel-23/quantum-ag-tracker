body{font-family:'Inter',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.sidebar{position:fixed;top:0;left:0;width:var(--sidebar-w);height:100vh;background:#0f172a;color:#fff;padding:0;z-index:50;display:flex;flex-direction:column;transition:transform .3s}

.nav-items{flex:1;padding:8px;overflow-y:auto}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:6px;cursor:pointer;font-size:14px;color:#94a3b8;transition:all .15s;margin-bottom:2px}

.page-header{margin-bottom:24px}
.page-header h2{font-size:24px;font-weight:700;color:var(--text)}

.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}
.card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.card-header h3{font-size:16px;font-weight:600}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:24px}
.kpi-card{background:var(--card);border:2px solid var(--border);border-radius:var(--radius);padding:18px 20px;cursor:pointer;transition:all .2s;position:relative}
.kpi-card:hover{border-color:var(--primary-light);box-shadow:0 4px 12px rgba(30,64,175,.1)}
.kpi-card.active{border-color:var(--primary);box-shadow:0 4px 16px rgba(30,64,175,.15)}
.kpi-card .kpi-arrow{position:absolute;right:12px;top:50%;transform:translateY(-50%);opacity:.3;transition:opacity .2s}
.kpi-card:hover .kpi-arrow{opacity:.7}
.kpi-label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:var(--text-secondary);margin-bottom:6px}
.kpi-value{font-size:30px;font-weight:700}
.kpi-sub{font-size:11px;color:var(--text-secondary);margin-top:4px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:6px;font-size:13px;font-weight:500;cursor:pointer;border:1px solid transparent;transition:all .15s}
.btn-primary{background:var(--primary);color:#fff}.btn-primary:hover{background:#1e3a8a}
.btn-secondary{background:#fff;border-color:var(--border);color:var(--text)}.btn-secondary:hover{background:#f1f5f9}
.btn-success{background:var(--success);color:#fff}.btn-success:hover{background:#15803d}
.btn-danger{background:var(--danger);color:#fff}.btn-danger:hover{background:#b91c1c}
.btn-sm{padding:5px 10px;font-size:12px}
.btn-icon{padding:6px;border-radius:6px;cursor:pointer;border:1px solid var(--border);background:#fff;display:inline-flex;align-items:center;justify-content:center}
.btn-icon:hover{background:#f1f5f9}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:10px 12px;background:#f8fafc;border-bottom:2px solid var(--border);font-weight:600;color:var(--text-secondary);font-size:11px;text-transform:uppercase;letter-spacing:.5px;white-space:nowrap}
td{padding:8px 12px;border-bottom:1px solid #f1f5f9;vertical-align:middle}
tr:hover td{background:#f8fafc}

input,select,textarea{font-family:inherit;font-size:13px;padding:8px 12px;border:1px solid var(--border);border-radius:6px;outline:none;transition:border .15s;width:100%;background:#fff}
input:focus,select:focus,textarea:focus{border-color:var(--primary-light);box-shadow:0 0 0 3px rgba(59,130,246,.1)}

.modal-body{padding:20px}
.modal-footer{padding:16px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px}

.spreadsheet-scroll table{width:auto !important;border-collapse:separate;border-spacing:0;table-layout:auto}

/* ══ FROZEN FIRST COLUMN + STICKY HEADER ══
   NOTE: border-collapse:collapse drops borders on position:sticky cells in every
   browser (collapsed borders belong to the table, not the cell, so they scroll
   away). We switch these tables to border-collapse:separate and redraw the
   borders with box-shadow, which IS painted on the sticky cell itself.
   Sticky cells also need an opaque background or rows scroll visibly underneath. */
.freeze-table{border-collapse:separate !important;border-spacing:0}
.freeze-table th,.freeze-table td{box-shadow:inset 0 -1px 0 #f1f5f9}
.freeze-table thead th{box-shadow:inset 0 -2px 0 var(--border)}
/* sticky header row */
.freeze-table thead th{position:-webkit-sticky;position:sticky;top:0;z-index:20;background:#f8fafc}
/* frozen first column */
.freeze-table tbody td:first-child,
.freeze-table tfoot td:first-child{position:-webkit-sticky;position:sticky;left:0;z-index:10;background:#fff;box-shadow:inset 0 -1px 0 #f1f5f9,2px 0 4px -2px rgba(15,23,42,.18)}
.freeze-table thead th:first-child{left:0;z-index:30;box-shadow:inset 0 -2px 0 var(--border),2px 0 4px -2px rgba(15,23,42,.18)}
/* hover + zebra must repaint the frozen cell too, else it stays white */
.freeze-table tbody tr:hover td{background:#f8fafc}
.freeze-table tbody tr:hover td:first-child{background:#f8fafc}
.freeze-table tbody tr.row-alt td:first-child{background:#f8fafc}
.freeze-table tbody tr.row-sel td:first-child{background:var(--primary-bg)}
.freeze-table tfoot td{position:-webkit-sticky;position:sticky;bottom:0;z-index:15;background:#f0f9ff;font-weight:700;box-shadow:inset 0 2px 0 var(--primary)}
.freeze-table tfoot td:first-child{z-index:25;background:#f0f9ff;box-shadow:inset 0 2px 0 var(--primary),2px 0 4px -2px rgba(15,23,42,.18)}

.photo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin-top:12px}
.photo-thumb{position:relative;aspect-ratio:4/3;border-radius:6px;overflow:hidden;border:1px solid var(--border)}
.photo-thumb img,.photo-thumb video{width:100%;height:100%;object-fit:cover}
.photo-remove{position:absolute;top:4px;right:4px;width:20px;height:20px;background:rgba(0,0,0,.6);color:#fff;border:none;border-radius:50%;cursor:pointer;font-size:12px;display:flex;align-items:center;justify-content:center}
.sb-status{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:99px;font-size:12px;font-weight:500}
.sb-connected{background:var(--success-bg);color:var(--success)}
.sb-disconnected{background:#f1f5f9;color:#94a3b8}
@media print{.sidebar,.no-print,.mobile-header{display:none!important}.main{margin:0!important;padding:20px!important}}
@media(max-width:768px){.sidebar{transform:translateX(-100%)}.sidebar.open{transform:translateX(0)}.main{margin-left:0}.mobile-header{display:flex!important}.kpi-grid{grid-template-columns:repeat(2,1fr)}}
.mobile-header{display:none;position:sticky;top:0;z-index:40;background:#0f172a;color:#fff;padding:12px 16px;align-items:center;justify-content:space-between}
.mobile-header h1{font-size:16px;font-weight:600}
.hamburger{background:none;border:none;color:#fff;cursor:pointer;padding:4px}
.fade-in{animation:fadeIn .2s ease-out}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.toast{position:fixed;bottom:24px;right:24px;background:#0f172a;color:#fff;padding:12px 20px;border-radius:8px;font-size:13px;z-index:200;animation:slideUp .3s ease-out}
@keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
</style>

function LoginScreen({onLogin}) {

}

// ── AUTH GATE ──
function AuthGate({children}) {
  const [user,setUser] = useState(null);
  const [loading,setLoading] = useState(true);

  useEffect(()=>{
    if(!sbClient){setLoading(false);return;}
    // Check current session
    sbClient.auth.getUser().then(({data})=>{
      setUser(data?.user||null);
      setLoading(false);
    });
    // Listen for auth changes (magic link redirect)
    const {data:{subscription}} = sbClient.auth.onAuthStateChange((event,session)=>{
      setUser(session?.user||null);
      if(event==='SIGNED_IN') setLoading(false);
    });
    return ()=>subscription.unsubscribe();
  },[]);

  const handleLogout = async () => {
    await sbClient.auth.signOut();
    setUser(null);
  };

  if(loading) return <div style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',background:'linear-gradient(135deg,#0f172a 0%,#1e3a5f 100%)'}}>
    <div style={{textAlign:'center',color:'#fff'}}>
      <div style={{width:40,height:40,border:'3px solid rgba(255,255,255,.2)',borderTopColor:'#fff',borderRadius:'50%',animation:'spin .8s linear infinite',margin:'0 auto 16px'}}></div>
      <p style={{fontSize:14,opacity:.8}}>Loading...</p>
    </div>
  </div>;

  if(!user) return <LoginScreen/>;

  return <AuthContext.Provider value={{user,logout:handleLogout}}>
    {children}
  </AuthContext.Provider>;
}

const AuthContext = createContext();
function useAuth(){return useContext(AuthContext);}

// ── SORT HOOK ──
function useSort(defaultKey,defaultDir='asc') {
  const [sortKey,setSortKey] = useState(defaultKey||null);
  const [sortDir,setSortDir] = useState(defaultDir);
  const toggleSort = key => {if(sortKey===key){setSortDir(d=>d==='asc'?'desc':'asc');}else{setSortKey(key);setSortDir('asc');}};
  const sortFn = (rows,getVal) => {
    if(!sortKey) return rows;
    return [...rows].sort((a,b)=>{
      let va=getVal(a,sortKey),vb=getVal(b,sortKey);
      if(va==null) va='';if(vb==null) vb='';
      if(typeof va==='string'&&typeof vb==='string'){const c=va.localeCompare(vb,undefined,{numeric:true,sensitivity:'base'});return sortDir==='asc'?c:-c;}
      const na=typeof va==='number'?va:parseFloat(va)||0;const nb=typeof vb==='number'?vb:parseFloat(vb)||0;
      return sortDir==='asc'?na-nb:nb-na;
    });
  };
  return {sortKey,sortDir,toggleSort,sortFn};
}
function SortTh({label,sortKey,colKey,sortDir,onSort,style,...rest}) {
  const active=sortKey===colKey;
  return <th style={{cursor:'pointer',userSelect:'none',...style}} onClick={()=>onSort(colKey)} {...rest}>
    <span style={{display:'inline-flex',alignItems:'center',gap:3}}>{label}<span style={{fontSize:9,opacity:active?1:0.3,transition:'opacity .15s'}}>{active?(sortDir==='asc'?'▲':'▼'):'▲'}</span></span>
  </th>;
}

function getFiscalYear(dateStr, fyStart, fyLabel) {
  if(!dateStr) return 'Undated';
  const d = new Date(dateStr+'T00:00:00');
  if(isNaN(d)) return 'Undated';
  const year = d.getFullYear();
  const month = d.getMonth()+1;
  const day = d.getDate();
  const sm = fyStart?.month||1; const sd = fyStart?.day||1;
  if(sm===1&&sd===1) return String(year);
  const startYear = (month>sm||(month===sm&&day>=sd)) ? year : year-1;
  const endYear = startYear+1;
  const lbl = fyLabel||'range';
  if(lbl==='end') return String(endYear);
  if(lbl==='start') return String(startYear);
  return startYear+'-'+endYear;
}
function getAvailableYears(orders, fyStart, fyLabel) {
  const years = new Set();
  orders.forEach(o=>years.add(getFiscalYear(o.date,fyStart,fyLabel)));
  // 'Undated' is a bucket, not a selectable year — those orders are folded into
  // whichever real year is active (see yearOrders). Offering it in the year dropdown
  // would let the user select a "year" containing only dateless rows.
  years.delete('Undated');
  years.add(getFiscalYear(today(),fyStart,fyLabel));   // current year is always selectable
  return [...years].sort().reverse();
}

// Single source of truth for shape-fixing. Previously this logic was duplicated in
// three places (localStorage load, Supabase initial fetch, Supabase realtime handler)
// and they had already drifted — the realtime handler forgot deliveryTickets, so a
// realtime event from another device could hand the app an object with no
// deliveryTickets array and crash the Saved Tickets tab on next render.
function migrate(raw){
  const d = raw && typeof raw==='object' ? {...raw} : {};
  if(!d.settings) d.settings = {...INITIAL_DATA.settings};
  if(!Array.isArray(d.products)||!d.products.length) d.products = DEFAULT_PRODUCTS;
  if(!Array.isArray(d.customers)||!d.customers.length) d.customers = DEFAULT_CUSTOMERS;
  if(!Array.isArray(d.orders)) d.orders = [];
  if(!Array.isArray(d.deliveries)) d.deliveries = [];
  if(!Array.isArray(d.deliveryTickets)) d.deliveryTickets = [];
  if(!Array.isArray(d.returns)) d.returns = [];
  if(!Array.isArray(d.customerGroups)) d.customerGroups = [];
  if(!d.customerMeta||typeof d.customerMeta!=='object') d.customerMeta = {};
  if(!d.inventory||typeof d.inventory!=='object') d.inventory = {};
  if(!Array.isArray(d.settings.users)||!d.settings.users.length) d.settings.users = ['Nick Emanuel'];
  // products gained a packaging field
  d.products = d.products.map(p=>p.packaging!==undefined?p:{...p,packaging:DEFAULT_PRODUCTS.find(x=>x.id===p.id)?.packaging||''});
  // inventory rows must always have an additions array with numeric qty.
  // Spread the original row FIRST so any field this version doesn't know about
  // survives. Rebuilding the object from scratch would silently delete unknown
  // keys and then the debounced sync would write that loss back to Supabase.
  Object.keys(d.inventory).forEach(pid=>{
    const inv=d.inventory[pid]||{};
    d.inventory[pid]={...inv,starting:num(inv.starting),additions:Array.isArray(inv.additions)?inv.additions.map(a=>({...a,qty:num(a?.qty)})):[]};
  });
  // Pump returns used to be a bare boolean, which cannot express "5 out, 3 back".
  // Promote to a quantity: previously-returned rows return their full original count.
  d.deliveries = d.deliveries.map(dl=>{
    const out=num(dl.pumpsOut);
    const returned = dl.pumpsReturnedQty!==undefined ? num(dl.pumpsReturnedQty) : (dl.pumpsReturned?out:0);
    const totesOut=num(dl.totes);
    const totesBack = dl.totesReturnedQty!==undefined ? num(dl.totesReturnedQty) : (dl.totesReturned?totesOut:0);
    return {...dl,pumpsOut:out,pumpsReturnedQty:Math.min(returned,out),totes:totesOut,totesReturnedQty:Math.min(totesBack,totesOut),
            pumpsReturned:returned>=out&&out>0,totesReturned:totesBack>=totesOut&&totesOut>0};
  });
  return d;
}

function AppProvider({children}) {
  const [data, setData] = useState(() => {
    const saved = localStorage.getItem('quantumag_data');
    if(saved){
      try{ return migrate(JSON.parse(saved)); }catch(e){ console.warn('Corrupt local data, falling back to defaults:',e); }
    }
    return migrate(INITIAL_DATA);
  });
  const [toast,setToast] = useState(null);
  const [sbConnected,setSbConnected] = useState(!!supabaseClient);
  const [activeYear,setActiveYear] = useState(()=>getFiscalYear(today(),data.settings?.fiscalYearStart,data.settings?.fiscalYearLabel));
  const isRemoteUpdate = useRef(false);
  const hasFetched = useRef(false);

  const showToast = msg =>{setToast(msg);setTimeout(()=>setToast(null),3000);};

  // Save to localStorage on every change
  useEffect(()=>{localStorage.setItem('quantumag_data',JSON.stringify(data));localStorage.setItem('quantumag_version',APP_VERSION);},[data]);

  // Push to Supabase whenever data changes — but ONLY after initial fetch completes.
  // Strip base64 attachment data before pushing (too large for Supabase; stays local only).
  //
  // BUGFIX (silent data loss): isRemoteUpdate was set true immediately before setData()
  // and only cleared HERE. But if the incoming remote payload was structurally identical,
  // React bailed out of the re-render, this effect never ran, and the flag stayed true —
  // so the NEXT genuine local edit was consumed clearing the stale flag and never reached
  // Supabase. The user's change vanished on refresh. The flag is now cleared by the same
  // code that sets it, via a microtask, so it can never outlive its own update.
  //
  // BUGFIX (write amplification): every keystroke upserted the entire document. Debounced
  // to 800ms so a burst of edits collapses into one write.
  useEffect(()=>{
    if(!supabaseClient) return;
    if(!hasFetched.current) return;
    if(isRemoteUpdate.current) return;
    const stripAttachments=arr=>(arr||[]).map(item=>({...item,attachments:(item.attachments||[]).map(a=>({type:a.type,timestamp:a.timestamp}))}));
    const t=setTimeout(()=>{
      const syncData={...data,deliveries:stripAttachments(data.deliveries),deliveryTickets:stripAttachments(data.deliveryTickets)};
      supabaseClient.from('app_data').upsert({id:SB_ROW_ID,data:syncData,updated_at:new Date().toISOString()})
        .then(({error})=>{if(error)console.warn('Supabase push error:',error.message);});
    },800);
    return ()=>clearTimeout(t);
  },[data]);

  // Apply a remote payload without echoing it straight back to the server.
  const applyRemote = useCallback((remoteRaw)=>{
    const remote = typeof remoteRaw==='string' ? JSON.parse(remoteRaw) : remoteRaw;
    isRemoteUpdate.current=true;
    setData(d=>{
      const merged=migrate({...d,...remote});
      merged.settings={...d.settings,...(remote.settings||{}),supabase:{url:SB_URL,anonKey:SB_ANON_KEY,enabled:true}};
      return merged;
    });
    // Clear on the microtask queue: runs after React has committed (or bailed out of)
    // this update, but before any subsequent user interaction can produce a local edit.
    Promise.resolve().then(()=>{isRemoteUpdate.current=false;});
  },[]);

  // Supabase: fetch on startup + listen for realtime changes
  useEffect(()=>{
    if(!supabaseClient) {setSbConnected(false);return;}
    setSbConnected(true);
    // Fetch latest data from Supabase on startup
    supabaseClient.from('app_data').select('*').eq('id',SB_ROW_ID).limit(1).then(({data:rows,error})=>{
      if(!error && rows && rows.length>0 && rows[0].data) applyRemote(rows[0].data);
      if(error) console.warn('Supabase data fetch:',error.message);
      // Enable pushing only AFTER initial fetch is done
      hasFetched.current=true;
    });
    // Listen for realtime changes from other devices
    const channel = supabaseClient.channel('realtime_sync').on('postgres_changes',{event:'*',schema:'public',table:'app_data'},(payload)=>{
      if(payload.new?.data) applyRemote(payload.new.data);
    }).subscribe();
    return ()=>{supabaseClient.removeChannel(channel);};
  },[applyRemote]);

  const updateData = (updater)=>{
    setData(d=>typeof updater==='function'?updater(d):updater);
  };

  const updateInventory=(pid,field,val)=>{updateData(d=>({...d,inventory:{...d.inventory,[pid]:{...d.inventory[pid]||{starting:0,additions:[]},[field]:val}}}));};
  const addInventory=(pid,add)=>{updateData(d=>{const inv=d.inventory[pid]||{starting:0,additions:[]};return{...d,inventory:{...d.inventory,[pid]:{...inv,additions:[...inv.additions,add]}}};});};
  const addOrder=o=>{updateData(d=>({...d,orders:[...d.orders,{...o,id:uid()}]}));showToast('Order added');};
  const updateOrder=(id,u)=>{updateData(d=>({...d,orders:d.orders.map(o=>o.id===id?{...o,...u}:o)}));};
  const deleteOrder=id=>{updateData(d=>({...d,orders:d.orders.filter(o=>o.id!==id)}));showToast('Order deleted');};
  // Bulk order mutation — used by the Orders bulk action bar (mark invoiced, set status).
  // Applied in ONE setData pass so React commits a single re-render and Supabase gets a
  // single debounced write, rather than N sequential updates racing each other.
  const bulkUpdateOrders=(ids,patch)=>{
    const idSet=new Set(ids);
    updateData(d=>({...d,orders:d.orders.map(o=>idSet.has(o.id)?{...o,...patch}:o)}));
    showToast(`${ids.length} order${ids.length!==1?'s':''} updated`);
  };
  const addDelivery=del=>{updateData(d=>({...d,deliveries:[...d.deliveries,{...del,id:uid()}]}));};
  const updateDelivery=(id,u)=>{updateData(d=>({...d,deliveries:d.deliveries.map(dl=>dl.id===id?{...dl,...u}:dl)}));};
  const deleteDelivery=id=>{updateData(d=>({...d,deliveries:d.deliveries.filter(dl=>dl.id!==id)}));showToast('Delivery deleted');};
  // Partial equipment return: 5 pumps out, 3 back is now representable.
  const returnEquipment=(id,kind,qty)=>{updateData(d=>({...d,deliveries:d.deliveries.map(dl=>{
    if(dl.id!==id) return dl;
    if(kind==='pumps'){const q=Math.min(num(dl.pumpsOut),num(dl.pumpsReturnedQty)+num(qty));
      return {...dl,pumpsReturnedQty:q,pumpsReturned:q>=num(dl.pumpsOut),pumpsReturnedDate:today()};}
    const q=Math.min(num(dl.totes),num(dl.totesReturnedQty)+num(qty));
    return {...dl,totesReturnedQty:q,totesReturned:q>=num(dl.totes),totesReturnedDate:today()};
  })}));};
  // Return tickets — product physically comes back and credits available inventory.
  const addReturn=r=>{updateData(d=>({...d,returns:[...(d.returns||[]),{...r,id:uid(),createdAt:today()}]}));showToast('Return ticket created');};
  const deleteReturn=id=>{updateData(d=>({...d,returns:(d.returns||[]).filter(r=>r.id!==id)}));showToast('Return deleted');};
  const setCustomerMeta=(name,meta)=>{updateData(d=>({...d,customerMeta:{...(d.customerMeta||{}),[name]:{...((d.customerMeta||{})[name]||{}),...meta}}}));};
  const addGroup=g=>{updateData(d=>({...d,customerGroups:[...d.customerGroups,g]}));};
  const updateGroup=(i,g)=>{updateData(d=>({...d,customerGroups:d.customerGroups.map((x,j)=>j===i?g:x)}));};
  const deleteGroup=i=>{updateData(d=>({...d,customerGroups:d.customerGroups.filter((_,j)=>j!==i)}));};
  const updateSettings=s=>{updateData(d=>({...d,settings:{...d.settings,...s}}));};
  const saveDeliveryTicket=t=>{updateData(d=>({...d,deliveryTickets:[...d.deliveryTickets,{...t,id:uid(),savedAt:today()}]}));};
  // Product CRUD
  const addProduct=p=>{updateData(d=>({...d,products:[...d.products,p]}));showToast('Product added');};
  const updateProduct=(id,u)=>{updateData(d=>({...d,products:d.products.map(p=>p.id===id?{...p,...u}:p)}));};
  const deleteProduct=id=>{updateData(d=>({...d,products:d.products.filter(p=>p.id!==id)}));showToast('Product deleted');};
  // Customer CRUD
  const addCustomer=name=>{updateData(d=>({...d,customers:[...d.customers,name].sort()}));showToast('Customer added');};
  const updateCustomer=(oldName,newName)=>{updateData(d=>{
    const customers=d.customers.map(c=>c===oldName?newName:c).sort();
    const orders=d.orders.map(o=>o.customer===oldName?{...o,customer:newName}:o);
    const deliveries=d.deliveries.map(dl=>dl.customer===oldName?{...dl,customer:newName}:dl);
    const deliveryTickets=d.deliveryTickets.map(t=>t.customer===oldName?{...t,customer:newName}:t);
    const customerGroups=d.customerGroups.map(g=>({...g,members:g.members.map(m=>m===oldName?newName:m)}));
    const returns=(d.returns||[]).map(r=>r.customer===oldName?{...r,customer:newName}:r);
    // customerMeta is keyed by name — the key must move with the rename or the
    // phone number silently detaches from the customer.
    const customerMeta={...(d.customerMeta||{})};
    if(customerMeta[oldName]!==undefined){customerMeta[newName]=customerMeta[oldName];delete customerMeta[oldName];}
    return{...d,customers,orders,deliveries,deliveryTickets,customerGroups,returns,customerMeta};
  });showToast('Customer updated');};
  const deleteCustomer=name=>{updateData(d=>{
    const customerMeta={...(d.customerMeta||{})};delete customerMeta[name];
    return{...d,customers:d.customers.filter(c=>c!==name),customerMeta};
  });showToast('Customer removed');};

  const fyStart = data.settings?.fiscalYearStart||{month:1,day:1};
  const fyLabel = data.settings?.fiscalYearLabel||'end';
  const availableYears = useMemo(()=>getAvailableYears(data.orders,fyStart,fyLabel),[data.orders,fyStart,fyLabel]);
  const archivedYears = data.settings?.archivedYears||[];
  const visibleYears = availableYears.filter(y=>!archivedYears.includes(y));

  // Orders with a blank/invalid date resolve to the 'Undated' pseudo-year. Scoping
  // strictly to activeYear would make them invisible in EVERY year — the seed data
  // contains exactly such a row (Ross Janak, 265 biocast-max-tote), and its quantity
  // would silently stop counting against inventory. Undated orders are real
  // commitments, so they are included in whichever year is being viewed.
  const yearOrders = useMemo(()=>{
    return data.orders.filter(o=>{
      const y=getFiscalYear(o.date,fyStart,fyLabel);
      return y===activeYear||y==='Undated';
    });
  },[data.orders,activeYear,fyStart,fyLabel]);

  const allProducts = data.products||DEFAULT_PRODUCTS;
  const allCustomers = data.customers||DEFAULT_CUSTOMERS;

  const activeProducts = useMemo(()=>{
    const used = new Set();
    Object.keys(data.inventory).forEach(pid=>{const inv=data.inventory[pid];if(inv.starting>0||inv.additions.length>0)used.add(pid);});
    data.orders.forEach(o=>Object.keys(o.products).forEach(pid=>{if(o.products[pid]>0)used.add(pid);}));
    return allProducts.filter(p=>used.has(p.id));
  },[data,allProducts]);

  const activeCustomers = useMemo(()=>{
    const used=new Set(data.orders.map(o=>o.customer));
    return allCustomers.filter(c=>used.has(c));
  },[data,allCustomers]);

  // ── INVENTORY MATH (fiscal-year scoped, NaN-hardened) ──
  // BUGFIX: these previously reduced over data.orders / data.deliveries — ALL years,
  // including archived ones — while the Dashboard and Orders pages scoped to yearOrders.
  // Result: last season's orders were subtracted from this season's stock, so "Available"
  // was wrong on every product carried across a year boundary. Now scoped to activeYear.
  // BUGFIX: a single non-numeric qty (bad import, hand-edited JSON) turned the entire
  // column into NaN because `s + a.qty` propagates. num() coerces defensively.

  // Deliveries belonging to the active fiscal year. A delivery with no date of its own
  // falls back to its parent order's date so it is never orphaned out of the year.
  const yearDeliveries = useMemo(()=>{
    const orderYear={};data.orders.forEach(o=>{orderYear[o.id]=getFiscalYear(o.date,fyStart,fyLabel);});
    return data.deliveries.filter(d=>{
      const y = d.date ? getFiscalYear(d.date,fyStart,fyLabel) : orderYear[d.orderId];
      return y===activeYear;
    });
  },[data.deliveries,data.orders,activeYear,fyStart,fyLabel]);

  const getProductTotalSold=useCallback(pid=>yearOrders.reduce((s,o)=>s+num(o.products?.[pid]),0),[yearOrders]);
  const getProductDelivered=useCallback(pid=>yearDeliveries.reduce((s,d)=>s+num(d.products?.[pid]),0),[yearDeliveries]);
  const getProductAdded=useCallback(pid=>{
    const inv=data.inventory[pid]||{starting:0,additions:[]};
    return (inv.additions||[]).reduce((s,a)=>s+num(a?.qty),0);
  },[data.inventory]);
  // Returns put product back on the shelf, so they credit available inventory.
  const getProductReturned=useCallback(pid=>(data.returns||[])
    .filter(r=>!r.date||getFiscalYear(r.date,fyStart,fyLabel)===activeYear)
    .reduce((s,r)=>s+num(r.products?.[pid]),0),[data.returns,activeYear,fyStart,fyLabel]);
  const getProductAvailable=useCallback(pid=>{
    const inv=data.inventory[pid]||{starting:0,additions:[]};
    return num(inv.starting)+getProductAdded(pid)+getProductReturned(pid)-getProductTotalSold(pid);
  },[data.inventory,getProductAdded,getProductReturned,getProductTotalSold]);
  // May legitimately go NEGATIVE when more was delivered than ordered (over-delivery).
  // Callers must NOT clamp this with Math.max(0,…) — the negative IS the weigh-back signal.
  const getProductSoldNotDelivered=useCallback(pid=>getProductTotalSold(pid)-getProductDelivered(pid),[getProductTotalSold,getProductDelivered]);
  // Per-order delivery tracking: how much of each product on a specific order has been delivered
  const getOrderDelivered=useCallback((orderId)=>{
    const totals={};
    data.deliveries.filter(d=>d.orderId===orderId).forEach(d=>{
      Object.entries(d.products||{}).forEach(([pid,qty])=>{totals[pid]=(totals[pid]||0)+num(qty);});
    });
    return totals;
  },[data.deliveries]);
  const getOrderDeliveryCount=useCallback((orderId)=>data.deliveries.filter(d=>d.orderId===orderId).length,[data.deliveries]);
  const isOrderFullyDelivered=useCallback((orderId)=>{
    const order=data.orders.find(o=>o.id===orderId);if(!order)return false;
    const delivered=getOrderDelivered(orderId);
    const lines=Object.entries(order.products||{}).filter(([,qty])=>num(qty)>0);
    // An order with no positive lines is not "fully delivered" — it's empty. Returning
    // true here used to hide brand-new empty orders from the delivery picker entirely.
    if(lines.length===0) return false;
    return lines.every(([pid,qty])=>(delivered[pid]||0)>=num(qty));
  },[data.orders,getOrderDelivered]);

  // ── PUMP / TOTE TRACKING (item 13) ──
  // Aggregates across ALL deliveries regardless of fiscal year: equipment physically
  // out on a farm doesn't reset at a year boundary the way order quantities do.
  const equipmentByCustomer=useMemo(()=>{
    const map={};
    data.deliveries.forEach(d=>{
      const c=d.customer||'—';
      if(!map[c]) map[c]={customer:c,pumpsOut:0,pumpsReturned:0,totesOut:0,totesReturned:0,lastOut:''};
      map[c].pumpsOut+=num(d.pumpsOut);
      map[c].pumpsReturned+=num(d.pumpsReturnedQty);
      map[c].totesOut+=num(d.totes);
      map[c].totesReturned+=num(d.totesReturnedQty);
      if(num(d.pumpsOut)>0&&(!map[c].lastOut||d.date>map[c].lastOut)) map[c].lastOut=d.date||'';
    });
    return Object.values(map).map(r=>({...r,pumpsHeld:r.pumpsOut-r.pumpsReturned,totesHeld:r.totesOut-r.totesReturned}))
      .filter(r=>r.pumpsOut>0||r.totesOut>0);
  },[data.deliveries]);

  const pumpSummary=useMemo(()=>{
    const t=equipmentByCustomer.reduce((a,r)=>({out:a.out+r.pumpsOut,back:a.back+r.pumpsReturned,
      totesOut:a.totesOut+r.totesOut,totesBack:a.totesBack+r.totesReturned}),{out:0,back:0,totesOut:0,totesBack:0});
    return {...t,held:t.out-t.back,totesHeld:t.totesOut-t.totesBack,
            customersHolding:equipmentByCustomer.filter(r=>r.pumpsHeld>0).length,
            overdue:data.deliveries.filter(d=>num(d.pumpsOut)>num(d.pumpsReturnedQty)&&d.pumpsReturnDate&&d.pumpsReturnDate<today()).length};
  },[equipmentByCustomer,data.deliveries]);

  // Over-delivery exceptions (item 3.1): delivered more than ordered → needs invoice
  // or weigh-back. Surfaced on the Dashboard so it can't be quietly forgotten.
  const deliveryExceptions=useMemo(()=>{
    const rows=[];
    data.orders.forEach(o=>{
      const delivered={};
      data.deliveries.filter(d=>d.orderId===o.id).forEach(d=>{
        Object.entries(d.products||{}).forEach(([pid,q])=>{delivered[pid]=(delivered[pid]||0)+num(q);});
      });
      Object.entries(delivered).forEach(([pid,dq])=>{
        const oq=num(o.products?.[pid]);
        if(dq>oq) rows.push({orderId:o.id,customer:o.customer,date:o.date,productId:pid,ordered:oq,delivered:dq,over:dq-oq,
                             resolved:!!(o.overageResolved&&o.overageResolved[pid])});
      });
    });
    return rows;
  },[data.orders,data.deliveries]);

  const exportData=()=>{const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download='quantum-ag-backup-'+today()+'.json';a.click();URL.revokeObjectURL(u);showToast('Exported');};
  const importData=json=>{try{setData(migrate(JSON.parse(json)));showToast('Imported');}catch(e){showToast('Invalid file');}};

  // Alphabetised product list — used by every picker (order creation, bulk inventory,
  // delivery add-product). DEFAULT_PRODUCTS is in spreadsheet order, which made the
  // pickers effectively unsearchable by eye.
  const productsAZ = useMemo(()=>[...allProducts].sort((a,b)=>
    productDisplayName(a).localeCompare(productDisplayName(b),undefined,{numeric:true,sensitivity:'base'})),[allProducts]);

  return <AppContext.Provider value={{data,setData:updateData,allProducts,productsAZ,allCustomers,activeProducts,activeCustomers,updateInventory,addInventory,addOrder,updateOrder,deleteOrder,bulkUpdateOrders,addDelivery,updateDelivery,deleteDelivery,returnEquipment,addReturn,deleteReturn,setCustomerMeta,addGroup,updateGroup,deleteGroup,updateSettings,saveDeliveryTicket,addProduct,updateProduct,deleteProduct,addCustomer,updateCustomer,deleteCustomer,getProductTotalSold,getProductDelivered,getProductAdded,getProductReturned,getProductAvailable,getProductSoldNotDelivered,getOrderDelivered,getOrderDeliveryCount,isOrderFullyDelivered,equipmentByCustomer,pumpSummary,deliveryExceptions,yearDeliveries,exportData,importData,showToast,toast,sbConnected,activeYear,setActiveYear,availableYears,visibleYears,archivedYears,yearOrders,fyStart,fyLabel}}>{children}</AppContext.Provider>;
}

// ── MODAL ──
function Modal({title,onClose,children,wide}){
  return <div className="modal-overlay" onClick={onClose}><div className="modal" style={wide?{maxWidth:800}:{}} onClick={e=>e.stopPropagation()}>
    <div className="modal-header"><h3>{title}</h3><button className="btn-icon" onClick={onClose}><Icon name="x"/></button></div>{children}
  </div></div>;
}

// ══════════════════════════════════
// ── DASHBOARD WITH DRILL-DOWNS ──
// ══════════════════════════════════
function Dashboard({onNavigate}) {
  const {data,activeProducts,yearOrders,activeYear,getProductAvailable,getProductTotalSold,getProductDelivered,getProductSoldNotDelivered,allProducts,pumpSummary,equipmentByCustomer,deliveryExceptions,isOrderFullyDelivered} = useApp();
  const [drillDown,setDrillDown] = useState(null);
  const [expandedProduct,setExpandedProduct] = useState(null);

  const productsNeeded = activeProducts.filter(p=>getProductAvailable(p.id)<0);
  const productsAvail = activeProducts.filter(p=>getProductAvailable(p.id)>0);
  // Was `o.status!=='paid'` — a status flag that drifts from reality. Now driven by
  // actual delivered quantities, matching the delivery picker.
  const ordersReady = yearOrders.filter(o=>!isOrderFullyDelivered(o.id));
  const ordersDelivered = yearOrders.filter(o=>isOrderFullyDelivered(o.id));
  const notInvoiced = yearOrders.filter(o=>!o.invoiced);

  const kpis = [
    {key:'needed',label:'Products Needed',value:productsNeeded.length,color:'var(--danger)',sub:'Negative inventory — need to order',icon:'alert'},
    {key:'available',label:'Products Available',value:productsAvail.length,color:'var(--success)',sub:'In stock and ready',icon:'check'},
    {key:'ready',label:'Orders to Deliver',value:ordersReady.length,color:'var(--warning)',sub:'Not fully delivered',icon:'truck'},
    {key:'delivered',label:'Orders Delivered',value:ordersDelivered.length,color:'var(--success)',sub:activeYear+' completed',icon:'check'},
    {key:'invoice',label:'Not Invoiced',value:notInvoiced.length,color:'var(--purple)',sub:activeYear+' awaiting invoice',icon:'orders'},
    {key:'total',label:'Total Orders',value:yearOrders.length,color:'var(--primary)',sub:activeYear+' all statuses',icon:'orders'}
  ];

  const toggle = key => setDrillDown(drillDown===key?null:key);

  // Find orders that consume a specific product
  const ordersForProduct = pid => data.orders.filter(o=>(o.products[pid]||0)>0);

  return (
    <div className="fade-in">
      <div className="page-header"><h2>Dashboard</h2><p>Year: {activeYear} — Click any card to drill down</p></div>
      <div className="kpi-grid">
        {kpis.map(k=>(
          <div key={k.key} className={`kpi-card ${drillDown===k.key?'active':''}`} onClick={()=>toggle(k.key)}>
            <div className="kpi-label">{k.label}</div>
            <div className="kpi-value" style={{color:k.color}}>{k.value}</div>
            <div className="kpi-sub">{k.sub}</div>
            <div className="kpi-arrow"><Icon name="down" size={16}/></div>
          </div>
        ))}
      </div>

      {/* ── ITEM 3.1: OVER-DELIVERY EXCEPTIONS ── */}
      {deliveryExceptions.length>0&&<div className="card" style={{border:'2px solid var(--danger)',padding:0,marginBottom:20}}>
        <div className="card-header" style={{padding:'14px 16px',background:'#fef2f2'}}>
          <h3 style={{color:'var(--danger)',display:'flex',alignItems:'center',gap:6}}><Icon name="alert" size={16}/>Delivered Over Ordered — Needs Invoice or Weigh-Back</h3>
          <span className="tag" style={{background:'var(--danger-bg)',color:'var(--danger)'}}>{deliveryExceptions.length}</span>
        </div>
        <div className="inv-table-wrap" style={{maxHeight:'32vh'}}><table className="freeze-table">
          <thead><tr><th>Customer</th><th>Order Date</th><th>Product</th><th style={{textAlign:'right'}}>Ordered</th><th style={{textAlign:'right'}}>Delivered</th><th style={{textAlign:'right'}}>Over</th><th></th></tr></thead>
          <tbody>{deliveryExceptions.map((x,i)=>{const p=allProducts.find(y=>y.id===x.productId);
            return <tr key={x.orderId+'_'+x.productId}>
              <td style={{fontWeight:500}}>{x.customer}</td><td>{fmtDate(x.date)}</td>
              <td>{productDisplayName(p||{name:x.productId})}</td>
              <td className="inv-cell">{fmt(x.ordered)}</td>
              <td className="inv-cell">{fmt(x.delivered)}</td>
              <td className="inv-cell" style={{color:'var(--danger)',fontWeight:700}}>+{fmt(x.over)}</td>
              <td style={{textAlign:'right',whiteSpace:'nowrap'}}>
                <button className="btn btn-sm btn-secondary" onClick={()=>onNavigate&&onNavigate('orders',{focusOrderId:x.orderId})}>Open Order</button>
              </td>
            </tr>;})}</tbody>
        </table></div>
        <div style={{padding:'10px 16px',fontSize:12,color:'var(--text-secondary)',borderTop:'1px solid var(--border)'}}>
          Either add the extra to the order and invoice it, or record a <strong>Return ticket</strong> (reason: weigh-back) on the Deliveries page.
        </div>
      </div>}

      {/* ── ITEM 13: PUMP TRACKER ── */}
      <div className="card" style={{padding:0,marginBottom:20}}>
        <div className="card-header" style={{padding:'14px 16px'}}>
          <h3>Pump &amp; Tote Tracker</h3>
          <span style={{fontSize:12,color:'var(--text-secondary)'}}>All years — equipment doesn't reset at year end</span>
        </div>
        <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(150px,1fr))',gap:0}}>
          {[
            {label:'Pumps Out',value:pumpSummary.out,color:'var(--text)',sub:'Total sent out'},
            {label:'Pumps Returned',value:pumpSummary.back,color:'var(--success)',sub:'Checked back in'},
            {label:'Pumps Still Out',value:pumpSummary.held,color:pumpSummary.held>0?'var(--orange)':'var(--success)',sub:`${pumpSummary.customersHolding} customer${pumpSummary.customersHolding!==1?'s':''} holding`},
            {label:'Overdue Returns',value:pumpSummary.overdue,color:pumpSummary.overdue>0?'var(--danger)':'var(--text-secondary)',sub:'Past return date'},
            {label:'Totes Still Out',value:pumpSummary.totesHeld,color:pumpSummary.totesHeld>0?'var(--purple)':'var(--success)',sub:`${fmt(pumpSummary.totesBack)} of ${fmt(pumpSummary.totesOut)} back`}
          ].map((s,i)=>(
            <div key={s.label} style={{padding:'16px 18px',borderRight:i<4?'1px solid var(--border)':'none'}}>
              <div style={{fontSize:11,color:'var(--text-secondary)',textTransform:'uppercase',letterSpacing:.5,fontWeight:600}}>{s.label}</div>
              <div style={{fontSize:26,fontWeight:700,color:s.color,marginTop:4}}>{fmt(s.value)}</div>
              <div style={{fontSize:11,color:'var(--text-secondary)',marginTop:2}}>{s.sub}</div>
            </div>
          ))}
        </div>
        {equipmentByCustomer.filter(r=>r.pumpsHeld>0).length>0&&<div style={{borderTop:'1px solid var(--border)'}}>
          <div className="inv-table-wrap" style={{maxHeight:'30vh'}}><table className="freeze-table">
            <thead><tr><th>Customer</th><th style={{textAlign:'right'}}>Pumps Held</th><th style={{textAlign:'right'}}>Returned</th><th style={{textAlign:'right'}}>Totes Held</th><th>Last Sent Out</th></tr></thead>
            <tbody>{[...equipmentByCustomer].filter(r=>r.pumpsHeld>0||r.totesHeld>0).sort((a,b)=>b.pumpsHeld-a.pumpsHeld).map(r=>
              <tr key={r.customer} style={{cursor:'pointer'}} onClick={()=>onNavigate&&onNavigate('customer-detail',r.customer)}>
                <td style={{fontWeight:500}}>{r.customer}</td>
                <td className="inv-cell" style={{fontWeight:700,color:r.pumpsHeld>0?'var(--orange)':'inherit'}}>{fmt(r.pumpsHeld)}</td>
                <td className="inv-cell" style={{color:'var(--success)'}}>{fmt(r.pumpsReturned)} / {fmt(r.pumpsOut)}</td>
                <td className="inv-cell" style={{color:r.totesHeld>0?'var(--purple)':'inherit'}}>{fmt(r.totesHeld)}</td>
                <td>{r.lastOut?fmtDate(r.lastOut):'—'}</td>
              </tr>)}</tbody>
            <tfoot><tr><td>TOTALS</td><td className="inv-cell">{fmt(pumpSummary.held)}</td><td className="inv-cell">{fmt(pumpSummary.back)} / {fmt(pumpSummary.out)}</td><td className="inv-cell">{fmt(pumpSummary.totesHeld)}</td><td></td></tr></tfoot>
          </table></div>
        </div>}
      </div>

      {/* ── DRILL-DOWN: Products Needed ── */}
      {drillDown==='needed' && (
        <div className="drill-panel">
          <div className="drill-header"><h3>Products Needed — Negative Inventory</h3><button className="btn-icon" onClick={()=>setDrillDown(null)}><Icon name="x"/></button></div>
          {productsNeeded.length===0?<p style={{color:'var(--text-secondary)',fontSize:13}}>All products are in stock.</p>:(
            <table>
              <thead><tr><th>Product</th><th style={{textAlign:'right'}}>Available</th><th style={{textAlign:'right'}}>Deficit</th><th style={{textAlign:'right'}}>Total Sold</th><th></th></tr></thead>
              <tbody>
                {productsNeeded.sort((a,b)=>getProductAvailable(a.id)-getProductAvailable(b.id)).map(p=>{
                  const avail=getProductAvailable(p.id);
                  const orders=ordersForProduct(p.id);
                  const isExpanded=expandedProduct===p.id;
                  return <React.Fragment key={p.id}>
                    <tr className="expand-row" onClick={()=>setExpandedProduct(isExpanded?null:p.id)}>
                      <td style={{fontWeight:500}}><Icon name={isExpanded?'down':'chevron'} size={14} style={{marginRight:6}}/>{productDisplayName(p)}</td>
                      <td className="inv-cell negative">{fmt(avail)}</td>
                      <td className="inv-cell negative">{fmt(Math.abs(avail))} needed</td>
                      <td className="inv-cell">{fmt(getProductTotalSold(p.id))}</td>
                      <td style={{fontSize:11,color:'var(--text-secondary)'}}>{orders.length} order{orders.length!==1?'s':''}</td>
                    </tr>
                    {isExpanded && (
                      <tr><td colSpan="5" style={{padding:'4px 12px 12px'}}>
                        <div className="sub-table">
                          <table><thead><tr><th>Customer</th><th>Order Date</th><th style={{textAlign:'right'}}>Qty Ordered</th><th>Status</th></tr></thead>
                          <tbody>{orders.map(o=>{const st=getStatus(o.status);return(
                            <tr key={o.id}><td>{o.customer}</td><td>{fmtDate(o.date)}</td><td className="inv-cell">{fmt(o.products[p.id])}</td>
                            <td><span className={`status-badge ${st.cls}`}><span className={`status-dot ${st.dot}`}></span>{st.label}</span></td></tr>
                          );})}</tbody></table>
                        </div>
                      </td></tr>
                    )}
                  </React.Fragment>;
                })}
              </tbody>
            </table>
          )}
        </div>
      )}

      {/* ── DRILL-DOWN: Products Available ── */}
      {drillDown==='available' && (
        <div className="drill-panel">
          <div className="drill-header"><h3>Products Available — In Stock</h3><button className="btn-icon" onClick={()=>setDrillDown(null)}><Icon name="x"/></button></div>
          <table>
            <thead><tr><th>Product</th><th style={{textAlign:'right'}}>Starting</th><th style={{textAlign:'right'}}>Added</th><th style={{textAlign:'right'}}>Sold</th><th style={{textAlign:'right'}}>Available</th></tr></thead>
            <tbody>
              {productsAvail.sort((a,b)=>getProductAvailable(b.id)-getProductAvailable(a.id)).map(p=>{
                const inv=data.inventory[p.id]||{starting:0,additions:[]};
                const added=inv.additions.reduce((s,a)=>s+a.qty,0);
                return <tr key={p.id}><td style={{fontWeight:500}}>{productDisplayName(p)}</td><td className="inv-cell">{fmt(inv.starting)}</td><td className="inv-cell positive">{added>0?'+'+fmt(added):'—'}</td><td className="inv-cell">{fmt(getProductTotalSold(p.id))}</td><td className="inv-cell positive" style={{fontWeight:700}}>{fmt(getProductAvailable(p.id))}</td></tr>;
              })}
            </tbody>
          </table>
        </div>
      )}

      {/* ── DRILL-DOWN: Orders Ready ── */}
      {drillDown==='ready' && (
        <div className="drill-panel">
          <div className="drill-header"><h3>Orders to Deliver — {activeYear}</h3><button className="btn-icon" onClick={()=>setDrillDown(null)}><Icon name="x"/></button></div>
          <table>
            <thead><tr><th>Customer</th><th>Date</th><th>Products</th><th>Status</th></tr></thead>
            <tbody>{ordersReady.sort((a,b)=>new Date(a.date||0)-new Date(b.date||0)).map(o=>{const st=getStatus(o.status);const pc=Object.keys(o.products).filter(k=>o.products[k]>0).length;return(
              <tr key={o.id}><td style={{fontWeight:500}}>{o.customer}</td><td>{fmtDate(o.date)}</td><td><span className="tag">{pc} product{pc!==1?'s':''}</span></td><td><span className={`status-badge ${st.cls}`}><span className={`status-dot ${st.dot}`}></span>{st.label}</span></td></tr>
            );})}</tbody>
          </table>
        </div>
      )}

      {/* ── DRILL-DOWN: Delivered ── */}
      {drillDown==='delivered' && (
        <div className="drill-panel">
          <div className="drill-header"><h3>Orders Delivered — {activeYear}</h3><button className="btn-icon" onClick={()=>setDrillDown(null)}><Icon name="x"/></button></div>
          {ordersDelivered.length===0?<p style={{color:'var(--text-secondary)',fontSize:13}}>No deliveries yet for {activeYear}.</p>:(
            <table><thead><tr><th>Customer</th><th>Order Date</th><th>Delivery Date</th><th>Products</th></tr></thead>
            <tbody>{ordersDelivered.map(o=>{
              const pc=Object.keys(o.products).filter(k=>o.products[k]>0).length;
              const lastDelivery=data.deliveries.filter(d=>d.orderId===o.id).sort((a,b)=>new Date(b.date||0)-new Date(a.date||0))[0];
              return(
              <tr key={o.id}><td style={{fontWeight:500}}>{o.customer}</td><td>{fmtDate(o.date)}</td><td style={{fontWeight:500,color:'var(--success)'}}>{lastDelivery?fmtDate(lastDelivery.date):'—'}</td><td><span className="tag">{pc} product{pc!==1?'s':''}</span></td></tr>
            );})}</tbody></table>
          )}
        </div>
      )}

      {/* ── DRILL-DOWN: Not Invoiced (item 4 companion) ── */}
      {drillDown==='invoice' && (
        <div className="drill-panel">
          <div className="drill-header"><h3>Orders Awaiting Invoice — {activeYear}</h3><button className="btn-icon" onClick={()=>setDrillDown(null)}><Icon name="x"/></button></div>
          {notInvoiced.length===0?<p style={{color:'var(--text-secondary)',fontSize:13}}>Everything in {activeYear} is invoiced.</p>:<>
            <p style={{fontSize:12,color:'var(--text-secondary)',marginBottom:10}}>Select these on the Orders page to bulk-mark them invoiced.</p>
            <table><thead><tr><th>Customer</th><th>Date</th><th>Products</th><th>Status</th><th>Delivered</th></tr></thead>
            <tbody>{[...notInvoiced].sort((a,b)=>new Date(b.date||0)-new Date(a.date||0)).map(o=>{
              const st=getStatus(o.status);const pc=Object.keys(o.products||{}).filter(k=>num(o.products[k])>0).length;const done=isOrderFullyDelivered(o.id);
              return <tr key={o.id} style={{cursor:'pointer'}} onClick={()=>onNavigate&&onNavigate('orders',{focusOrderId:o.id})}>
                <td style={{fontWeight:500}}>{o.customer}</td><td>{fmtDate(o.date)}</td>
                <td><span className="tag">{pc} product{pc!==1?'s':''}</span></td>
                <td><span className={`status-badge ${st.cls}`}><span className={`status-dot ${st.dot}`}></span>{st.label}</span></td>
                <td>{done?<span style={{color:'var(--success)',fontWeight:600}}>Yes</span>:<span style={{color:'var(--warning)'}}>Partial</span>}</td></tr>;
            })}</tbody></table></>}
        </div>
      )}

      {/* ── DRILL-DOWN: Total Orders ── */}
      {drillDown==='total' && (
        <div className="drill-panel">
          <div className="drill-header"><h3>All Orders — {activeYear}</h3><button className="btn-icon" onClick={()=>setDrillDown(null)}><Icon name="x"/></button></div>
          {/* .sort() on yearOrders mutated the memoised array in place — reordering the
              Orders page as a side effect of opening a Dashboard panel. Copy first. */}
          <table><thead><tr><th>Customer</th><th>Date</th><th>Products</th><th>Status</th><th>Invoiced</th></tr></thead>
          <tbody>{[...yearOrders].sort((a,b)=>new Date(b.date||0)-new Date(a.date||0)).map(o=>{const st=getStatus(o.status);const pc=Object.keys(o.products||{}).filter(k=>num(o.products[k])>0).length;return(
            <tr key={o.id}><td style={{fontWeight:500}}>{o.customer}</td><td>{fmtDate(o.date)}</td><td><span className="tag">{pc} product{pc!==1?'s':''}</span></td><td><span className={`status-badge ${st.cls}`}><span className={`status-dot ${st.dot}`}></span>{st.label}</span></td><td>{o.invoiced?'Yes':'No'}</td></tr>
          );})}</tbody></table>
        </div>
      )}

      {/* Status summary */}
      <div className="card">
        <div className="card-header"><h3>Order Status Breakdown — {activeYear}</h3></div>
        <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(200px,1fr))',gap:8}}>
          {STATUS_OPTIONS.map(s=>{const c=yearOrders.filter(o=>o.status===s.value).length;return(
            <div key={s.value} style={{display:'flex',alignItems:'center',gap:10,padding:'8px 12px',background:'#f8fafc',borderRadius:6}}>
              <span className={`status-dot ${s.dot}`}></span><span style={{flex:1,fontSize:13}}>{s.label}</span><span style={{fontWeight:700,fontSize:18}}>{c}</span>
            </div>
          );})}
        </div>
      </div>
    </div>
  );
}

// ══════════════════════════
// ── INVENTORY SCREEN ──
// ══════════════════════════
function InventoryScreen({onNavigate}) {
  const {data,allProducts,productsAZ,activeProducts,updateInventory,addInventory,getProductTotalSold,getProductAvailable,getProductSoldNotDelivered,getProductDelivered,getProductAdded,getProductReturned,showToast} = useApp();
  const [drillProduct,setDrillProduct] = useState(null);   // item 10: product → its orders
  const [bulkSearch,setBulkSearch] = useState('');          // item 12: search in bulk add
  const [addModal,setAddModal] = useState(null);
  const [addDate,setAddDate] = useState(today());
  const [addQty,setAddQty] = useState('');
  const [addNote,setAddNote] = useState('');
  const [editModal,setEditModal] = useState(null);
  const [editVal,setEditVal] = useState('');
  // Bulk add state
  const [bulkModal,setBulkModal] = useState(false);
  const [bulkDate,setBulkDate] = useState(today());
  const [bulkNote,setBulkNote] = useState('');
  const [bulkSelected,setBulkSelected] = useState({});
  const [bulkQtys,setBulkQtys] = useState({});
  const {sortKey:invSK,sortDir:invSD,toggleSort:invToggle,sortFn:invSort} = useSort('name');

  const handleAdd=()=>{if(!addQty||isNaN(addQty))return;addInventory(addModal,{date:addDate,qty:parseFloat(addQty),note:addNote});setAddModal(null);setAddQty('');setAddNote('');showToast('Inventory added');};

  const invRows = useMemo(()=>{
    const rows=allProducts.map(p=>{
      const inv=data.inventory[p.id]||{starting:0,additions:[]};
      const added=getProductAdded(p.id);              // num()-hardened, no NaN propagation
      const returned=getProductReturned(p.id);
      return{...p,inv,added,returned,sold:getProductTotalSold(p.id),delivered:getProductDelivered(p.id),snd:getProductSoldNotDelivered(p.id),avail:getProductAvailable(p.id)};
    });
    return invSort(rows,(r,k)=>{switch(k){case'name':return r.name;case'packaging':return r.packaging||'';case'starting':return num(r.inv.starting);case'added':return r.added;case'returned':return r.returned;case'sold':return r.sold;case'delivered':return r.delivered;case'snd':return r.snd;case'avail':return r.avail;default:return r.name;}});
  },[allProducts,data.inventory,getProductTotalSold,getProductDelivered,getProductSoldNotDelivered,getProductAvailable,getProductAdded,getProductReturned,invSK,invSD]);

  // Column totals — item 11. Every column is footed so the arithmetic is auditable at a glance.
  const invTotals = useMemo(()=>invRows.reduce((t,r)=>({
    starting:t.starting+num(r.inv.starting),added:t.added+r.added,returned:t.returned+r.returned,
    sold:t.sold+r.sold,delivered:t.delivered+r.delivered,snd:t.snd+r.snd,avail:t.avail+r.avail
  }),{starting:0,added:0,returned:0,sold:0,delivered:0,snd:0,avail:0}),[invRows]);

  // Item 12: alphabetised + searchable product list for bulk add.
  const bulkList = useMemo(()=>{
    const q=bulkSearch.trim().toLowerCase();
    return q?productsAZ.filter(p=>productDisplayName(p).toLowerCase().includes(q)):productsAZ;
  },[productsAZ,bulkSearch]);

  const openBulkModal=()=>{setBulkModal(true);setBulkDate(today());setBulkNote('');setBulkSelected({});setBulkQtys({});setBulkSearch('');};
  const toggleBulkProduct=(pid)=>{setBulkSelected(s=>({...s,[pid]:!s[pid]}));};
  // Selects only what's currently VISIBLE. Selecting all 45 products while a search
  // filter was active used to silently arm rows the user could not see.
  const selectAllBulk=()=>{setBulkSelected(s=>{const n={...s};bulkList.forEach(p=>{n[p.id]=true;});return n;});};
  const clearAllBulk=()=>{setBulkSelected({});setBulkQtys({});};
  const setBulkQty=(pid,val)=>{setBulkQtys(q=>({...q,[pid]:val}));};
  const selectedCount=Object.values(bulkSelected).filter(Boolean).length;
  const handleBulkAdd=()=>{
    let count=0;
    const entries=Object.entries(bulkSelected).filter(([_,v])=>v);
    entries.forEach(([pid])=>{
      const q=parseFloat(bulkQtys[pid]);
      if(q&&!isNaN(q)&&q>0){addInventory(pid,{date:bulkDate,qty:q,note:bulkNote||'Bulk addition'});count++;}
    });
    if(count===0){showToast('Enter quantities for selected products');return;}
    setBulkModal(false);showToast(count+' product'+(count>1?'s':'')+' updated');
  };

  return (
    <div className="fade-in">
      <div className="page-header" style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start'}}>
        <div><h2>Inventory Management</h2><p>Track starting, added, and available inventory by product</p></div>
        <button className="btn btn-primary" onClick={openBulkModal}><Icon name="plus" size={14}/>Bulk Add Inventory</button>
      </div>
      <div className="card"><div className="inv-table-wrap"><table className="freeze-table">
        <thead><tr>
          <SortTh label="Product" colKey="name" sortKey={invSK} sortDir={invSD} onSort={invToggle}/>
          <SortTh label="Packaging" colKey="packaging" sortKey={invSK} sortDir={invSD} onSort={invToggle}/>
          <SortTh label="Starting" colKey="starting" sortKey={invSK} sortDir={invSD} onSort={invToggle} style={{textAlign:'right'}}/>
          <SortTh label="Added" colKey="added" sortKey={invSK} sortDir={invSD} onSort={invToggle} style={{textAlign:'right'}}/>
          <SortTh label="Returned" colKey="returned" sortKey={invSK} sortDir={invSD} onSort={invToggle} style={{textAlign:'right'}}/>
          <SortTh label="Total Sold" colKey="sold" sortKey={invSK} sortDir={invSD} onSort={invToggle} style={{textAlign:'right'}}/>
          <SortTh label="Delivered" colKey="delivered" sortKey={invSK} sortDir={invSD} onSort={invToggle} style={{textAlign:'right'}}/>
          <SortTh label="Sold, Not Del." colKey="snd" sortKey={invSK} sortDir={invSD} onSort={invToggle} style={{textAlign:'right'}}/>
          <SortTh label="Available" colKey="avail" sortKey={invSK} sortDir={invSD} onSort={invToggle} style={{textAlign:'right'}}/>
          <th></th>
        </tr></thead>
        <tbody>{invRows.map(p=>{
          return <tr key={p.id}>
            {/* Item 10: product name opens every order containing this product */}
            <td style={{fontWeight:500}}>
              <a role="button" tabIndex={0} onClick={()=>setDrillProduct(p.id)} onKeyDown={e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();setDrillProduct(p.id);}}}
                 style={{color:'var(--primary)',cursor:'pointer',textDecoration:'underline',textDecorationStyle:'dotted',textUnderlineOffset:3}}
                 title="View all orders containing this product">{p.name}</a>
            </td>
            <td>{p.packaging?<span className="tag" style={{background:p.packaging==='Tote'?'var(--purple-bg)':'var(--cyan-bg)',color:p.packaging==='Tote'?'var(--purple)':'var(--cyan)',fontSize:11}}>{p.packaging}</span>:<span style={{color:'var(--text-secondary)',fontSize:12}}>—</span>}</td>
            <td className="inv-cell">{fmt(num(p.inv.starting))}</td>
            <td className="inv-cell positive">{p.added>0?'+'+fmt(p.added):'—'}{p.inv.additions.length>0&&<div style={{fontSize:10,color:'#94a3b8'}}>{p.inv.additions.length} addition{p.inv.additions.length>1?'s':''}</div>}</td>
            <td className="inv-cell" style={{color:p.returned>0?'var(--cyan)':'inherit'}}>{p.returned>0?'+'+fmt(p.returned):'—'}</td>
            <td className="inv-cell">{fmt(p.sold)}</td>
            <td className="inv-cell" style={{color:'var(--success)'}}>{fmt(p.delivered)}</td>
            {/* Was fmt(Math.max(0,p.snd)) — that clamp HID over-delivery. A negative value
                here means more went out than was ordered: invoice it or weigh it back. */}
            <td className="inv-cell" style={{color:p.snd>0?'var(--warning)':p.snd<0?'var(--danger)':'inherit',fontWeight:p.snd!==0?600:400}}
                title={p.snd<0?'Over-delivered — needs invoice or weigh-back':''}>
              {fmt(p.snd)}{p.snd<0&&<span style={{fontSize:9,display:'block',color:'var(--danger)'}}>over-delivered</span>}
            </td>
            <td className={`inv-cell ${p.avail<0?'negative':'positive'}`} style={{fontWeight:700}}>{fmt(p.avail)}</td>
            <td style={{textAlign:'right',whiteSpace:'nowrap'}}>
              <button className="btn btn-sm btn-secondary" style={{marginRight:4}} onClick={()=>setEditModal(p.id)}><Icon name="edit" size={14}/>Edit</button>
              <button className="btn btn-sm btn-secondary" onClick={()=>setAddModal(p.id)}><Icon name="plus" size={14}/>Add</button>
            </td>
          </tr>;
        })}</tbody>
        <tfoot><tr>
          <td>TOTALS</td><td></td>
          <td className="inv-cell">{fmt(invTotals.starting)}</td>
          <td className="inv-cell">{invTotals.added>0?'+'+fmt(invTotals.added):'—'}</td>
          <td className="inv-cell">{invTotals.returned>0?'+'+fmt(invTotals.returned):'—'}</td>
          <td className="inv-cell">{fmt(invTotals.sold)}</td>
          <td className="inv-cell">{fmt(invTotals.delivered)}</td>
          <td className="inv-cell">{fmt(invTotals.snd)}</td>
          <td className="inv-cell">{fmt(invTotals.avail)}</td>
          <td></td>
        </tr></tfoot>
      </table></div></div>

      {/* Item 10: drill-down — all orders involving a product */}

      {/* Single product add modal */}
      {addModal&&<Modal title={`Add Inventory — ${productDisplayName(allProducts.find(p=>p.id===addModal)||{name:addModal})}`} onClose={()=>setAddModal(null)}>
        <div className="modal-body">

          <div className="form-group"><label>Quantity</label><input type="number" step="0.1" placeholder="Enter quantity" value={addQty} onChange={e=>setAddQty(e.target.value)}/></div>
          <div className="form-group"><label>Note (optional)</label><input placeholder="e.g., Restock from supplier" value={addNote} onChange={e=>setAddNote(e.target.value)}/></div>
          {(data.inventory[addModal]?.additions||[]).length>0&&<div style={{marginTop:16}}><h4 style={{fontSize:13,fontWeight:600,marginBottom:8}}>Addition History</h4><table><thead><tr><th>Date</th><th>Qty</th><th>Note</th></tr></thead><tbody>{(data.inventory[addModal]?.additions||[]).map((a,i)=><tr key={i}><td>{fmtDate(a.date)}</td><td>{fmt(a.qty)}</td><td>{a.note||'—'}</td></tr>)}</tbody></table></div>}
        </div>
        <div className="modal-footer"><button className="btn btn-secondary" onClick={()=>setAddModal(null)}>Cancel</button><button className="btn btn-primary" onClick={handleAdd}>Add Inventory</button></div>
      </Modal>}

      {/* Bulk add modal */}
      {bulkModal&&<div className="modal-overlay" onClick={e=>{if(e.target===e.currentTarget)setBulkModal(false);}}>
        <div className="modal" style={{maxWidth:700}}>
          <div className="modal-header"><h3>Bulk Add Inventory</h3><button className="btn-icon" onClick={()=>setBulkModal(false)}><Icon name="x" size={16}/></button></div>
          <div className="modal-body">
            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12,marginBottom:16}}>
              <div className="form-group"><label>Date</label><input type="date" value={bulkDate} onChange={e=>setBulkDate(e.target.value)}/></div>
              <div className="form-group"><label>Note (optional)</label><input placeholder="e.g., Spring restock" value={bulkNote} onChange={e=>setBulkNote(e.target.value)}/></div>
            </div>
            {/* Item 12: search box — 45+ products was unusable as a flat list */}
            <div className="search-box" style={{marginBottom:10}}>
              <Icon name="search"/>
              <input placeholder="Search products to add individually..." value={bulkSearch} onChange={e=>setBulkSearch(e.target.value)}/>
            </div>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:12}}>
              <span style={{fontSize:13,fontWeight:600,color:'var(--text-secondary)'}}>
                {selectedCount} product{selectedCount!==1?'s':''} selected
                {bulkSearch&&<span style={{fontWeight:400,marginLeft:6}}>· {bulkList.length} match{bulkList.length!==1?'es':''}</span>}
              </span>
              <div style={{display:'flex',gap:8}}>
                {/* Select All now applies to the VISIBLE (filtered) list, not the hidden full list */}
                <button className="btn btn-sm btn-secondary" onClick={selectAllBulk}>Select {bulkSearch?'Matches':'All'}</button>
                <button className="btn btn-sm btn-secondary" onClick={clearAllBulk}>Clear All</button>
              </div>
            </div>
            <div style={{maxHeight:400,overflowY:'auto',border:'1px solid var(--border)',borderRadius:6}}>
              <table>
                <thead><tr><th style={{width:36}}></th><th>Product</th><th style={{textAlign:'right',width:100}}>Current Avail.</th><th style={{width:120}}>Add Qty</th></tr></thead>
                <tbody>{bulkList.length===0?<tr><td colSpan="4" style={{textAlign:'center',padding:24,color:'var(--text-secondary)',fontSize:13}}>No products match "{bulkSearch}"</td></tr>:bulkList.map(p=>{
                  const avail=getProductAvailable(p.id);
                  const sel=!!bulkSelected[p.id];
                  return <tr key={p.id} style={{background:sel?'var(--primary-bg)':'transparent',cursor:'pointer'}} onClick={()=>toggleBulkProduct(p.id)}>
                    <td style={{textAlign:'center'}}><input type="checkbox" checked={sel} onChange={()=>toggleBulkProduct(p.id)} onClick={e=>e.stopPropagation()} style={{width:'auto',cursor:'pointer'}}/></td>
                    <td style={{fontWeight:500}}>{productDisplayName(p)}</td>
                    <td className={`inv-cell ${avail<0?'negative':'positive'}`} style={{fontWeight:600}}>{fmt(avail)}</td>
                    <td onClick={e=>e.stopPropagation()}><input type="number" step="0.1" placeholder="0" disabled={!sel} value={bulkQtys[p.id]||''} onChange={e=>setBulkQty(p.id,e.target.value)} style={{opacity:sel?1:0.4,textAlign:'right',padding:'5px 8px'}}/></td>
                  </tr>;
                })}</tbody>
              </table>
            </div>
          </div>
          <div className="modal-footer">
            <button className="btn btn-secondary" onClick={()=>setBulkModal(false)}>Cancel</button>
            <button className="btn btn-primary" disabled={selectedCount===0} onClick={handleBulkAdd}><Icon name="plus" size={14}/>Add to {selectedCount} Product{selectedCount!==1?'s':''}</button>
          </div>
        </div>
      </div>}

      {/* Full inventory edit modal — starting qty + manage additions */}
      {editModal&&<InventoryEditModal productId={editModal} onClose={()=>setEditModal(null)}/>}
    </div>
  );
}

// ── ITEM 10: PRODUCT → ALL ORDERS DRILL-DOWN ──
// Clicking a product on the Inventory page opens every order that involves it,
// with per-order delivered/remaining so you can see exactly where the stock is committed.
function ProductOrdersModal({productId,onClose,onNavigate}) {
  const {data,allProducts,getOrderDelivered,getProductAvailable,getProductTotalSold,getProductDelivered,activeYear,fyStart,fyLabel} = useApp();
  const p = allProducts.find(x=>x.id===productId)||{name:productId,packaging:''};
  const [allYears,setAllYears] = useState(false);

  const rows = useMemo(()=>{
    return data.orders
      .filter(o=>num(o.products?.[productId])>0)
      .filter(o=>allYears||getFiscalYear(o.date,fyStart,fyLabel)===activeYear)
      .map(o=>{
        const ordered=num(o.products[productId]);
        const delivered=num(getOrderDelivered(o.id)[productId]);
        return {...o,ordered,delivered,remaining:ordered-delivered};
      })
      .sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  },[data.orders,productId,allYears,activeYear,fyStart,fyLabel,getOrderDelivered]);

  const totals = rows.reduce((t,r)=>({ordered:t.ordered+r.ordered,delivered:t.delivered+r.delivered,remaining:t.remaining+r.remaining}),{ordered:0,delivered:0,remaining:0});

  return <Modal title={`Orders containing ${productDisplayName(p)}`} onClose={onClose} wide>
    <div className="modal-body">
      <div style={{display:'flex',gap:12,flexWrap:'wrap',marginBottom:14}}>
        <div className="tag" style={{background:'var(--primary-bg)',color:'var(--primary)',fontSize:12,padding:'6px 12px'}}>Available: <strong style={{marginLeft:4}}>{fmt(getProductAvailable(productId))}</strong></div>
        <div className="tag" style={{fontSize:12,padding:'6px 12px'}}>Total sold: <strong style={{marginLeft:4}}>{fmt(getProductTotalSold(productId))}</strong></div>
        <div className="tag" style={{fontSize:12,padding:'6px 12px'}}>Delivered: <strong style={{marginLeft:4}}>{fmt(getProductDelivered(productId))}</strong></div>
        <label style={{display:'flex',alignItems:'center',gap:6,fontSize:12,cursor:'pointer',marginLeft:'auto'}}>
          <input type="checkbox" checked={allYears} onChange={e=>setAllYears(e.target.checked)} style={{width:'auto'}}/>Show all years
        </label>
      </div>
      {rows.length===0
        ? <p style={{color:'var(--text-secondary)',fontSize:13,padding:'20px 0',textAlign:'center'}}>No {allYears?'':activeYear+' '}orders contain this product.</p>
        : <div className="inv-table-wrap" style={{maxHeight:'50vh'}}><table className="freeze-table">
            <thead><tr><th>Customer</th><th>Order Date</th><th>Status</th><th style={{textAlign:'right'}}>Ordered</th><th style={{textAlign:'right'}}>Delivered</th><th style={{textAlign:'right'}}>Remaining</th></tr></thead>
            <tbody>{rows.map(r=>{const st=getStatus(r.status);return <tr key={r.id} style={{cursor:onNavigate?'pointer':'default'}}
                onClick={()=>{if(onNavigate){onClose();onNavigate('orders',{focusOrderId:r.id});}}}>
              <td style={{fontWeight:500}}>{r.customer}</td>
              <td>{fmtDate(r.date)}</td>
              <td><span className={`status-badge ${st.cls}`}><span className={`status-dot ${st.dot}`}></span>{st.label}</span></td>
              <td className="inv-cell">{fmt(r.ordered)}</td>
              <td className="inv-cell" style={{color:'var(--success)'}}>{fmt(r.delivered)}</td>
              <td className="inv-cell" style={{fontWeight:600,color:r.remaining>0?'var(--warning)':r.remaining<0?'var(--danger)':'var(--success)'}}>{fmt(r.remaining)}</td>
            </tr>;})}</tbody>
            <tfoot><tr>
              <td>TOTALS</td><td></td><td></td>
              <td className="inv-cell">{fmt(totals.ordered)}</td>
              <td className="inv-cell">{fmt(totals.delivered)}</td>
              <td className="inv-cell">{fmt(totals.remaining)}</td>
            </tr></tfoot>
          </table></div>}
    </div>
    <div className="modal-footer"><button className="btn btn-secondary" onClick={onClose}>Close</button></div>
  </Modal>;
}

function InventoryEditModal({productId,onClose}) {
  const {data,allProducts,updateInventory,showToast} = useApp();
  const p = allProducts.find(x=>x.id===productId)||{name:productId,packaging:''};
  const inv = data.inventory[productId]||{starting:0,additions:[]};
  const [starting,setStarting] = useState(String(inv.starting));
  const [additions,setAdditions] = useState(inv.additions.map((a,i)=>({...a,_key:i})));
  const [newDate,setNewDate] = useState(today());
  const [newQty,setNewQty] = useState('');
  const [newNote,setNewNote] = useState('');

  const addRow=()=>{
    const qty=parseFloat(newQty);
    if(!qty||isNaN(qty)){alert('Enter a valid quantity');return;}
    setAdditions(prev=>[...prev,{date:newDate,qty,note:newNote,_key:Date.now()}]);
    setNewQty('');setNewNote('');
  };
  const deleteRow=key=>setAdditions(prev=>prev.filter(a=>a._key!==key));
  const updateRow=(key,field,val)=>setAdditions(prev=>prev.map(a=>a._key===key?{...a,[field]:field==='qty'?parseFloat(val)||0:val}:a));

  const save=()=>{
    const clean=additions.map(({_key,...rest})=>rest);
    updateInventory(productId,'starting',parseFloat(starting)||0);
    updateInventory(productId,'additions',clean);
    showToast('Inventory updated');
    onClose();
  };

  return <Modal title={`Edit Inventory — ${productDisplayName(p)}`} onClose={onClose} wide>
    <div className="modal-body">
      <div className="form-group" style={{maxWidth:200}}><label>Starting Inventory</label><input type="number" step="0.1" value={starting} onChange={e=>setStarting(e.target.value)}/></div>
      <h4 style={{fontSize:13,fontWeight:600,margin:'16px 0 8px'}}>Inventory Additions</h4>
      <table style={{fontSize:13}}><thead><tr><th>Date</th><th style={{textAlign:'right'}}>Qty</th><th>Note</th><th></th></tr></thead>
        <tbody>
          {additions.map(a=><tr key={a._key}>
            <td><input type="date" value={a.date} onChange={e=>updateRow(a._key,'date',e.target.value)} style={{padding:'4px 6px',fontSize:12}}/></td>
            <td><input type="number" step="0.1" value={a.qty} onChange={e=>updateRow(a._key,'qty',e.target.value)} style={{width:80,textAlign:'right',padding:'4px 6px',fontSize:12}}/></td>
            <td><input value={a.note||''} onChange={e=>updateRow(a._key,'note',e.target.value)} placeholder="Note" style={{padding:'4px 6px',fontSize:12}}/></td>
            <td><button className="btn-icon" onClick={()=>deleteRow(a._key)}><Icon name="trash" size={14}/></button></td>
          </tr>)}
          <tr style={{background:'var(--primary-bg)'}}>
            <td><input type="date" value={newDate} onChange={e=>setNewDate(e.target.value)} style={{padding:'4px 6px',fontSize:12}}/></td>
            <td><input type="number" step="0.1" placeholder="Qty" value={newQty} onChange={e=>setNewQty(e.target.value)} style={{width:80,textAlign:'right',padding:'4px 6px',fontSize:12}}/></td>
            <td><input value={newNote} onChange={e=>setNewNote(e.target.value)} placeholder="Note (optional)" style={{padding:'4px 6px',fontSize:12}}/></td>
            <td><button className="btn btn-sm btn-primary" onClick={addRow}><Icon name="plus" size={12}/>Add</button></td>
          </tr>
        </tbody>
      </table>
    </div>
    <div className="modal-footer"><button className="btn btn-secondary" onClick={onClose}>Cancel</button><button className="btn btn-primary" onClick={save}>Save Changes</button></div>
  </Modal>;
}

// ══════════════════════
// ── ORDERS SCREEN ──
// ══════════════════════
function OrdersScreen({onNavigate,navArg}) {
  const {data,allProducts,yearOrders,activeYear,setActiveYear,visibleYears,archivedYears,fyStart,fyLabel,deleteOrder,bulkUpdateOrders,activeProducts,isOrderFullyDelivered,getOrderDelivered} = useApp();
  const [showAdd,setShowAdd] = useState(false);
  const [filter,setFilter] = useState('all');
  const [search,setSearch] = useState('');
  const [editOrder,setEditOrder] = useState(null);
  const [showArchived,setShowArchived] = useState(false);
  const [viewMode,setViewMode] = useState('list'); // 'list' or 'matrix'
  const [selected,setSelected] = useState({});         // item 4: bulk selection
  const [deliverOrder,setDeliverOrder] = useState(null); // item 2: deliver from a row
  const [invoiceFilter,setInvoiceFilter] = useState('all');
  const [pickOrder,setPickOrder] = useState(null);       // matrix row → which order?

  // Deep link from the Inventory drill-down: open the order that was clicked.
  useEffect(()=>{
    if(navArg&&navArg.focusOrderId){
      const o=data.orders.find(x=>x.id===navArg.focusOrderId);
      if(o) setEditOrder(o);
    }
  },[navArg,data.orders]);
  const {sortKey:olSK,sortDir:olSD,toggleSort:olToggle,sortFn:olSort} = useSort(null);
  const {sortKey:mSK,sortDir:mSD,toggleSort:mToggle,sortFn:mSort} = useSort('customer');

  const allYears = showArchived ? [...visibleYears,...archivedYears].sort().reverse() : visibleYears;

  const filtered = useMemo(()=>{
    let orders=[...yearOrders];
    if(filter!=='all')orders=orders.filter(o=>o.status===filter);
    if(invoiceFilter==='yes')orders=orders.filter(o=>o.invoiced);
    if(invoiceFilter==='no')orders=orders.filter(o=>!o.invoiced);
    if(search)orders=orders.filter(o=>o.customer.toLowerCase().includes(search.toLowerCase()));
    if(!olSK) orders.sort((a,b)=>new Date(b.date||0)-new Date(a.date||0));
    else orders=olSort(orders,(o,k)=>{switch(k){case'customer':return o.customer;case'date':return o.date||'';case'products':return Object.keys(o.products||{}).filter(x=>num(o.products[x])>0).length;case'status':return o.status;case'invoiced':return o.invoiced?1:0;default:return o.customer;}});
    return orders;
  },[yearOrders,filter,invoiceFilter,search,olSK,olSD]);

  // ── ITEM 4: BULK SELECTION ──
  // Selection is pruned to what's currently visible. Without this, filtering the list
  // after selecting would leave invisible rows armed and a bulk action would silently
  // mutate orders the user could no longer see.
  const visibleIds = useMemo(()=>new Set(filtered.map(o=>o.id)),[filtered]);
  const selectedIds = useMemo(()=>Object.keys(selected).filter(id=>selected[id]&&visibleIds.has(id)),[selected,visibleIds]);
  const allVisibleSelected = filtered.length>0 && selectedIds.length===filtered.length;
  const toggleAllVisible=()=>{
    if(allVisibleSelected){setSelected({});return;}
    const n={};filtered.forEach(o=>{n[o.id]=true;});setSelected(n);
  };
  const toggleOne=id=>setSelected(s=>({...s,[id]:!s[id]}));
  const clearSelection=()=>setSelected({});
  const applyBulk=(patch,label)=>{
    if(selectedIds.length===0) return;
    bulkUpdateOrders(selectedIds,patch);
    clearSelection();
  };
  // Reset selection when switching year or view — stale IDs across contexts are a footgun.
  useEffect(()=>{setSelected({});},[activeYear,viewMode]);

  // Spreadsheet view: determine which products are used across all visible orders
  const spreadsheetProducts = useMemo(()=>{
    const used=new Set();
    yearOrders.forEach(o=>Object.keys(o.products).forEach(pid=>{if(o.products[pid]>0)used.add(pid);}));
    return allProducts.filter(p=>used.has(p.id));
  },[yearOrders,allProducts]);

  // Group orders by customer for spreadsheet view, aggregate if multiple orders per customer
  const spreadsheetRows = useMemo(()=>{
    const map={};
    const fOrders = filter!=='all' ? yearOrders.filter(o=>o.status===filter) : yearOrders;
    const sOrders = search ? fOrders.filter(o=>o.customer.toLowerCase().includes(search.toLowerCase())) : fOrders;
    sOrders.forEach(o=>{
      if(!map[o.customer]) map[o.customer]={customer:o.customer,products:{},status:o.status,orderCount:0};
      map[o.customer].orderCount++;
      Object.entries(o.products).forEach(([pid,qty])=>{if(qty>0)map[o.customer].products[pid]=(map[o.customer].products[pid]||0)+qty;});
    });
    const rows=Object.values(map);
    return mSort(rows,(r,k)=>{if(k==='customer')return r.customer;if(k==='status')return r.status;const p=spreadsheetProducts.find(x=>x.id===k);return p?r.products[k]||0:r.customer;});
  },[yearOrders,filter,search,mSK,mSD]);

  // Column totals for spreadsheet
  const colTotals = useMemo(()=>{
    const t={};spreadsheetProducts.forEach(p=>{t[p.id]=spreadsheetRows.reduce((s,r)=>s+(r.products[p.id]||0),0);});return t;
  },[spreadsheetProducts,spreadsheetRows]);

  return (
    <div className="fade-in">
      <div className="page-header" style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start'}}>
        <div><h2>Orders</h2><p>{yearOrders.length} orders in {activeYear}</p></div>
        <div style={{display:'flex',gap:8,alignItems:'center'}}>
          <select value={activeYear} onChange={e=>setActiveYear(e.target.value)} style={{width:'auto',padding:'6px 10px',fontSize:13,fontWeight:600}}>
            {allYears.map(y=><option key={y} value={y}>{y}{archivedYears.includes(y)?' (Archived)':''}</option>)}
          </select>
          <button className="btn btn-sm btn-secondary" onClick={()=>setShowArchived(!showArchived)}><Icon name="archive" size={14}/>{showArchived?'Hide':'Show'} Archived</button>
          <button className="btn btn-primary" onClick={()=>setShowAdd(true)}><Icon name="plus" size={16}/>New Order</button>
        </div>
      </div>

      {/* View toggle */}
      <div className="card" style={{padding:'12px 16px',display:'flex',gap:12,alignItems:'center',flexWrap:'wrap'}}>
        <div style={{display:'flex',gap:0,border:'1px solid var(--border)',borderRadius:6,overflow:'hidden',marginRight:8}}>
          <button onClick={()=>setViewMode('list')} style={{padding:'6px 14px',fontSize:12,fontWeight:600,cursor:'pointer',border:'none',background:viewMode==='list'?'var(--primary)':'#fff',color:viewMode==='list'?'#fff':'var(--text-secondary)',transition:'all .15s',display:'flex',alignItems:'center',gap:4}}><Icon name="list" size={14}/>List</button>
          <button onClick={()=>setViewMode('matrix')} style={{padding:'6px 14px',fontSize:12,fontWeight:600,cursor:'pointer',border:'none',borderLeft:'1px solid var(--border)',background:viewMode==='matrix'?'var(--primary)':'#fff',color:viewMode==='matrix'?'#fff':'var(--text-secondary)',transition:'all .15s',display:'flex',alignItems:'center',gap:4}}><Icon name="grid" size={14}/>Matrix</button>
        </div>
        <div className="search-box" style={{flex:1,minWidth:200}}><Icon name="search"/><input placeholder="Search customers..." value={search} onChange={e=>setSearch(e.target.value)}/></div>
        {viewMode==='list'&&<div className="chip-select">
          <span className={`chip ${filter==='all'?'selected':''}`} onClick={()=>setFilter('all')}>All</span>
          {STATUS_OPTIONS.map(s=><span key={s.value} className={`chip ${filter===s.value?'selected':''}`} onClick={()=>setFilter(s.value)}>{s.label}</span>)}
          <span style={{width:1,background:'var(--border)',margin:'0 4px'}}></span>
          <span className={`chip ${invoiceFilter==='no'?'selected':''}`} onClick={()=>setInvoiceFilter(invoiceFilter==='no'?'all':'no')}>Not Invoiced</span>
