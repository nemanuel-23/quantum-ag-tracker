              <td style={{padding:'6px 8px'}}><input type="checkbox" checked={included} onChange={()=>toggleProduct(l.pid)} style={{width:'auto'}}/></td>
              <td style={{fontWeight:500}}>{productDisplayName(p||{name:l.pid})}</td>
              <td className="inv-cell">{fmt(l.ordered)}</td>
              <td className="inv-cell" style={{color:l.delivered>0?'var(--primary)':'var(--text-secondary)'}}>{fmt(l.delivered)}</td>
              <td className="inv-cell" style={{fontWeight:600,color:l.remaining>0?'var(--warning)':'var(--success)'}}>{fmt(l.remaining)}</td>
              <td style={{textAlign:'right',padding:'4px 8px'}}>
                {/* ITEM 3.1: the old `max={remaining}` + Math.min() clamp made
                    over-delivery impossible. Removed — surplus is now allowed and flagged. */}
                <input type="number" step="0.1" min="0"
                  style={{width:90,textAlign:'right',borderColor:included&&over>0?'var(--danger)':undefined,
                          background:included&&over>0?'#fef2f2':undefined}}
                  disabled={!included} value={included?(products[l.pid]??''):''}
                  onChange={e=>{const v=num(e.target.value);setProducts(ps=>({...ps,[l.pid]:v}));}}/>
                {included&&over>0&&<div style={{fontSize:10,color:'var(--danger)',fontWeight:600,marginTop:2}}>+{fmt(over)} over</div>}
              </td>
            </tr>;})}
          </tbody>
        </table>

        {/* ── ITEM 3.1: overage warning ── */}
        {hasOverage&&<div style={{marginTop:12,padding:'12px 14px',background:'#fef2f2',border:'1px solid #fecaca',borderRadius:6}}>
          <div style={{fontSize:13,fontWeight:600,color:'var(--danger)',display:'flex',alignItems:'center',gap:6}}>
            <Icon name="alert" size={15}/>Delivering more than ordered
          </div>
          <div style={{fontSize:12,color:'#991b1b',marginTop:6}}>
            {overLines.map(l=>{const p=allProducts.find(x=>x.id===l.pid);
              return <div key={l.pid}>{productDisplayName(p||{name:l.pid})}: <strong>+{fmt(l.over)}</strong> over ordered</div>;})}
            <div style={{marginTop:6}}>This will be flagged on the Dashboard as <strong>needs invoice or weigh-back</strong>. Use a Return ticket if the excess comes back.</div>
          </div>
        </div>}

        {/* ── ITEM 8: add products not on the original order ── */}
        <div style={{marginTop:16}}>
          {!showAddProduct
            ? <button className="btn btn-sm btn-secondary" onClick={()=>setShowAddProduct(true)}><Icon name="plus" size={14}/>Add Product Not On Order</button>
            : <div style={{border:'1px solid var(--border)',borderRadius:6,padding:12,background:'#f8fafc'}}>
                <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:8}}>
                  <h4 style={{fontSize:13,fontWeight:600}}>Additional Products</h4>
                  <button className="btn-icon" onClick={()=>{setShowAddProduct(false);setExtraSearch('');}}><Icon name="x" size={14}/></button>
                </div>
                <p style={{fontSize:11,color:'var(--text-secondary)',marginBottom:8}}>These are added to the order as well as this delivery, so the order stays reconcilable.</p>
                <div className="search-box" style={{marginBottom:8}}><Icon name="search"/>
                  <input placeholder="Search products..." value={extraSearch} onChange={e=>setExtraSearch(e.target.value)}/></div>
                <div style={{maxHeight:180,overflowY:'auto',display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(230px,1fr))',gap:8}}>
                  {extraCandidates.slice(0,60).map(p=><div key={p.id} style={{display:'flex',alignItems:'center',gap:8}}>
                    <span style={{fontSize:12,flex:1,minWidth:0,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{productDisplayName(p)}</span>
                    <input type="number" step="0.1" min="0" style={{width:75}} placeholder="0" value={extraProducts[p.id]||''} onChange={e=>setExtra(p.id,e.target.value)}/>
                  </div>)}
                </div>
              </div>}
          {extraCount>0&&<div style={{marginTop:8,fontSize:12,color:'var(--primary)'}}>
            <strong>{extraCount}</strong> additional product{extraCount!==1?'s':''} will be added to the order.</div>}
        </div>

        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:12,marginTop:16}}>
          <div className="form-group"><label>Pumps Out (qty)</label><input type="number" min="0" value={pumpsOut} onChange={e=>setPumpsOut(e.target.value)} placeholder="0"/></div>
          <div className="form-group"><label>Pump Return Date</label><input type="date" value={pumpsReturnDate} onChange={e=>setPumpsReturnDate(e.target.value)}/></div>
          <div className="form-group"><label>Totes (qty)</label><input type="number" min="0" value={totes} onChange={e=>setTotes(e.target.value)} placeholder="0"/></div>
        </div>

        {/* ── ITEM 7: delivery notes ── */}
        <div className="form-group">
          <label style={{display:'flex',alignItems:'center',gap:5}}><Icon name="note" size={12}/>Notes (printed on the delivery ticket)</label>
          <textarea rows="3" value={notes} onChange={e=>setNotes(e.target.value)}
            placeholder="Left in west shed, gate code 4412, call before next delivery..."/>
        </div>

        {/* ── ITEM 9: electronic signature ── */}
        <div style={{marginTop:8,padding:16,background:'#f8fafc',borderRadius:8,border:'1px solid var(--border)'}}>
          <h4 style={{fontSize:14,fontWeight:600,marginBottom:10,display:'flex',alignItems:'center',gap:6}}><Icon name="pen" size={14}/>Signatures</h4>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12}}>
            <div className="form-group"><label>Delivered By (user)</label>
              <select value={deliveredBy} onChange={e=>setDeliveredBy(e.target.value)}>
                <option value="">-- Select user --</option>
                {users.map(u=><option key={u} value={u}>{u}</option>)}
              </select>
              <p style={{fontSize:10,color:'var(--text-secondary)',marginTop:4}}>Manage users in Settings</p>
            </div>
            <div className="form-group"><label>Driver Signature (type full name)</label>
              <input value={driverSig} onChange={e=>setDriverSig(e.target.value)} placeholder="Type name to sign"
                style={{fontFamily:driverSig?'Georgia,serif':'inherit',fontStyle:driverSig?'italic':'normal',fontSize:driverSig?15:13}}/></div>
            <div className="form-group" style={{gridColumn:'1 / -1'}}><label>Customer Signature (type full name)</label>
              <input value={customerSig} onChange={e=>setCustomerSig(e.target.value)} placeholder="Customer types their name to accept delivery"
                style={{fontFamily:customerSig?'Georgia,serif':'inherit',fontStyle:customerSig?'italic':'normal',fontSize:customerSig?15:13}}/></div>
          </div>
          {(driverSig||customerSig)&&<p style={{fontSize:11,color:'var(--text-secondary)',marginTop:4}}>
            Signed electronically on {new Date().toLocaleString()}. Typed signatures are recorded with a timestamp and printed on the ticket.</p>}
        </div>

        {/* ── PHOTO / VIDEO CAPTURE ── */}
        <div style={{marginTop:16,padding:16,background:'#f8fafc',borderRadius:8,border:'1px solid var(--border)'}}>
          <h4 style={{fontSize:14,fontWeight:600,marginBottom:10}}>Photos & Video</h4>
          <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
            <button className="btn btn-secondary" onClick={()=>{setCameraMode('photo');startCamera();}}><Icon name="camera" size={14}/>Take Photo</button>
            <button className="btn btn-secondary" onClick={()=>{setCameraMode('video');startCamera();}}><Icon name="camera" size={14}/>Record Video</button>
            <button className="btn btn-secondary" onClick={()=>fileInputRef.current?.click()}><Icon name="upload" size={14}/>Upload File</button>
            <input ref={fileInputRef} type="file" accept="image/*,video/*" multiple style={{display:'none'}} onChange={handleFileUpload} capture="environment"/>
          </div>
          {showCamera&&<div style={{marginTop:12}}>
            <video ref={videoRef} autoPlay playsInline muted className="camera-preview"/>
            <div style={{display:'flex',gap:8,marginTop:8}}>
              {cameraMode==='photo'?<button className="btn btn-primary" onClick={capturePhoto}><Icon name="camera" size={14}/>Capture</button>:
                recording?<button className="btn btn-danger" onClick={stopRecording}>Stop Recording</button>:<button className="btn btn-danger" onClick={startRecording}>Start Recording (max 30s)</button>}
              <button className="btn btn-secondary" onClick={stopCamera}>Close Camera</button>
            </div>
          </div>}
          {attachments.length>0&&<div className="photo-grid">{attachments.map((a,i)=><div key={i} className="photo-thumb">
            {a.type==='photo'?<img src={a.data}/>:<video src={a.data} controls/>}
            <button className="photo-remove" onClick={()=>removeAttachment(i)}>x</button>
          </div>)}</div>}
        </div>

        <div style={{marginTop:12,padding:'8px 12px',background:'var(--primary-bg)',borderRadius:6,fontSize:12,color:'var(--primary)'}}>
          Order status updates automatically to <strong>Partial Delivery</strong> or <strong>Paid &amp; Delivered</strong> based on the quantities entered.
        </div>
      </>}
    </div>
    <div className="modal-footer">
      <button className="btn btn-secondary" onClick={()=>{stopCamera();onClose();}}>Cancel</button>
      <button className={`btn ${hasOverage?'btn-danger':'btn-success'}`} onClick={save} disabled={!hasSelection}>
        <Icon name="truck" size={14}/>{hasOverage?'Record Delivery (with overage)':'Record Delivery'}
      </button>
    </div>
  </Modal>;
}

// ── DELIVERY TICKET ──
// ══════════════════════════
function DeliveryTicketModal({delivery,onClose}) {
  const {allProducts} = useApp();
  const ticketRef=useRef();
  const handlePrint=()=>{
    const content=ticketRef.current.innerHTML;
    const win=window.open('','_blank','width=800,height=600');
    win.document.write(`<!DOCTYPE html><html><head><title>Delivery Ticket - ${delivery.customer}</title><style>body{font-family:'Inter',Arial,sans-serif;padding:40px;color:#1e293b}h2{margin:0 0 4px;font-size:22px}h4{margin:0;font-size:13px;color:#64748b;font-weight:400}table{width:100%;border-collapse:collapse;margin:20px 0}th{text-align:left;padding:10px 12px;background:#f8fafc;border-bottom:2px solid #e2e8f0;font-size:12px;font-weight:600;text-transform:uppercase}td{padding:8px 12px;border-bottom:1px solid #f1f5f9;font-size:14px}.sig{margin-top:60px;display:grid;grid-template-columns:1fr 1fr;gap:40px}.sig-line{border-top:1px solid #1e293b;padding-top:8px;font-size:12px;color:#64748b}.photos{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}.photos img{max-width:200px;border-radius:4px}.notes-box{margin:16px 0;padding:12px;border:1px solid #e2e8f0;border-radius:6px;background:#f8fafc}.overage-box{margin:16px 0;padding:12px;border:1px solid #fecaca;background:#fef2f2;border-radius:6px}@media print{body{padding:20px}}</style></head><body>${content}</body></html>`);
    win.document.close();win.print();
  };
  const productEntries=Object.entries(delivery.products||{}).filter(([,v])=>num(v)>0);
  const atts=delivery.attachments||[];
  const sigStamp = delivery.signedAt?new Date(delivery.signedAt).toLocaleString():null;
  return <Modal title="Delivery Ticket" onClose={onClose} wide>
    <div className="modal-body"><div ref={ticketRef}>
      <div style={{textAlign:'center',marginBottom:24,paddingBottom:16,borderBottom:'2px solid #1e293b'}}><h2>Quantum Ag — Delivery Ticket</h2><h4>BWF Product Delivery</h4></div>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10,marginBottom:20}}>
        <p style={{fontSize:14}}><strong>Customer:</strong> {delivery.customer}</p>
        <p style={{fontSize:14}}><strong>Delivery Date:</strong> {fmtDate(delivery.date)}</p>
        {delivery.deliveredBy&&<p style={{fontSize:14}}><strong>Delivered By:</strong> {delivery.deliveredBy}</p>}
        {num(delivery.pumpsOut)>0&&<p style={{fontSize:14}}><strong>Pumps Out:</strong> {fmt(num(delivery.pumpsOut))}{delivery.pumpsReturnDate?` (return by ${fmtDate(delivery.pumpsReturnDate)})`:''}</p>}
        {num(delivery.totes)>0&&<p style={{fontSize:14}}><strong>Totes:</strong> {fmt(num(delivery.totes))}</p>}
      </div>
      {productEntries.length>0&&<table><thead><tr><th>Product</th><th style={{textAlign:'right'}}>Quantity</th></tr></thead><tbody>
        {productEntries.map(([pid,qty])=>{const p=allProducts.find(x=>x.id===pid);return <tr key={pid}><td>{productDisplayName(p||{name:pid})}</td><td style={{textAlign:'right',fontWeight:600}}>{fmt(num(qty))}</td></tr>;})}
      </tbody></table>}

      {/* Overage disclosure — an over-delivered ticket must say so in print */}
      {delivery.overage&&Object.keys(delivery.overage).length>0&&<div className="overage-box" style={{margin:'16px 0',padding:12,border:'1px solid #fecaca',background:'#fef2f2',borderRadius:6}}>
        <strong style={{fontSize:13,color:'#b91c1c'}}>Delivered above ordered quantity — to be invoiced or weighed back:</strong>
        <ul style={{margin:'6px 0 0 18px',fontSize:13,color:'#991b1b'}}>
          {Object.entries(delivery.overage).map(([pid,q])=>{const p=allProducts.find(x=>x.id===pid);
            return <li key={pid}>{productDisplayName(p||{name:pid})}: +{fmt(num(q))}</li>;})}
        </ul>
      </div>}

      {/* ── ITEM 7: notes on the ticket ── */}
      {delivery.notes&&<div className="notes-box" style={{margin:'16px 0',padding:12,border:'1px solid #e2e8f0',borderRadius:6,background:'#f8fafc'}}>
        <strong style={{fontSize:12,textTransform:'uppercase',letterSpacing:.5,color:'#64748b'}}>Notes</strong>
        <p style={{fontSize:14,marginTop:6,whiteSpace:'pre-wrap'}}>{delivery.notes}</p>
      </div>}

      {atts.length>0&&<div><h4 style={{fontSize:13,fontWeight:600,margin:'16px 0 8px'}}>Attached Photos/Video</h4><div className="photos" style={{display:'flex',flexWrap:'wrap',gap:8}}>
        {atts.filter(a=>a.type==='photo'&&a.data).map((a,i)=><img key={i} src={a.data} style={{maxWidth:200,borderRadius:4}}/>)}
      </div></div>}

      {/* ── ITEM 9: electronic signatures ── */}
      <div style={{marginTop:50,display:'grid',gridTemplateColumns:'1fr 1fr',gap:40}}>
        <div>
          <div style={{minHeight:34,fontFamily:'Georgia,serif',fontStyle:'italic',fontSize:19,paddingBottom:2}}>{delivery.driverSig||''}</div>
          <div style={{borderTop:'1px solid #1e293b',paddingTop:8,fontSize:12,color:'#64748b'}}>
            Driver Signature{delivery.deliveredBy?` — ${delivery.deliveredBy}`:''}
          </div>
        </div>
        <div>
          <div style={{minHeight:34,fontFamily:'Georgia,serif',fontStyle:'italic',fontSize:19,paddingBottom:2}}>{delivery.customerSig||''}</div>
          <div style={{borderTop:'1px solid #1e293b',paddingTop:8,fontSize:12,color:'#64748b'}}>Customer Signature</div>
        </div>
      </div>
      {sigStamp&&(delivery.driverSig||delivery.customerSig)&&
        <p style={{fontSize:11,color:'#94a3b8',marginTop:10}}>Signed electronically {sigStamp}</p>}

      <div style={{marginTop:40,paddingTop:16,borderTop:'1px solid #e2e8f0',fontSize:12,color:'#94a3b8',textAlign:'center'}}>Quantum Ag — Generated {new Date().toLocaleDateString()}</div>
    </div></div>
    <div className="modal-footer"><button className="btn btn-secondary" onClick={onClose}>Close</button><button className="btn btn-primary" onClick={handlePrint}><Icon name="printer" size={14}/>Print / Save PDF</button></div>
  </Modal>;
}

// ══════════════════════════
// ── SETTINGS SCREEN ──
// ══════════════════════════
function SettingsScreen() {
  const {data,allProducts,allCustomers,addGroup,updateGroup,deleteGroup,updateSettings,addProduct,updateProduct,deleteProduct,addCustomer,updateCustomer,deleteCustomer,exportData,importData,showToast,setData,sbConnected,archivedYears,availableYears} = useApp();
  const [showGroupModal,setShowGroupModal] = useState(false);
  const [editGroup,setEditGroup] = useState(null);
  const [showProductModal,setShowProductModal] = useState(false);
  const [editProductId,setEditProductId] = useState(null);
  const [productSearch,setProductSearch] = useState('');
  const [showCustomerModal,setShowCustomerModal] = useState(false);
  const [editCustomerName,setEditCustomerName] = useState(null);
  const [customerSearch,setCustomerSearch] = useState('');
  const fileRef=useRef();
  const fy=data.settings||{};
  const [fyStartMonth,setFyStartMonth]=useState(fy.fiscalYearStart?.month||1);
  const [fyStartDay,setFyStartDay]=useState(fy.fiscalYearStart?.day||1);
  const [fyEndMonth,setFyEndMonth]=useState(fy.fiscalYearEnd?.month||12);
  const [fyEndDay,setFyEndDay]=useState(fy.fiscalYearEnd?.day||31);
  const [fyLabelMode,setFyLabelMode]=useState(fy.fiscalYearLabel||'end');
  const handleImport=e=>{const file=e.target.files[0];if(!file)return;const r=new FileReader();r.onload=ev=>importData(ev.target.result);r.readAsText(file);};
  const saveFiscalYear=()=>{updateSettings({fiscalYearStart:{month:parseInt(fyStartMonth),day:parseInt(fyStartDay)},fiscalYearEnd:{month:parseInt(fyEndMonth),day:parseInt(fyEndDay)},fiscalYearLabel:fyLabelMode});showToast('Fiscal year updated');};
  const toggleArchive=year=>{const archived=archivedYears.includes(year)?archivedYears.filter(y=>y!==year):[...archivedYears,year];updateSettings({archivedYears:archived});showToast(archivedYears.includes(year)?'Year unarchived':'Year archived');};

  const months=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

  return <div className="fade-in">
    <div className="page-header"><h2>Settings</h2><p>Manage products, customers, groups, fiscal year, and data sync</p></div>

    {/* Product Setup */}
    <div className="card"><div className="card-header"><h3>Product Setup</h3><button className="btn btn-primary btn-sm" onClick={()=>{setEditProductId(null);setShowProductModal(true);}}><Icon name="plus" size={14}/>Add Product</button></div>
      <div style={{marginBottom:12}}><input placeholder="Search products..." value={productSearch} onChange={e=>setProductSearch(e.target.value)} style={{maxWidth:300}}/></div>
      <div style={{maxHeight:400,overflowY:'auto'}}><table><thead><tr><th>Product Name</th><th>Packaging</th><th style={{textAlign:'right'}}>Price</th><th></th></tr></thead><tbody>
        {allProducts.filter(p=>(p.name+' '+p.packaging).toLowerCase().includes(productSearch.toLowerCase())).map(p=><tr key={p.id}>
          <td style={{fontWeight:500}}>{p.name}</td>
          <td>{p.packaging?<span className="tag" style={{background:p.packaging==='Tote'?'var(--purple-bg)':'var(--cyan-bg)',color:p.packaging==='Tote'?'var(--purple)':'var(--cyan)'}}>{p.packaging}</span>:<span style={{color:'var(--text-secondary)',fontSize:12}}>—</span>}</td>
          <td className="inv-cell">${p.price}</td>
          <td style={{textAlign:'right'}}>
            <button className="btn-icon" style={{marginRight:4}} onClick={()=>{setEditProductId(p.id);setShowProductModal(true);}}><Icon name="edit" size={14}/></button>
          </td>
        </tr>)}
      </tbody></table></div>
    </div>
    {showProductModal&&<ProductModal productId={editProductId} onClose={()=>setShowProductModal(false)}/>}

    {/* Customer Management */}
    <div className="card"><div className="card-header"><h3>Customer Management</h3><button className="btn btn-primary btn-sm" onClick={()=>{setEditCustomerName(null);setShowCustomerModal(true);}}><Icon name="plus" size={14}/>Add Customer</button></div>
      <div style={{marginBottom:12}}><input placeholder="Search customers..." value={customerSearch} onChange={e=>setCustomerSearch(e.target.value)} style={{maxWidth:300}}/></div>
      <div style={{maxHeight:300,overflowY:'auto'}}><table><thead><tr><th>Customer Name</th><th></th></tr></thead><tbody>
        {allCustomers.filter(c=>c.toLowerCase().includes(customerSearch.toLowerCase())).map(c=><tr key={c}>
          <td style={{fontWeight:500}}>{c}</td>
          <td style={{textAlign:'right'}}>
            <button className="btn-icon" style={{marginRight:4}} onClick={()=>{setEditCustomerName(c);setShowCustomerModal(true);}}><Icon name="edit" size={14}/></button>
          </td>
        </tr>)}
      </tbody></table></div>
    </div>
    {showCustomerModal&&<CustomerModal customerName={editCustomerName} onClose={()=>setShowCustomerModal(false)}/>}

    {/* ── ITEM 9: USERS (populate the "Delivered By" dropdown on delivery tickets) ── */}
    <div className="card"><div className="card-header"><h3>Users</h3>
      <button className="btn btn-primary btn-sm" onClick={()=>{
        const n=prompt('Add user name (appears in the "Delivered By" dropdown on delivery tickets):');
        if(n&&n.trim()){
          const list=data.settings?.users||[];
          if(list.includes(n.trim())){showToast('User already exists');return;}
          updateSettings({users:[...list,n.trim()].sort()});showToast('User added');
        }
      }}><Icon name="plus" size={14}/>Add User</button></div>
      <p style={{fontSize:12,color:'var(--text-secondary)',marginBottom:10}}>These names appear in the <strong>Delivered By</strong> and <strong>Received By</strong> selectors on delivery and return tickets.</p>
      <table><thead><tr><th>Name</th><th></th></tr></thead><tbody>
        {(data.settings?.users||[]).length===0
          ? <tr><td colSpan="2" style={{color:'var(--text-secondary)',fontSize:13,padding:16}}>No users yet.</td></tr>
          : (data.settings?.users||[]).map(u=><tr key={u}>
              <td style={{fontWeight:500}}>{u}</td>
              <td style={{textAlign:'right'}}><button className="btn-icon" onClick={()=>{
                const list=(data.settings?.users||[]).filter(x=>x!==u);
                if(list.length===0){showToast('Keep at least one user');return;}
                if(confirm(`Remove ${u}? Existing tickets keep their recorded name.`)) updateSettings({users:list});
              }}><Icon name="trash" size={14}/></button></td></tr>)}
      </tbody></table>
    </div>

    {/* Customer Groups */}
    <div className="card"><div className="card-header"><h3>Customer Groups</h3><button className="btn btn-primary btn-sm" onClick={()=>{setEditGroup(null);setShowGroupModal(true);}}><Icon name="plus" size={14}/>Add Group</button></div>
      <table><thead><tr><th>Group Name</th><th>Members</th><th></th></tr></thead><tbody>
        {data.customerGroups.map((g,i)=><tr key={i}><td style={{fontWeight:600}}>{g.name}</td><td>{g.members.join(', ')}</td><td style={{textAlign:'right'}}>
          <button className="btn-icon" style={{marginRight:4}} onClick={()=>{setEditGroup(i);setShowGroupModal(true);}}><Icon name="edit" size={14}/></button>
          <button className="btn-icon" onClick={()=>{if(confirm('Delete this group?'))deleteGroup(i);}}><Icon name="trash" size={14}/></button></td></tr>)}
      </tbody></table>
    </div>

    {/* Fiscal Year */}
    <div className="card"><div className="card-header"><h3>Fiscal Year Configuration</h3></div>
      <p style={{fontSize:13,color:'var(--text-secondary)',marginBottom:12}}>Define custom start/end dates for your order year. Orders are categorized into fiscal years based on their order date.</p>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr 1fr',gap:12,alignItems:'end'}}>
        <div className="form-group"><label>Start Month</label><select value={fyStartMonth} onChange={e=>setFyStartMonth(e.target.value)}>{months.map((m,i)=><option key={i} value={i+1}>{m}</option>)}</select></div>
        <div className="form-group"><label>Start Day</label><input type="number" min="1" max="31" value={fyStartDay} onChange={e=>setFyStartDay(e.target.value)}/></div>
        <div className="form-group"><label>End Month</label><select value={fyEndMonth} onChange={e=>setFyEndMonth(e.target.value)}>{months.map((m,i)=><option key={i} value={i+1}>{m}</option>)}</select></div>
        <div className="form-group"><label>End Day</label><input type="number" min="1" max="31" value={fyEndDay} onChange={e=>setFyEndDay(e.target.value)}/></div>
      </div>
      <div style={{display:'grid',gridTemplateColumns:'1fr auto',gap:12,alignItems:'end',marginTop:12}}>
        <div className="form-group"><label>Year Label</label><select value={fyLabelMode} onChange={e=>setFyLabelMode(e.target.value)}>
          <option value="end">End Year (e.g. Nov 2025–Oct 2026 → "2026")</option>
          <option value="start">Start Year (e.g. Nov 2025–Oct 2026 → "2025")</option>
          <option value="range">Range (e.g. Nov 2025–Oct 2026 → "2025-2026")</option>
        </select></div>
        <button className="btn btn-primary" onClick={saveFiscalYear}>Save</button>
      </div>
      {fyLabelMode!=='range'&&parseInt(fyStartMonth)!==1&&<p style={{fontSize:12,color:'var(--primary)',marginTop:8,fontStyle:'italic'}}>Preview: A fiscal year starting {months[parseInt(fyStartMonth)-1]} {fyStartDay}, 2025 through {months[parseInt(fyEndMonth)-1]} {fyEndDay}, 2026 will be labeled "<strong>{fyLabelMode==='end'?'2026':'2025'}</strong>"</p>}
    </div>

    {/* Year Archive */}
    <div className="card"><div className="card-header"><h3>Year Archive</h3></div>
      <p style={{fontSize:13,color:'var(--text-secondary)',marginBottom:12}}>Archive previous years to hide them from the default view. Archived years can still be accessed via the "Show Archived" toggle on the Orders screen.</p>
      <div style={{display:'flex',flexWrap:'wrap',gap:8}}>
        {availableYears.map(y=><div key={y} style={{display:'flex',alignItems:'center',gap:8,padding:'8px 14px',border:'1px solid var(--border)',borderRadius:6,background:archivedYears.includes(y)?'#f1f5f9':'#fff'}}>
          <span style={{fontWeight:600,fontSize:14}}>{y}</span>
          <button className="btn btn-sm btn-secondary" onClick={()=>toggleArchive(y)}>{archivedYears.includes(y)?'Unarchive':'Archive'}</button>
        </div>)}
      </div>
    </div>

    {/* Supabase */}
    <div className="card"><div className="card-header"><h3><Icon name="cloud" size={18} style={{marginRight:6}}/>Supabase Multi-User Sync</h3>
      <span className={`sb-status ${sbConnected?'sb-connected':'sb-disconnected'}`}><span className={`status-dot ${sbConnected?'dot-paid':'dot-pending'}`}></span>{sbConnected?'Connected':'Disconnected'}</span></div>
      <p style={{fontSize:13,color:'var(--text-secondary)',marginBottom:12}}>Real-time multi-user sync is active. All data — orders, inventory, deliveries, and settings — is automatically synced across all logged-in devices.</p>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12}}>
        <div className="form-group"><label>Project</label><input value={SB_URL} disabled style={{background:'#f8fafc',color:'var(--text-secondary)'}}/></div>
        <div className="form-group"><label>Status</label><input value={sbConnected?'Connected & syncing':'Connecting...'} disabled style={{background:sbConnected?'var(--success-bg)':'#f8fafc',color:sbConnected?'var(--success)':'var(--text-secondary)',fontWeight:600}}/></div>
      </div>
    </div>

    {/* Data Management */}
    <div className="card"><div className="card-header"><h3>Data Management</h3></div>
      <div style={{display:'flex',gap:12,flexWrap:'wrap'}}>
        <button className="btn btn-secondary" onClick={exportData}><Icon name="download" size={16}/>Export Data (JSON)</button>
        <button className="btn btn-secondary" onClick={()=>fileRef.current.click()}><Icon name="upload" size={16}/>Import Data</button>
        <input ref={fileRef} type="file" accept=".json" style={{display:'none'}} onChange={handleImport}/>
        <button className="btn btn-danger" onClick={()=>{if(confirm('Reset all data to defaults? This cannot be undone.')){setData(INITIAL_DATA);showToast('Data reset');}}}>Reset to Defaults</button>
      </div>
    </div>
    {showGroupModal&&<GroupModal groupIndex={editGroup} onClose={()=>setShowGroupModal(false)}/>}
  </div>;
}

function ProductModal({productId,onClose}) {
  const {allProducts,addProduct,updateProduct}=useApp();
  const existing=productId?allProducts.find(p=>p.id===productId):null;
  const [name,setName]=useState(existing?.name||'');
  const [packaging,setPackaging]=useState(existing?.packaging||'');
  const [price,setPrice]=useState(existing?.price||'');
  const save=()=>{
    if(!name.trim()){alert('Enter product name');return;}
    if(existing){
      updateProduct(productId,{name:name.trim(),packaging,price:parseFloat(price)||0});
    } else {
      const id=name.trim().toLowerCase().replace(/[^a-z0-9]+/g,'-')+(packaging===''?'':packaging==='Tote'?'-tote':'-25');
      if(allProducts.find(p=>p.id===id)){alert('Product with this ID already exists. Try a different name or packaging.');return;}
      addProduct({id,name:name.trim(),packaging,price:parseFloat(price)||0});
    }
    onClose();
  };
  return <Modal title={existing?'Edit Product':'Add New Product'} onClose={onClose}>
    <div className="modal-body">
      <div className="form-group"><label>Product Name</label><input value={name} onChange={e=>setName(e.target.value)} placeholder="e.g., BioCast Max"/></div>
      <div className="form-group"><label>Packaging</label><select value={packaging} onChange={e=>setPackaging(e.target.value)}>
        <option value="">None</option>
        <option value="2.5 Gal">2.5 Gal</option>
        <option value="Tote">Tote</option>
      </select></div>
      <div className="form-group"><label>Price ($)</label><input type="number" step="0.01" value={price} onChange={e=>setPrice(e.target.value)} placeholder="0.00"/></div>
      {name&&<p style={{fontSize:12,color:'var(--text-secondary)',marginTop:8}}>Will display as: <strong>{packaging?`${name.trim()} - ${packaging}`:name.trim()}</strong></p>}
    </div>
    <div className="modal-footer"><button className="btn btn-secondary" onClick={onClose}>Cancel</button><button className="btn btn-primary" onClick={save}>{existing?'Save Changes':'Add Product'}</button></div>
  </Modal>;
}

function CustomerModal({customerName,onClose}) {
  const {allCustomers,updateCustomer}=useApp();
  const [name,setName]=useState(customerName||'');
  const {addCustomer}=useApp();
  const isNew=!customerName;
  const save=()=>{
    if(!name.trim()){alert('Enter customer name');return;}
    if(isNew){
      if(allCustomers.includes(name.trim())){alert('Customer already exists');return;}
      addCustomer(name.trim());
    } else {
      if(name.trim()!==customerName&&allCustomers.includes(name.trim())){alert('Customer with this name already exists');return;}
      updateCustomer(customerName,name.trim());
    }
    onClose();
  };
  return <Modal title={isNew?'Add New Customer':'Edit Customer'} onClose={onClose}>
    <div className="modal-body">
      <div className="form-group"><label>Customer Name</label><input value={name} onChange={e=>setName(e.target.value)} placeholder="Enter customer name"/></div>
      {!isNew&&name.trim()!==customerName&&<p style={{fontSize:12,color:'var(--primary)',marginTop:4}}>All orders, deliveries, and group memberships will be updated to the new name.</p>}
    </div>
    <div className="modal-footer"><button className="btn btn-secondary" onClick={onClose}>Cancel</button><button className="btn btn-primary" onClick={save}>{isNew?'Add Customer':'Save Changes'}</button></div>
  </Modal>;
}

function GroupModal({groupIndex,onClose}) {
  const {data,allCustomers,addGroup,updateGroup}=useApp();
  const existing=groupIndex!==null?data.customerGroups[groupIndex]:null;
  const [name,setName]=useState(existing?.name||'');const [members,setMembers]=useState(existing?.members||[]);const [search,setSearch]=useState('');
  const toggle=c=>setMembers(ms=>ms.includes(c)?ms.filter(m=>m!==c):[...ms,c]);
  const save=()=>{if(!name){alert('Enter group name');return;}if(members.length<2){alert('Add at least 2 members');return;}if(existing)updateGroup(groupIndex,{name,members});else addGroup({name,members});onClose();};
  return <Modal title={existing?'Edit Group':'New Group'} onClose={onClose}>
    <div className="modal-body">
      <div className="form-group"><label>Group Name</label><input value={name} onChange={e=>setName(e.target.value)} placeholder="e.g., Webster Ag"/></div>
      <div className="form-group"><label>Members</label><input placeholder="Search customers..." value={search} onChange={e=>setSearch(e.target.value)} style={{marginBottom:8}}/>
        <div style={{maxHeight:250,overflowY:'auto',border:'1px solid var(--border)',borderRadius:6}}>
          {allCustomers.filter(c=>c.toLowerCase().includes(search.toLowerCase())).map(c=><label key={c} style={{display:'flex',alignItems:'center',gap:8,padding:'6px 12px',cursor:'pointer',fontSize:13,background:members.includes(c)?'var(--primary-bg)':''}}>
            <input type="checkbox" checked={members.includes(c)} onChange={()=>toggle(c)} style={{width:'auto'}}/>{c}</label>)}
        </div></div>
      {members.length>0&&<div style={{marginTop:8}}><span style={{fontSize:12,color:'var(--text-secondary)'}}>Selected: </span>{members.map(m=><span key={m} className="tag" style={{marginRight:4}}>{m}</span>)}</div>}
    </div>
    <div className="modal-footer"><button className="btn btn-secondary" onClick={onClose}>Cancel</button><button className="btn btn-primary" onClick={save}>Save Group</button></div>
  </Modal>;
}

// ══════════════════
// ── MAIN APP ──
// ══════════════════
function App() {
  const {toast,activeYear,setActiveYear,visibleYears,sbConnected} = useApp();
  const {user,logout} = useAuth();
  const [page,setPage] = useState('dashboard');
  const [pageArg,setPageArg] = useState(null);
  const [sidebarOpen,setSidebarOpen] = useState(false);
  const navigate=(pg,arg)=>{setPage(pg);setPageArg(arg||null);setSidebarOpen(false);};
  const navItems=[{id:'dashboard',label:'Dashboard',icon:'dashboard'},{id:'inventory',label:'Inventory',icon:'inventory'},{id:'orders',label:'Orders',icon:'orders'},{id:'deliveries',label:'Deliveries',icon:'truck'},{id:'customers',label:'Customers',icon:'users'},{id:'settings',label:'Settings',icon:'settings'}];
  const renderPage=()=>{switch(page){case'dashboard':return<Dashboard onNavigate={navigate}/>;case'inventory':return<InventoryScreen onNavigate={navigate}/>;case'orders':return<OrdersScreen onNavigate={navigate} navArg={pageArg}/>;case'deliveries':return<DeliveriesScreen onNavigate={navigate} navArg={pageArg}/>;case'customers':return<CustomersScreen onNavigate={navigate}/>;case'customer-detail':return<CustomerDetail customerName={pageArg} onBack={()=>navigate('customers')} onNavigate={navigate}/>;case'settings':return<SettingsScreen/>;default:return<Dashboard onNavigate={navigate}/>;}};
  return <>
    <div className="mobile-header"><button className="hamburger" onClick={()=>setSidebarOpen(!sidebarOpen)}><Icon name="menu" size={24}/></button><h1>Quantum Ag</h1><div style={{width:24}}></div></div>
    <div className={`sidebar ${sidebarOpen?'open':''}`}>
      <div className="sidebar-header"><h1>Quantum Ag</h1><p>Inventory & Delivery Tracker</p></div>
      <div className="nav-items">
        {navItems.map(n=><div key={n.id} className={`nav-item ${page===n.id?'active':''}`} onClick={()=>navigate(n.id)}><Icon name={n.icon}/>{n.label}</div>)}
      </div>
      <div className="year-select"><span>Year:</span><select value={activeYear} onChange={e=>setActiveYear(e.target.value)}>{visibleYears.map(y=><option key={y} value={y}>{y}</option>)}</select></div>
      {user && <div style={{padding:'8px 12px',borderTop:'1px solid #1e293b'}}>
        <div style={{fontSize:11,color:'#94a3b8',marginBottom:6,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}} title={user.email}>{user.email}</div>
        <button onClick={logout} style={{background:'none',border:'1px solid #334155',borderRadius:4,color:'#94a3b8',fontSize:11,padding:'4px 10px',cursor:'pointer',width:'100%',transition:'all .15s'}} onMouseEnter={e=>{e.target.style.background='#1e293b';e.target.style.color='#e2e8f0'}} onMouseLeave={e=>{e.target.style.background='none';e.target.style.color='#94a3b8'}}>Sign Out</button>
      </div>}
      <div style={{padding:'8px 12px',borderTop:'1px solid #1e293b',fontSize:11,color:'#475569',display:'flex',justifyContent:'space-between',alignItems:'center'}}>
        <span>v{APP_VERSION}</span>
        <span className={`sb-status ${sbConnected?'sb-connected':'sb-disconnected'}`} style={{padding:'2px 8px',fontSize:10}}>
          <span className={`status-dot ${sbConnected?'dot-paid':'dot-pending'}`}></span>{sbConnected?'Synced':'Local'}
        </span>
      </div>
    </div>
    <div className="main">{renderPage()}</div>
    {toast&&<div className="toast">{toast}</div>}
  </>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<AuthGate><AppProvider><App/></AppProvider></AuthGate>);
</script>
</body>
</html>
